# lc-egress forward proxy (design §3.4).
# open-terminal routes all HTTP/HTTPS through here; only hosts matching
# egress-allowlist.txt are reachable. Everything else is denied.
Port 8888
Listen 0.0.0.0
Timeout 600

# Clients are on the internal lc-net only — they have no other egress, so a
# broad Allow here is safe; the host allowlist below is the real control.
Allow 0.0.0.0/0

# Default-deny: a request is permitted only if its host matches the filter.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/egress-allowlist.txt"
FilterExtended On
FilterCaseSensitive Off

# HTTPS git remotes (CONNECT to 443) and SSH git remotes (CONNECT to 22).
ConnectPort 443
ConnectPort 22

DisableViaHeader Yes
LogLevel Warning
