  # =====================================================================
  # llm-gateway-ui — LiteLLM ADMIN-UI sidecar (analytics dashboard). Added
  # 2026-06-14. A SECOND LiteLLM instance whose ONLY job is to serve the Admin
  # UI at /ui. LiteLLM 1.88.1 REQUIRES a master_key for the UI to log in; setting
  # one on the permissive main gateway would 401 every junk-key caller. So the
  # master_key is ISOLATED here. This instance:
  #   - serves NO inference — it deliberately carries NO llama-cpp /
  #     llama-cpp-embed network alias (those stay on llm-gateway), and no caller
  #     points at it. The gateway-only routing policy is unaffected.
  #   - shares llm-gateway-db (same DATABASE_URL) so the dashboard reads the SAME
  #     spend ledger the main gateway writes.
  #   - is reached ONLY via the tailnet :8445 serve route (entrypoint.sh) — no
  #     host port, internal-only net, same supply-chain posture as llm-gateway.
  # Remove = delete this service + config/litellm.ui.config.yaml + the :8445
  # serve block in entrypoint.sh + the .env LITELLM_UI_* vars.
  # =====================================================================

  # (little-coder-backup moved to the coder project 2026-08-21, K.4.)

  # =====================================================================
  # Unified snapshot backups (post-2026-05-29 plan).
  # Six new containers covering the gaps from the post-implementation
  # audit: OB1 PostgreSQL + wiki, Open Notebook (SurrealDB + notebook_data),
  # smolcrawl pipelines, Tailscale state, the llama.cpp model store. All write
  # under ./backups/<service>/ with .sha256 sentinels and configurable
  # retention. The existing weekly NAS sync (scripts/backup/backup-to-nas.ps1)
  # picks them up automatically.
  # =====================================================================

  # (openbrain-db-backup + openbrain-wiki-backup moved to the OB1 project
  #  2026-08-21 -- OB1 owns its own backup sidecars now that it is a
  #  self-contained submodule: OB1/docker/docker-compose.yml. Output still
  #  lands in ./backups/openbrain-{db,wiki} so NAS mirror + watchers hold.)


  # open-notebook-backup -- two-phase:
  #   (1) SurrealDB logical export via the `surreal` CLI over the WebSocket
  #       RPC endpoint. NEVER tar /mydata directly -- RocksDB corrupts.
  #   (2) tarball of the host bind mount D:\Open WebUI\open-notebook\notebook_data
  #       (application-layer files; small).
  # Hot-safe: no surrealdb container stop needed.

  open-notebook-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile.surreal
    image: open-notebook-backup:local
    container_name: open-notebook-backup
    networks:
      - default     # surrealdb is on default; we reach it via DNS name 'surrealdb'
    environment:
      # Same credentials the open_notebook runtime uses (proven valid against
      # this datastore). Was hardcoded root/root — that leaned on SurrealDB's
      # persisted first-boot root user, and left a literal credential in a
      # tracked file. Note the datastore still ACCEPTS the legacy root login
      # until a DEFINE USER pass rotates it (SurrealDB v2: start --user/--pass
      # is only honored on first boot); network isolation (default bridge,
      # localhost-only host port) remains the real boundary.
      - SURREAL_URL=http://surrealdb:8000
      - SURREAL_USER=${SURREAL_USER}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD}
      - SURREAL_NS=open_notebook
      - SURREAL_DB=open_notebook
      - NOTEBOOK_DATA_DIR=/notebook-data
      - BACKUP_DIR=/backups
      - RETAIN_COUNT=${OPEN_NOTEBOOK_BACKUP_RETAIN_COUNT:-2}
      - BACKUP_CRON=${OPEN_NOTEBOOK_BACKUP_CRON:-20 2 * * *}
      - TZ=UTC
    volumes:
      - D:\Open WebUI\open-notebook\notebook_data:/notebook-data:ro
      - ./backups/open-notebook:/backups
      - ./backup/open-notebook-backup.sh:/scripts/backup.sh:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m       # large enough for the surreal export staging file
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 50
    command:
      - sh
      - -c
      - |
        printf '%s sh /scripts/backup.sh\n' "$$BACKUP_CRON" > /tmp/crontab.rendered
        echo "[$$(date -u +%FT%TZ)] open-notebook-backup scheduler started (cron: $$BACKUP_CRON, retain: $${RETAIN_COUNT} most recent)"
        exec /usr/local/bin/supercronic /tmp/crontab.rendered
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # smolcrawl-backup -- tar of smolcrawl-data named volume (deep_research
