# compose/inference.yml - LiteLLM front door (llm-gateway + db/ui) -> llm-queue -> llama.cpp upstreams
# Split from the 2,2xx-line root docker-compose.yml 2026-08-20 (CLEANUP-PLAN v3 D.1).
# Networks/volumes are defined in the root file.
services:
  llama-cpp-upstream:
    image: ghcr.io/mostlygeek/llama-swap:cuda
    container_name: llama-cpp-upstream
    # Isolated behind the gateway (2026-06-13): only llm-gateway (+ the
    # lm-models-backup liveness probe) can reach this real inference server.
    # Callers reach inference via the `llama-cpp` alias on llm-gateway and
    # cannot route around LiteLLM. See the llm-backend-net definition below.
    networks:
      - llm-backend-net
    command:
      - -config
      - /app/config.yaml
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - C:\Users\yamao\.lmstudio\models:/models:ro
      - ./config/llama-swap.config.yaml:/app/config.yaml:ro
      - ./config/chat-template.jinja:/etc/llama/chat-template.jinja:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_LLAMA_CPP_DEVICE_ID:-0}
      - CUDA_VISIBLE_DEVICES=${GPU_LLAMA_CPP_DEVICE_ID:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LLAMA_CPP_TIMEOUT=${LLAMA_CPP_TIMEOUT:-300}
      - LLAMA_CPP_CACHE_TYPE_K=${LLAMA_CPP_CACHE_TYPE_K:-q4_0}
      - LLAMA_CPP_CACHE_TYPE_V=${LLAMA_CPP_CACHE_TYPE_V:-q4_0}
      # Max KV context-checkpoints per slot. Inherited by every
      # llama-server llama-swap spawns. Build default is 32; at 256k ctx
      # each checkpoint is ~150 MiB, so 32 wasted ~4.8 GB of churning,
      # low-yield cache. 2 keeps recent-prefix reuse, frees ~4 GB.
      - LLAMA_ARG_CTX_CHECKPOINTS=${LLAMA_ARG_CTX_CHECKPOINTS:-2}
      - LLAMA_SWAP_QWEN36_35B_MODEL_PATH=${LLAMA_SWAP_QWEN36_35B_MODEL_PATH:-/models/lmstudio-community/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-Q4_K_M.gguf}
      - LLAMA_SWAP_QWEN36_35B_CTX_SIZE=${LLAMA_SWAP_QWEN36_35B_CTX_SIZE:-262144}
      - LLAMA_SWAP_QWEN36_35B_N_GPU_LAYERS=${LLAMA_SWAP_QWEN36_35B_N_GPU_LAYERS:-99}
      - LLAMA_SWAP_QWEN36_35B_N_PARALLEL=${LLAMA_SWAP_QWEN36_35B_N_PARALLEL:-1}
      - LLAMA_SWAP_QWEN36_35B_BATCH=${LLAMA_SWAP_QWEN36_35B_BATCH:-1024}
      - LLAMA_SWAP_QWEN36_35B_UBATCH=${LLAMA_SWAP_QWEN36_35B_UBATCH:-512}
      - LLAMA_SWAP_QWEN36_35B_CACHE_TYPE_K=${LLAMA_SWAP_QWEN36_35B_CACHE_TYPE_K:-q4_0}
      - LLAMA_SWAP_QWEN36_35B_CACHE_TYPE_V=${LLAMA_SWAP_QWEN36_35B_CACHE_TYPE_V:-q4_0}
      - LLAMA_SWAP_QWEN36_35B_REASONING_BUDGET=${LLAMA_SWAP_QWEN36_35B_REASONING_BUDGET:-4096}
      - LLAMA_SWAP_QWEN36_27B_MODEL_PATH=${LLAMA_SWAP_QWEN36_27B_MODEL_PATH:-/models/lmstudio-community/Qwen3.6-27B-GGUF/Qwen3.6-27B-Q4_K_M.gguf}
      - LLAMA_SWAP_QWEN36_27B_CTX_SIZE=${LLAMA_SWAP_QWEN36_27B_CTX_SIZE:-262144}
      - LLAMA_SWAP_QWEN36_27B_N_GPU_LAYERS=${LLAMA_SWAP_QWEN36_27B_N_GPU_LAYERS:-99}
      # parallel=2 -> two concurrent 131072-token lanes (256k / 2).
      # Interactive chat no longer blocks behind a background mnemory
      # extraction or a long research synthesis. Same model id.
      - LLAMA_SWAP_QWEN36_27B_N_PARALLEL=${LLAMA_SWAP_QWEN36_27B_N_PARALLEL:-2}
      - LLAMA_SWAP_QWEN36_27B_BATCH=${LLAMA_SWAP_QWEN36_27B_BATCH:-1024}
      - LLAMA_SWAP_QWEN36_27B_UBATCH=${LLAMA_SWAP_QWEN36_27B_UBATCH:-512}
      - LLAMA_SWAP_QWEN36_27B_CACHE_TYPE_K=${LLAMA_SWAP_QWEN36_27B_CACHE_TYPE_K:-q4_0}
      - LLAMA_SWAP_QWEN36_27B_CACHE_TYPE_V=${LLAMA_SWAP_QWEN36_27B_CACHE_TYPE_V:-q4_0}
      - LLAMA_SWAP_QWEN36_27B_REASONING_BUDGET=${LLAMA_SWAP_QWEN36_27B_REASONING_BUDGET:-4096}
      # Speculative decoding for the 27B entry. `draft-mtp` (set in .env,
      # 2026-07-09) self-drafts via the MTP head in the ThinkingCap GGUF;
      # compose default stays `none` so a bare env is conservative and old
      # llama-server builds still parse the flag.
      - LLAMA_SWAP_QWEN36_27B_SPEC_TYPE=${LLAMA_SWAP_QWEN36_27B_SPEC_TYPE:-none}
      - LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_N_MAX=${LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_N_MAX:-2}
      # Draft (MTP) KV cache type. Build default f16 blew VRAM to 98.9% at
      # 256k ctx (crash line is ~95%); .env pins q4_0 to match the main KV.
      - LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_CACHE_TYPE_K=${LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_CACHE_TYPE_K:-f16}
      - LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_CACHE_TYPE_V=${LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_CACHE_TYPE_V:-f16}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_LLAMA_CPP_DEVICE_ID:-0}"]
              capabilities: [gpu]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Phase 1: basic liveness. Phase 2: slot watchdog — if any slot stays in
      # "processing" state for > 15 min (900 s), kill llama-server so Docker
      # restarts the container. Timestamp is stored in /tmp/.sb between checks.
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:8080/health || exit 1; SLOTS=$$(curl -sf --max-time 5 http://localhost:8080/slots 2>/dev/null); if echo \"$$SLOTS\" | grep -q '\"state\":[1-9]'; then [ -f /tmp/.sb ] || date +%s > /tmp/.sb; NOW=$$(date +%s); START=$$(cat /tmp/.sb 2>/dev/null || echo $$NOW); AGE=$$((NOW - START)); if [ $$AGE -gt 900 ]; then rm -f /tmp/.sb; pkill llama-server 2>/dev/null; exit 1; fi; else rm -f /tmp/.sb 2>/dev/null; fi"]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 120s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  llama-cpp-embed-upstream:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-embed-upstream
    # Isolated behind the gateway (2026-06-13) — see llama-cpp-upstream.
    networks:
      - llm-backend-net
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./data/models/embeddings:/models:ro
    environment:
      # NVIDIA_VISIBLE_DEVICES selects host GPU exposed to this container.
      # CUDA_VISIBLE_DEVICES intentionally unset: NVIDIA Container Toolkit
      # reindexes visible GPUs starting at 0 inside the container, so setting
      # CUDA_VISIBLE_DEVICES to the *host* index makes CUDA see no devices.
      - NVIDIA_VISIBLE_DEVICES=${GPU_LLAMA_CPP_EMBED_DEVICE_ID:-1}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LLAMA_ARG_MODEL=/models/bge-m3-f16.gguf
      - LLAMA_ARG_CTX_SIZE=20480
      - LLAMA_ARG_N_GPU_LAYERS=99
      - LLAMA_ARG_N_PARALLEL=2
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_EMBEDDINGS=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_LLAMA_CPP_EMBED_DEVICE_ID:-1}"]
              capabilities: [gpu]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # =====================================================================
  # llm-queue — B2 front-ended inference ADMISSION CONTROLLER.
  # Sits BETWEEN LiteLLM (the caller-facing front door) and the *-upstream real
  # servers, on llm-backend-net only. It holds-and-dispatches requests instead of
  # letting llama-swap drop the overflow with a flat `429 Too many requests`:
  #   callers → llama-cpp:8080 → llm-gateway (LiteLLM) → llm-queue → *-upstream
  # LiteLLM stays the front door + ledger; the queue is the admission/scheduling
  # layer it forwards through (design B2, NOT B1). It is a SECOND member of the
  # backend plane, DOWNSTREAM of the gateway, so "LiteLLM is the front door" holds.
  # The mutating control API is NEVER exposed on llm-net or a host port (design
  # §10.3.1) — read-only state reaches llm-net via a LiteLLM pass-through (P2).
  # Tuning invariant (design §10.2): LLM_QUEUE_SLOTS == llama-swap --parallel (3),
  # LLM_QUEUE_MAX_IN_FLIGHT <= SLOTS+1, and llama-swap concurrencyLimit == 0 so
  # the ordered depth lives in OUR heap, not llama.cpp's opaque FIFO.
  # Docs: documentation/implementation-guide/LiteLLM-Proxy/DESIGN-B2-inference-queue.md
  # =====================================================================

  llm-queue:
    build:
      context: ./llm-queue
      dockerfile: Dockerfile
    image: llm-queue:local
    container_name: llm-queue
    # llm-backend-net ONLY: reachable by llm-gateway, reaches *-upstream. Keeping
    # it off llm-net is what keeps the mutating control API operator-only (§3.3).
    networks:
      - llm-backend-net
    environment:
      # Forward targets — the ONLY sanctioned *-upstream references outside the
      # gateway config. check-llm-gateway-routing.ps1 sanctions the
      # LLM_QUEUE_UPSTREAM token specifically (§3.2).
      - LLM_QUEUE_UPSTREAM_BASE_URL=http://llama-cpp-upstream:8080
      - LLM_QUEUE_EMBED_UPSTREAM_BASE_URL=http://llama-cpp-embed-upstream:8080
      # Admission sizing — MUST track LLAMA_SWAP_QWEN36_27B_N_PARALLEL (.env;
      # 2 since 2026-07-09). Values live in .env next to that var.
      - LLM_QUEUE_SLOTS=${LLM_QUEUE_SLOTS:-3}
      - LLM_QUEUE_MAX_IN_FLIGHT=${LLM_QUEUE_MAX_IN_FLIGHT:-4}
      - LLM_QUEUE_BACKSTOP_DEPTH=${LLM_QUEUE_BACKSTOP_DEPTH:-24}
      - LLM_QUEUE_MAX_TOTAL_CONNECTIONS=${LLM_QUEUE_MAX_TOTAL_CONNECTIONS:-128}
      # Rolling completion-T metric.
      - LLM_QUEUE_T_WINDOW=${LLM_QUEUE_T_WINDOW:-5}
      - LLM_QUEUE_T_INITIAL_S=${LLM_QUEUE_T_INITIAL_S:-30}
      # P2 (2026-06-14): budget enforcement ON. Admission gated by per-service
      # projected-wait budgets (§8b) on top of the depth backstop; priority
      # classes (§8c) order dispatch; per-key max-concurrency (§8d) caps batch
      # callers. Budgets are generous (owui-chat 30s … batch 600s) so normal load
      # passes; only genuine saturation rejects-with-estimate. Set to false to
      # revert to P1 depth-only admission.
      - LLM_QUEUE_ENFORCE_BUDGET=${LLM_QUEUE_ENFORCE_BUDGET:-true}
      - LLM_QUEUE_UPSTREAM_TIMEOUT_S=${LLM_QUEUE_UPSTREAM_TIMEOUT_S:-600}
      - LLM_QUEUE_LOG_LEVEL=${LLM_QUEUE_LOG_LEVEL:-INFO}
      # P3 analytics: admit/finish/reject events with estimate-vs-actual →
      # llm-queue's OWN SQLite store (NOT LiteLLM's schema-managed Postgres, §4.4).
      # The db is on llm-net (unreachable from llm-backend-net), so the queue keeps
      # its own store and the §5 join happens at query time.
      - LLM_QUEUE_EVENTS_DB_PATH=${LLM_QUEUE_EVENTS_DB_PATH:-/data/events.db}
    volumes:
      - llm-queue-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      llama-cpp-upstream:
        condition: service_healthy
    healthcheck:
      # Liveness only — NEVER probes the upstream (a probe would force a
      # llama-swap model load → swap thrash, design §4.2).
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # =====================================================================
  # LiteLLM gateway — transparent interposition (guide §1A). STANDUP FORM:
  # stands up ALONGSIDE the running llama-cpp / llama-cpp-embed with NO aliases
  # yet — nothing routes through it until the cut-in (flip) renames the real
  # servers to *-upstream and gives the gateway the llama-cpp / llama-cpp-embed
  # aliases. See documentation/implementation-guide/LiteLLM-Proxy/CUT-IN-READY.md.
  # PERMISSIVE (no master_key) — attribution by the key string each caller sends
  # (proven by the T0 spike, 2026-06-12). Forwards by model name to llama-cpp.
  # =====================================================================

  llm-gateway:
    # Digest-pinned — supply-chain hardening (guide §19/D9; CVE-2025-55182).
    # Bump deliberately: docker pull ghcr.io/berriai/litellm:main-stable;
    #   docker inspect ... --format '{{index .RepoDigests 0}}'; confirm the
    #   release is outside any known compromise window; paste sha256; recreate;
    #   re-run the model-list + spend-log verification.
    image: ghcr.io/berriai/litellm@sha256:c98c9395c56a35b7abacff8269d43ff99aabacb62bbf42a04cc1514fcb9bde4a
    container_name: llm-gateway
    networks:
      llm-net:
        aliases:
          - llama-cpp           # transparent flip: callers' http://llama-cpp:8080 land here
          - llama-cpp-embed     # transparent flip: callers' http://llama-cpp-embed:8080 land here
      # The gateway is the ONLY member of both planes: it faces callers on
      # llm-net (aliases above) and reaches the isolated real servers on
      # llm-backend-net (below). This is what makes it the sole ingress to
      # *-upstream — callers on llm-net cannot reach the upstreams directly.
      llm-backend-net: {}
    # NO host port: the gateway sits ONLY on the internal-only `llm-net`, so
    # Docker silently suppresses any host publish (a `ports:` mapping here would
    # show in `docker inspect .HostConfig.PortBindings` but NEVER bind — verified:
    # NetworkSettings.Ports is empty and 127.0.0.1:4000 is unreachable). Keeping
    # the gateway off any internet-capable bridge is the supply-chain posture
    # (guide §19 — no outbound). Admin / spend-ledger access is IN-NETWORK only:
    #   docker exec llm-gateway python -c "...urllib... http://localhost:8080/..."
    #   docker exec llm-gateway-db psql -U litellm -d litellm -c '...'
    # The llm-traffic OWUI module reaches it the same way (OWUI is on llm-net).
    volumes:
      - ./config/litellm.config.yaml:/app/config.yaml:ro
      # J.1 (2026-08-21): pre-call hook injecting x-ai-stack-caller from the
      # virtual key's metadata - the identity signal llm-queue lanes key on.
      - ./config/litellm/custom_callbacks.py:/app/custom_callbacks.py:ro
    command: ["--config", "/app/config.yaml", "--port", "8080"]
    environment:
      # DATABASE_URL expands ${LITELLM_DB_PASSWORD} from .env at compose-parse time.
      - DATABASE_URL=postgres://litellm:${LITELLM_DB_PASSWORD}@llm-gateway-db:5432/litellm
      # J.1: master_key (virtual-key enforcement) - config reads it via os.environ
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_LOCAL_MODEL_COST_MAP=True   # bundled cost map; no GitHub fetch at boot (guide §19/D10)
    depends_on:
      llama-cpp-upstream:
        condition: service_healthy
      llama-cpp-embed-upstream:
        condition: service_healthy
      # B2: LiteLLM forwards chat through llm-queue (api_base), so the queue must
      # be up first. The embed plane still goes direct to *-upstream until P4.
      llm-queue:
        condition: service_healthy
      llm-gateway-db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The litellm image is wolfi-based and has NO curl (T0 finding) — use python.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health/liveliness').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # first boot runs prisma migrations (~60-90s, T0 finding)
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  llm-gateway-db:
    image: postgres:16-alpine
    container_name: llm-gateway-db
    networks:
      - llm-net
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
    volumes:
      - llm-gateway-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  llm-gateway-ui:
    # Same digest-pinned image as llm-gateway (keep them in lockstep on bumps so
    # the shared Postgres schema/prisma migrations never diverge).
    image: ghcr.io/berriai/litellm@sha256:c98c9395c56a35b7abacff8269d43ff99aabacb62bbf42a04cc1514fcb9bde4a
    container_name: llm-gateway-ui
    # llm-net ONLY (reaches llm-gateway-db). NO aliases — must never be an
    # inference path. NOT on llm-backend-net (can't reach the upstreams).
    networks:
      - llm-net
    volumes:
      - ./config/litellm.ui.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "8080"]
    environment:
      - DATABASE_URL=postgres://litellm:${LITELLM_DB_PASSWORD}@llm-gateway-db:5432/litellm
      - LITELLM_LOCAL_MODEL_COST_MAP=True   # bundled cost map; no GitHub fetch (guide §19/D10)
      # master_key UNLOCKS the Admin UI (and is enforced on THIS instance's API
      # only — which has no callers). UI_USERNAME/PASSWORD set the dashboard login.
      - LITELLM_MASTER_KEY=${LITELLM_UI_MASTER_KEY}
      - UI_USERNAME=${LITELLM_UI_USERNAME}
      - UI_PASSWORD=${LITELLM_UI_PASSWORD}
    depends_on:
      llm-gateway-db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # wolfi-based image has no curl (T0 finding) — use python.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health/liveliness').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

