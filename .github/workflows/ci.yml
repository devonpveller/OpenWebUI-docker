          $global:LASTEXITCODE = 199
          & ./.github/ci/run-check.ps1 -Check boundary-drill -Script './scripts/checks/drill-personal-plane-exclusion.ps1' -ScriptArgs '-AcceptDispositionedGaps' -Command './scripts/checks/drill-personal-plane-exclusion.ps1 -AcceptDispositionedGaps'
