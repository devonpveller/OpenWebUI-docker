# CI (CLEANUP-PLAN v3 I.1), added 2026-08-20.
# NOTE: first-run tuning expected — this repo has never had CI. Jobs are
# ordered cheap-first. agent-bridge's 700+ test suite runs in Docker locally
# (see agent-org/); porting it here means building its image in CI — deferred
# until this baseline is proven green.
name: ci

on:
  push:
    branches: [main, development, "feature/**", "refactor/**", "update/**"]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — scans every commit on the branch
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .env.example is kept complete on purpose (v3 A.4) — it makes compose
      # interpolation resolvable in CI without any real secret. Since Part K
      # (2026-08-21) the workspace is one anchor + per-plane compose projects;
      # validate every one of them. (OB1 is a submodule with its own gitignored
      # env — not checked out here; agent-org likewise carries its own env.)
      # Plane files also declare env_file: .env for CONTAINER env — `config`
      # stats that file, which exists on the host but not on a runner. Stub it
      # from the example (found 2026-08-23 by PR #28, the first PR through CI).
      - run: cp .env.example .env
      - run: docker compose --env-file .env.example config -q
      - run: docker compose -f inference/docker-compose.yml --env-file .env.example config -q
      - run: docker compose -f frontend/docker-compose.yml --env-file .env.example config -q
      - run: docker compose -f memory/docker-compose.yml --env-file .env.example config -q
      - run: docker compose -f search/docker-compose.yml --env-file .env.example config -q
      - run: docker compose -f coder/docker-compose.yml --env-file .env.example config -q
      - run: docker compose -f portal/docker-compose.yml --env-file .env.example --profile internet config -q

  powershell-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The ops plane is PowerShell 5.1 on the host; pwsh's PSParser catches
      # the same syntax-error class in CI so a broken script never lands.
      - shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '[\\/](archive|OB1|node_modules)[\\/]' } |
            ForEach-Object {
              $errs = $null
              [System.Management.Automation.PSParser]::Tokenize((Get-Content $_.FullName -Raw), [ref]$errs) | Out-Null
              if ($errs.Count -gt 0) { Write-Host "PARSE ERROR: $($_.FullName) - $($errs[0].Message)"; $bad++ }
            }
          if ($bad -gt 0) { exit 1 }
          Write-Host "all .ps1 files parse clean"

  pytest-llm-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./llm-queue[dev]"
      - run: pytest -q llm-queue/tests

  pytest-search-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./search-gateway/gateway[dev]"
      - run: pytest -q search-gateway/gateway/tests

  bridge-stdlib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # stdlib-only by design (they run on the bare Windows host too)
      - run: python scripts/claude-sessions-bridge/test_follows.py
      - run: python scripts/claude-sessions-bridge/test_lanes.py
