# CI (CLEANUP-PLAN v3 I.1), added 2026-08-20.
# NOTE: first-run tuning expected — this repo has never had CI. Jobs are
# ordered cheap-first. agent-bridge's 700+ test suite runs in Docker locally
# (see agent-org/); porting it here means building its image in CI — deferred
# until this baseline is proven green.
#
# 2026-09-01 (dark-factory-unification PLAN.md C.9 H4): the verification machinery
# — the boundary drill, the H1/H2 drills, the RLS proof, the corpus-exposure gate
# and (until 2026-09-25) dfu-done.ps1's runnable clauses — is wired in below, so a later refactor
# cannot break one of them silently. Read the block above `dfu-static-checks`
# before changing any of it: those jobs do NOT all pass on exit 0, and the
# mapping from exit code to build outcome lives in `.github/ci/expected-exit.ps1`.
name: ci

on:
  push:
    # `development` is the live-hosted line (CLAUDE.md, branch policy 2026-08-22).
    # It replaced `develop`, which was in this list from the day the file was written
    # and NAMED A BRANCH THAT HAS NEVER EXISTED — so no push to the real line had ever
    # started a run here. That one-word fix landed separately on the work line (5e5ac6f);
    # this comment is the part H4 owns, because H4's claim depends on it:
    #
    # THAT RENAME DOES NOT, BY ITSELF, MAKE CI RUN ON `development`. GitHub resolves
    # a push workflow from the ref being PUSHED, so a push to `development` runs
    # `development`'s OWN copy of this file. Until the operator promotes this line
    # into `development`, that copy is still the one triggering on `develop`.
    # H4's "shown green on a CI run" therefore depends on that promotion; it is
    # not something a feature branch can arrange, and adding `development` to some
    # other trigger would not be that proof either.
    branches: [main, development, "feature/**", "refactor/**", "update/**"]
  pull_request:
  # So the operator can run the H4 jobs on demand on any branch — including on
  # `development` the moment this file lands there.
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — scans every commit on the branch
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Each plane's .env.example is kept complete FOR THAT PLANE (v3 A.4;
      # per-plane since sl-env-split 2026-09-19) — it makes compose
      # interpolation resolvable in CI without any real secret. Since Part K
      # (2026-08-21) the workspace is one anchor + per-plane compose projects;
      # validate every one of them. (OB1 is a submodule with its own gitignored
      # env — not checked out here; agent-org likewise carries its own env.)
      # `.env` STUBS: compose stats a service-level `env_file:` against whatever
      # file the CLI was given, and those exist on the host but not on a runner
      # (found 2026-08-23 by PR #28, the first PR through CI). One per PROJECT
      # DIRECTORY now, because that is where compose looks.
      - run: cp .env.example .env
      - run: |
          for p in frontend inference memory search coder portal; do
            cp "$p/.env.example" "$p/.env"
          done
      # --env-file is passed EXPLICITLY here even though compose would load
      # <plane>/.env natively: the committed example is the deterministic input,
      # and naming it also suppresses the native load of the stub above.
      - run: docker compose --env-file .env.example config -q
      - run: docker compose -f inference/docker-compose.yml --env-file inference/.env.example config -q
      - run: docker compose -f inference/docker-compose.yml --env-file inference/.env.example --profile local config -q
      - run: docker compose -f frontend/docker-compose.yml --env-file frontend/.env.example config -q
      - run: docker compose -f frontend/docker-compose.yml --env-file frontend/.env.example --profile gpu --profile tailscale config -q
      - run: docker compose -f memory/docker-compose.yml --env-file memory/.env.example config -q
      - run: docker compose -f search/docker-compose.yml --env-file search/.env.example config -q
      - run: docker compose -f coder/docker-compose.yml --env-file coder/.env.example config -q
      - run: docker compose -f portal/docker-compose.yml --env-file portal/.env.example --profile internet config -q

  powershell-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The ops plane is PowerShell 5.1 on the host; pwsh's PSParser catches
      # the same syntax-error class in CI so a broken script never lands.
      - shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '[\\/](archive|OB1|node_modules)[\\/]' } |
            ForEach-Object {
              $errs = $null
              [System.Management.Automation.PSParser]::Tokenize((Get-Content $_.FullName -Raw), [ref]$errs) | Out-Null
              if ($errs.Count -gt 0) { Write-Host "PARSE ERROR: $($_.FullName) - $($errs[0].Message)"; $bad++ }
            }
          if ($bad -gt 0) { exit 1 }
          Write-Host "all .ps1 files parse clean"

  pytest-llm-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./inference/llm-queue[dev]"
      - run: pytest -q inference/llm-queue/tests

  pytest-search-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e "./search/gateway[dev]"
      - run: python -m pytest search/gateway/tests -q

  stack-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Same .env stubs as compose-validate, for the same reason: `config` stats
      # a service-level `env_file:` against the CLI's file, and the driver's
      # render_project() refuses a plane whose real env file is absent. The
      # inventory generator RENDERS with the .example files (deliberate and
      # deterministic - see render_env_path in stack.py), but compose still needs
      # `<project dir>/.env` to EXIST. One per project directory since
      # sl-env-split (2026-09-19).
      - run: cp .env.example .env
      - run: |
          for p in frontend inference memory search coder portal; do
            cp "$p/.env.example" "$p/.env"
          done
      - run: cp agent-org/docker/.env.example agent-org/docker/.env
      # Hermetic: no daemon is touched, the docker call is injected.
      - run: python -m pytest scripts/stack -q
        # ubuntu-latest ships docker + compose v2, which is all `config` needs.
        #
        # OB1 is a SUBMODULE and is not checked out here, so the open-brain
        # project cannot be rendered. `inventory --check` says so by name and
        # carries that project's recorded rows through UNVERIFIED rather than
        # passing quietly - the remaining seven projects are verified for real.
      - run: python scripts/stack/stack.py inventory --check

  bridge-stdlib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # stdlib-only by design (they run on the bare Windows host too)
      - run: python scripts/claude-sessions-bridge/test_follows.py
      - run: python scripts/claude-sessions-bridge/test_lanes.py

  # =========================================================================================
  # adoption-closeout ac-ci (2026-09-25) - WHAT AN ADOPTER DEPENDS ON, PROVEN ON EVERY PUSH
  # =========================================================================================
  # Five jobs, each a thin call into a script under .github/ci/ (or, for the fresh clone,
  # scripts/stack/rehearse-fresh-clone.sh), so what runs here is byte-for-byte what was run
  # by hand in a fresh ubuntu container before it was wired in, and what a tester re-runs.
  #   suite-agent-bridge / suite-little-coder  the two subprojects' pytest suites, in a venv
  #                                            the way they run on a developer machine
  #   gates-linux    the never-skipped pre-commit gates that read the tree: the Python
  #                  twins (no PowerShell), then the .ps1 originals under pwsh
  #   hooks-linux    a fresh clone with core.hooksPath commits cleanly and REFUSES a
  #                  planted gateway key - under pwsh, and again in a container with no
  #                  PowerShell (Python-twin mode)
  #   fresh-clone-up a fresh clone, `stack.py init`, a REAL `stack.py up` of the stock
  #                  frontend on the runner's own Docker, GET /health 200, teardown
  # The stack.py pytest suite was already here (`stack-driver`). All six are pinned in the
  # gate at the end of this file. None needs a GPU or a secret; the fresh-clone job needs
  # image pulls (Open WebUI is about 5 GB) and the backup sidecar's `apk add` at start.
  # Every job name below is what the gate's pinned list and the local proofs refer to.

  suite-agent-bridge:
    name: "agent-bridge test suite"
    runs-on: ubuntu-latest
    # 881 tests took 30m22s in a fresh ubuntu:24.04 container on the operator's host
    # (2026-09-25, at e9caf6b), mostly waiting rather than computing - see the findings.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # requirements.txt + the [test] extra: the extra alone cannot import app/github_app.py
      # (PyJWT is only in requirements.txt) - see the header of run-suite.sh.
      - run: bash .github/ci/run-suite.sh agent-bridge

  suite-little-coder:
    name: "little-coder test suite"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash .github/ci/run-suite.sh little-coder

  gates-linux:
    name: "never-skipped gates on Linux (Python twins and .ps1 originals)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: gateway routing + line endings, Python twins (no PowerShell)
        run: bash .github/ci/gates-python.sh
      # One gate per step, invoked with -File from bash, so each step's exit code IS the
      # gate's: a `shell: pwsh` step running two scripts keeps only the last one's code.
      - name: gateway routing, the .ps1 under pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/checks/check-llm-gateway-routing.ps1
      - name: line endings, the .ps1 under pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/checks/validate-lineendings.ps1

  hooks-linux:
    name: "Linux clone commits through .githooks (pwsh, then Python-only)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The README clones with --recurse-submodules, and the job's clone has to be that
          # clone: under pwsh the corpus-exposure gate scans OB1, and without it every
          # commit is refused as vacuous. linux-hooks.sh takes OB1 from this checkout.
          submodules: recursive
      # ubuntu-latest has pwsh, so the hook picks it and runs every gate.
      - name: pwsh host - a clean commit passes, a planted gateway key is refused
        run: bash .github/ci/linux-hooks.sh pwsh
      # The Python-only mode needs a host with NO PowerShell; the runner cannot hide its
      # own, so this step runs the same script in python:3.12-slim (git added, nothing
      # else). The checkout is mounted read-only and the script clones out of it.
      - name: python3 host (no PowerShell) - the same two commits
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" python:3.12-slim sh -c '
            apt-get update -qq >/dev/null &&
            apt-get install -y -qq --no-install-recommends git >/dev/null &&
            bash /src/.github/ci/linux-hooks.sh python3'

  fresh-clone-up:
    name: "fresh clone - stack.py init, a real up, /health 200, teardown"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # --this-daemon: the runner's own Docker, no DinD. The script refuses to start if the
      # daemon holds any container, clones this commit to a temp dir, copies
      # frontend/.env.example and generates WEBUI_SECRET_KEY (the only secret involved,
      # made here and thrown away), runs `stack.py init` and a REAL `stack.py up`, waits
      # for GET /health 200 on :3000, checks only the frontend project started and the
      # anchor networks exist with llm-net internal, runs `stack.py health`, then tears
      # down and checks nothing it created is left. python3 is the runner's own (3.12 on
      # ubuntu-24.04; stack.py needs 3.11+), as it would be for a newcomer.
      - run: bash scripts/stack/rehearse-fresh-clone.sh --this-daemon --health-timeout 900

  # =========================================================================================
  # dark-factory-unification C.9 H4 — THE VERIFICATION MACHINERY IS RE-PROVEN, NOT SNAPSHOTTED
  # =========================================================================================
  # H4, quoted: "dfu-done.ps1, the drills, and the gates encode lessons nobody will re-derive,
  # and nothing runs them on a schedule; a later refactor breaks one silently. Validated by:
  # the boundary drill and dfu-done.ps1's runnable clauses wired into CI on `development`,
  # shown green on a CI run — not a local one."
  #
  # READ THIS BEFORE EDITING ANY JOB BELOW.
  #
  # 1. THEY DO NOT ALL PASS ON EXIT 0, AND THAT IS DELIBERATE. `dfu-done.ps1` exits 7 while
  #    the board is FAILED, which is that script WORKING; the app-role drill exits 2 =
  #    CANNOT MEASURE while H1's migration is not in the recorded OB1 gitlink; the boundary
  #    drill exits 2 with dispositioned gaps open and 0 only under -AcceptDispositionedGaps.
  #    Every exit code is classified by `.github/ci/expected-exit.ps1`, which holds the
  #    contract in ONE place and refuses any code it does not enumerate. Do not add
  #    `|| true`, `continue-on-error`, or an `if ($LASTEXITCODE -ne 0)` of your own — the
  #    runbook section this wiring implements is explicit that a retry loop or an `|| true`
  #    on these deletes the only checks watching the boundary.
  #
  # 1b. AND A CHECK THAT DID NOT RUN IS NOT A CHECK THAT PASSED. EVERY WIRED STEP BELOW GOES
  #    THROUGH `.github/ci/run-check.ps1`, and none of them invokes a check directly. The
  #    first shape of this wiring did - `& ./drill.ps1` then `$c = $LASTEXITCODE` then
  #    `-Code $c` - and it turned a run that never happened into a GREEN job, two ways, both
  #    measured under pwsh 7.4 on Linux:
  #      * $LASTEXITCODE is $null when nothing set it, and PowerShell binds $null to [int] as
  #        0, so the classifier's "-Code must be >= 0" sentinel could never fire and every
  #        check whose green set contains 0 passed.
  #      * worse, and NOT closed by typing the parameter: $LASTEXITCODE is STALE, not null,
  #        whenever the check ran any native command before it died. A drill that runs docker
  #        successfully and then dies leaves the caller holding 0 and `$?` = True.
  #    That was live. `drill-app-role-not-superuser.ps1` cleaned up through cmd.exe, which
  #    ubuntu-latest does not have; every abort path is `Cleanup; exit 2` and the trap was
  #    itself `Cleanup; exit 2`, so the failure recursed and the drill died without reaching
  #    any exit statement. The first real run on a runner would have annotated "the drill RAN
  #    and every probe passed ... PULL THIS PIN" and gone green. run-check.ps1 runs each check
  #    in a CHILD PROCESS with a poisoned exit code and a top-level trap, and REQUIRES a
  #    completion marker before any code is classified; expected-exit.ps1 takes -Code as TEXT
  #    and refuses an empty one. Read the header of run-check.ps1 before changing a step, and
  #    keep the shape: trap, sentinel, run-check, `$rc -ne 0 -and $rc -ne 1` is red.
  #
  # 2. CANNOT-CHECK IS NOT THE SAME AS FAILED. `assert-rls-force.sh` and the RLS boot drill
  #    reserve exit 3 for "the drill could not build the environment it needs". It fails the
  #    build — CI could not do its job — but the annotation says the boundary was never
  #    exercised, never that it is broken. H2 spent three rounds separating those sentences.
  #
  # 3. A SKIPPED JOB IS NOT A PASSING JOB. `dfu-h4-gate` runs with `if: always()`, holds a
  #    PINNED list of the jobs it gates, and fails if that list and its own `needs` disagree
  #    or if any of them is anything other than `success`. Deleting a job from `needs` to
  #    quiet it turns the gate red instead of shrinking it.
  #
  # 4. SERIALISATION. `prove-agent-memory-rls.ps1` ends with a read-only assertion that the
  #    LIVE `openbrain-db` holds zero personal rows, and `dfu-done.ps1` clause 3 PLANTS a
  #    personal-exposure fixture in that same live database for the duration of its door
  #    probes. Run concurrently, prove-rls exits 1 with "production is not clean" — a true
  #    reading at that instant and a defect in neither script (PROMOTION-RUNBOOK.md says so,
  #    and says CI must serialise them). Two things keep them apart here: both run with
  #    `-SkipLive`, which removes the live database from both sides entirely, AND `dfu-done`
  #    declares `needs: dfu-prove-rls` so they cannot overlap even if someone later drops a
  #    flag. On GitHub-hosted runners each job is a fresh VM with its own docker daemon and
  #    no live openbrain-db at all; the `needs:` edge is the insurance for the day these
  #    move to a self-hosted runner that CAN see production, which is the only way the live
  #    clauses could ever run.
  #
  # WHAT THESE JOBS DO NOT ASSERT — stated here rather than discovered later (dfu-done rule
  # 2, "say what was not checked"):
  #   * `-SkipLive` on `dfu-done.ps1` leaves clauses 3 and 8 UNEVALUATED, and `-SkipLive` on
  #     `prove-agent-memory-rls.ps1` skips the production read. CI never looks at the live
  #     plane. It cannot: there is no openbrain-db on a hosted runner.
  #   * the boundary drill under `-AcceptDispositionedGaps` asserts "nothing changed since
  #     the operator dispositioned these 25 gaps", NOT "U5's recording half is met". Each
  #     gap prints its own GREEN DOES NOT COVER line; read them.
  #   * these jobs were measured on Windows PowerShell 5.1 against gitlink b604d55
  #     (../documentation-plans-ai-stack/journal/notes/u8h4-findings.md records every command, cwd, exit code and
  #     elapsed time). Every wired invocation has ALSO been run on Linux — pwsh 7.4 in a
  #     container, 2026-09-01 — through run-check.ps1, which is how the dfu-done blocker in
  #     section 15 of that note was found. 8 of those 10 reached an exit code; the 2 that did
  #     not need a docker client the probe image lacks and the runner has. That is still not
  #     a CI run: H4's other half — a run on `development` — is blocked on the operator
  #     promoting this line.
  #
  # Runner facts this wiring depends on, checked against actions/runner-images
  # images/ubuntu/Ubuntu2404-Readme.md on 2026-09-01 rather than assumed: PowerShell 7.6.5,
  # Docker Client/Server 28.0.4, Docker Compose 2.38.2, Git 2.55.0, python-is-python3.
  # Measured 2026-09-01 in mcr.microsoft.com/powershell:7.4-ubuntu-22.04: `Join-Path` on
  # Linux NORMALISES a backslash separator, so `Join-Path $repo 'OB1\docker'` resolves
  # correctly there. What does NOT survive is `cmd`, `2>nul`, and `-like` patterns built
  # from backslashes - see ../documentation-plans-ai-stack/journal/notes/u8h4-findings.md for the sweep.
  # `TEMP` is set per job because these scripts stage throwaway fixtures under `$env:TEMP`,
  # and that variable does not exist on Linux. It is set by each job's FIRST STEP, from
  # $RUNNER_TEMP into $GITHUB_ENV. Until ac-ci (2026-09-25) it was a job-level `env:` reading
  # `runner.temp`, and the `runner` context is not available there (GitHub's context-
  # availability table): actionlint reports it five times, and the VS Code Actions extension
  # reports "Unrecognized named-value: 'runner'", which GitHub raises as an invalid workflow
  # file. No real run of that version has been observed, so "no job could have run" is the
  # expected consequence, not a measured one. OB1 is checked out because the drills build
  # from the RECORDED GITLINK; it is a PUBLIC repo and the pinned commit is on its remote,
  # so `submodules: recursive` needs no extra credential.
  #
  # RETIRED 2026-09-25 (adoption-closeout ac-journal-move): the `dfu-done` job. The board
  # audits the dark-factory-unification PLAN.md/DECISIONS.md/WALKTHROUGH.md and the notes
  # beside them, and those moved with the operator journal to the private plan store, which
  # a CI checkout of this repo does not have. Left wired it could only exit 1 ("nothing was
  # judged") on every run, or - pointed at a frozen copy - audit a plan nobody edits any
  # more. The script and its two drills are in scripts/archive/dfu-done/ with the reason;
  # the gate below pins five jobs now, and removing the sixth was this deliberate edit.
  # Mentions of dfu-done in the notes above are the H4 history, not live wiring.
  # =========================================================================================

  dfu-static-checks:
    name: "DFU H4 - static gates and the machinery's own self-tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # TEMP for the scripts below (see the note above the first of these jobs). Set
      # through GITHUB_ENV because the `runner` context does not exist in jobs.<id>.env.
      - run: echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: recursive # the corpus gate scans OB1's recipes
      - name: the exit-code contract, printed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          trap { Write-Host "::error::the exit-code contract could not even be printed - $($_.Exception.Message)"; exit 1 }
          $global:LASTEXITCODE = 199
          & ./.github/ci/expected-exit.ps1 -List
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { Write-Host "::error::expected-exit.ps1 -List exited [$rc]; the contract this whole section reads could not be listed."; exit 1 }
      - name: the exit-code contract's own self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          trap { Write-Host "::error::H4 step: the wrapper itself terminated without reaching a verdict - $($_.Exception.Message). NOTHING WAS CHECKED, and that is not a pass."; exit 1 }
          $global:LASTEXITCODE = 199
          & ./.github/ci/run-check.ps1 -Check expected-exit-selftest -Script './.github/ci/expected-exit.ps1' -ScriptArgs '-SelfTest' -Command './.github/ci/expected-exit.ps1 -SelfTest'
          $rc = $LASTEXITCODE
          if ($rc -ne 0 -and $rc -ne 1) { Write-Host "::error::H4 step: run-check.ps1 exited [$rc]. It reports only 0 (behaved as pinned) or 1 (did not), so this step reached no verdict and must not pass."; exit 1 }
          exit $rc
      - name: gap-ledger self-test - closing a gap must not turn the build red
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          trap { Write-Host "::error::H4 step: the wrapper itself terminated without reaching a verdict - $($_.Exception.Message). NOTHING WAS CHECKED, and that is not a pass."; exit 1 }
          $global:LASTEXITCODE = 199
          & ./.github/ci/run-check.ps1 -Check boundary-drill-selftest-ledger -Script './scripts/checks/drill-personal-plane-exclusion.ps1' -ScriptArgs '-SelfTestLedger' -Command './scripts/checks/drill-personal-plane-exclusion.ps1 -SelfTestLedger'
          $rc = $LASTEXITCODE
          if ($rc -ne 0 -and $rc -ne 1) { Write-Host "::error::H4 step: run-check.ps1 exited [$rc]. It reports only 0 (behaved as pinned) or 1 (did not), so this step reached no verdict and must not pass."; exit 1 }
          exit $rc
      - name: vacuity-guard self-test - an empty universe cannot reach PASS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          trap { Write-Host "::error::H4 step: the wrapper itself terminated without reaching a verdict - $($_.Exception.Message). NOTHING WAS CHECKED, and that is not a pass."; exit 1 }
          $global:LASTEXITCODE = 199
          & ./.github/ci/run-check.ps1 -Check boundary-drill-selftest-vacuity -Script './scripts/checks/drill-personal-plane-exclusion.ps1' -ScriptArgs '-SelfTestVacuity' -Command './scripts/checks/drill-personal-plane-exclusion.ps1 -SelfTestVacuity'
          $rc = $LASTEXITCODE
          if ($rc -ne 0 -and $rc -ne 1) { Write-Host "::error::H4 step: run-check.ps1 exited [$rc]. It reports only 0 (behaved as pinned) or 1 (did not), so this step reached no verdict and must not pass."; exit 1 }
          exit $rc
      - name: corpus exposure producers - every recognised insert site states its plane
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          trap { Write-Host "::error::H4 step: the wrapper itself terminated without reaching a verdict - $($_.Exception.Message). NOTHING WAS CHECKED, and that is not a pass."; exit 1 }
          $global:LASTEXITCODE = 199
