# CI (CLEANUP-PLAN v3 I.1), added 2026-08-20.
# NOTE: first-run tuning expected — this repo has never had CI. Jobs are
# ordered cheap-first. agent-bridge's 700+ test suite runs in Docker locally
# (see agent-org/); porting it here means building its image in CI — deferred
# until this baseline is proven green.
name: ci

on:
  push:
    branches: [main, develop, "feature/**", "refactor/**", "update/**"]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — scans every commit on the branch
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .env.example is kept complete on purpose (v3 A.4) — it makes compose
      # interpolation resolvable in CI without any real secret.
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose --profile internet --profile local-test config -q

  pytest-llm-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./llm-queue[dev]"
      - run: pytest -q llm-queue/tests

  pytest-search-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "./search-gateway/gateway[dev]"
      - run: pytest -q search-gateway/gateway/tests

  bridge-stdlib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # stdlib-only by design (they run on the bare Windows host too)
      - run: python scripts/claude-sessions-bridge/test_follows.py
      - run: python scripts/claude-sessions-bridge/test_lanes.py
