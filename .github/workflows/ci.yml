  dfu-h4-gate:
    name: "DFU H4 — gate: no job here may be skipped into looking green"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `always()` so this runs even when a job it gates FAILED, was CANCELLED, or was
    # SKIPPED. Without it GitHub skips this job too, and a skipped gate is exactly the
    # silent green this effort keeps finding.
    if: ${{ always() }}
    # Since ac-ci (2026-09-25) this gate also pins the adopter jobs above and the stack.py
    # suite (`stack-driver`): the same rule - skipped is not passed, and a job dropped from
    # `needs` turns the gate red - now covers what a newcomer's clone depends on. The job id
    # and name are unchanged so nothing that already refers to this check breaks.
    needs:
      - dfu-static-checks
      - dfu-boundary-drill
      - dfu-rls-boot-drill
      - dfu-app-role-drill
      - dfu-prove-rls
      - stack-driver
      - suite-agent-bridge
      - suite-little-coder
      - gates-linux
      - hooks-linux
      - fresh-clone-up
    steps:
      - name: every gated job reached a verdict, and the gated set is the pinned one
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          $ErrorActionPreference = 'Continue'
          # PINNED, and CHECKED BACK against `needs` - the same shape dfu-done.ps1 uses for
          # its phase floor (rule 3's limit, and rule 6). A hand list alone rots; a list
          # derived from `needs` alone can be shrunk by deleting an entry from `needs`,
          # which is the "population derived from the document under test" defect. Both
          # together mean removing a job turns this gate RED rather than making it smaller.
          $expected = @(
            'dfu-static-checks',
            'dfu-boundary-drill',
            'dfu-rls-boot-drill',
            'dfu-app-role-drill',
            'dfu-prove-rls',
            'stack-driver',
            'suite-agent-bridge',
            'suite-little-coder',
            'gates-linux',
            'hooks-linux',
            'fresh-clone-up'
          )
          $needs = $env:NEEDS_JSON | ConvertFrom-Json
          $actual = @($needs.PSObject.Properties.Name)

          $missing = @($expected | Where-Object { $actual -notcontains $_ })
          $extra   = @($actual   | Where-Object { $expected -notcontains $_ })
          $bad = 0
          if ($missing.Count -gt 0) {
            Write-Host "::error::these H4 jobs are PINNED in this gate but are not in its needs: $($missing -join ', '). A job removed from needs is a check that stopped running; it does not make the gate smaller."
            $bad++
          }
          if ($extra.Count -gt 0) {
            Write-Host "::error::these jobs are in needs but not pinned in this gate: $($extra -join ', '). Add them to the pinned list so the gate states what it covers."
            $bad++
          }

          Write-Host "| job | result |"
          Write-Host "|---|---|"
          foreach ($name in ($actual | Sort-Object)) {
            $r = [string]$needs.$name.result
            Write-Host "| $name | $r |"
            if ($r -ne 'success') {
              # THE TWO REASONS ARE DIFFERENT SENTENCES and the annotation says which.
              # 'failure' means the check ran and objected; 'skipped'/'cancelled' means it
              # never ran, so nothing it watches was measured - which is the one this gate
              # exists for, because a skipped job is the state that otherwise looks green.
              $why = if ($r -eq 'failure') {
                "it RAN and objected - read that job's annotations for the exit code and what it means"
              } else {
                "it NEVER RAN, so nothing it watches was measured. A '$r' job is not a pass."
              }
              Write-Host "::error::$name did not succeed - result '$r': $why"
              $bad++
            }
          }
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### DFU C.9 H4 - verification machinery"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "| job | result |"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "|---|---|"
            foreach ($name in ($actual | Sort-Object)) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("| ``$name`` | " + [string]$needs.$name.result + " |")
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "H4 GATE PASSED - all $($expected.Count) pinned jobs ran and succeeded."
