  dfu-app-role-drill:
    name: "DFU H4 - app role is not a superuser (H1)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # TEMP for the scripts below (see the note above the first of these jobs). Set
      # through GITHUB_ENV because the `runner` context does not exist in jobs.<id>.env.
      - run: echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # PINNED AS EXIT 2 = CANNOT MEASURE, and that is the honest state of the tree, not a
      # skip: `OB1/docker/init-app-role.sql` and `init-app-role-passwords.sh` do not exist
      # at the recorded gitlink, so there is nothing to drill until H1's OB1 commit is
      # pushed and the gitlink bumped. The job RUNS the drill and lets it say so; when the
      # files land, exit 0 arrives as a NAG telling whoever sees it to pull the pin in
      # .github/ci/expected-exit.ps1. Exit 1 - a probe disagreeing - is red either way.
      #
      # AND EXIT 2 HAS TO BE THE DRILL SAYING IT, NOT THE JOB ASSUMING IT. Until 2026-09-01
      # this drill cleaned up through cmd.exe, which ubuntu-latest does not have, so on a
      # runner it died inside its own trap without ever reaching an exit statement - and the
      # wiring reported the stale zero as "the drill RAN and every probe passed. PULL THIS
      # PIN". The drill is fixed and the wiring now refuses a run that produced no code of
      # its own; both halves are in ../documentation-plans-ai-stack/journal/notes/u8h4-findings.md.
      - name: drill-app-role-not-superuser.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          trap { Write-Host "::error::H4 step: the wrapper itself terminated without reaching a verdict - $($_.Exception.Message). NOTHING WAS CHECKED, and that is not a pass."; exit 1 }
          $global:LASTEXITCODE = 199
          & ./.github/ci/run-check.ps1 -Check app-role-drill -Script './scripts/checks/drill-app-role-not-superuser.ps1' -Command './scripts/checks/drill-app-role-not-superuser.ps1'
          $rc = $LASTEXITCODE
          if ($rc -ne 0 -and $rc -ne 1) { Write-Host "::error::H4 step: run-check.ps1 exited [$rc]. It reports only 0 (behaved as pinned) or 1 (did not), so this step reached no verdict and must not pass."; exit 1 }
