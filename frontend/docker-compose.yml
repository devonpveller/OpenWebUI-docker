# frontend/docker-compose.yml — the FRONTEND compose project (K.5, 2026-08-21).
# openwebui + its tailscale netns companion + their backup sidecars, moved out
# of the root ai-stack project (CLEANUP-PLAN Part K).
#
# PROFILES (stack-layers §2.5 / DECISIONS D8, 2026-09-19). Three, and at least
# one openwebui-providing profile must be active or the project renders with
# nothing but the backup sidecar:
#
#   stock      openwebui-stock — the pinned upstream image, no GPU, no build,
#              no other plane. This is the FRESH-CLONE deployment: `cp
#              .env.example .env` then `docker compose -f
#              frontend/docker-compose.yml --env-file .env up -d` and Open WebUI
#              is on http://127.0.0.1:3000 with only Docker installed. It needs
#              none of the anchor's ai-stack_* networks (see `owui-net` below).
#   gpu        openwebui — THIS HOST's deployment: the CUDA local build, the
#              nvidia device reservation, the USE_CUDA/NVIDIA_* env, the llm-net
#              and app-net seams and the status-pipe code mount.
#   tailscale  tailscale + tailscale-backup — the tailnet node that welds itself
#              to openwebui's network namespace. Requires the `gpu` profile,
#              because `network_mode: service:openwebui` names that service.
#
# THIS PLANE'S PROFILES ARE `gpu,tailscale`, AND THEY ARE NOT THE DEFAULT.
# They go in COMPOSE_PROFILES in .env — but that variable is GLOBAL: every
# plane driven with `--env-file .env` reads the same value, so it is set in ONE
# authoritative section at the top of .env.example (stack-layers D15) and this
# file does not own it. **This host's FULL value is
# `COMPOSE_PROFILES=local,gpu,tailscale`** — `local` is the inference plane's
# GPU backends, and setting `gpu,tailscale` alone would silently take them
# down. Compose reads the variable from the `--env-file` (verified against
# compose v5.3, 2026-09-19), a duplicate key in that file is last-wins and
# silent, and a `--profile` flag on the command line REPLACES the value rather
# than adding to it — which is what lets `--profile gpu --profile tailscale`
# render this host's frontend from a .env.example that says `stock`.
#
# WHY `stock` IS A PROFILE AND NOT THE UN-PROFILED DEFAULT. It would be nicer
# if the stock service simply had no `profiles:` key and `--profile gpu` swapped
# it out. Compose cannot do that: `--profile` only ADDS to the active set, never
# subtracts, so an un-profiled `openwebui-stock` stays active alongside
# `openwebui` — and because both declare `container_name: openwebui`, the
# project then fails to render at all (`container name "openwebui" is already
# in use by service ...`, exit 1). The reviewer built that alternative and it
# fails exactly there. Hence three profiles, with `stock` named explicitly.
#
# WITHOUT THIS PLANE'S PROFILES IN THAT VALUE, every lifecycle and repair path
# here is broken — measured against this file, 2026-09-19:
#   `up -d`            starts openwebui-backup and NOTHING ELSE;
#   `down`             removes openwebui-backup and LEAVES openwebui and
#                      tailscale running (compose only tears down services
#                      whose profile is active), so a "clean" teardown is not;
#   `... tailscale`    ANY verb naming tailscale — `up -d tailscale`,
#                      `stop`/`start`/`restart`/`rm`/`ps`/`config`, and
#                      `up -d --force-recreate --no-deps tailscale` — exits 1
#                      with `no such service: openwebui`. Naming a service
#                      activates ONLY that service's own profile, so
#                      `network_mode: service:openwebui` and
#                      `depends_on: openwebui` point at a service the project
#                      does not contain, and compose refuses to LOAD it.
#                      `--no-deps` does not help: the reference is resolved at
#                      project load, before deps are considered.
#   `... openwebui`    survives, alone among them, because the gpu definition
#                      names nothing outside its own profile — so
#                      `restart openwebui` and `build --no-cache openwebui`
#                      still work.
# That means `scripts/checks/stack-watchdog.ps1`'s seven tailscale repair calls
# (and the two advice strings that print the same commands),
# `scripts/recovery/emergency-recovery.ps1` (both its whole-project verbs and
# its `restart tailscale`), `scripts/recovery/quick-fixes.bat`'s four
# (`restart tailscale`, `build --no-cache tailscale`, and two `up -d
# tailscale`) and `backup/openwebui-restore.sh`'s documented
# `stop tailscale openwebui` all exit 1 until the value is right — silently, in
# the watchdog's case, since it pipes them to Out-Null. The repo's own
# `scripts/checks/check-watchdog-repair-targets.ps1` reports exactly this
# (`tailscale` / `tailscale-backup` NOT DECLARED) and is the check to run after
# editing .env.
# TWO callers do NOT depend on the value, because they pass the profiles
# themselves: `scripts/backup/restore-from-snapshot.ps1` (its frontend and
# tailscale entries, as the portal and agent-org entries there already did) and
# the frontend recipe in `documentation/runbooks/restore-from-snapshot.md`.
# Both were given `--profile gpu --profile tailscale` here, and both exit 0
# against a profile-less env (measured).
#
# WHY TWO openwebui SERVICE DEFINITIONS, AND NOT ONE WITH ENV-DRIVEN GPU BITS.
# Compose can gate a SERVICE on a profile; it cannot gate a FIELD. Interpolation
# reaches scalars only, so neither the `build:` block nor
# `deploy.resources.reservations.devices` can be made to vanish when a variable
# is unset — and those two are exactly what stops a fresh clone (an unwanted
# CUDA build, then `could not select device driver "nvidia"`). Both render
# criteria run the SAME env file and differ only in the `--profile` flags, so
# service activation is the only lever there is: hence one service per shape.
# They share `container_name: openwebui`, the `openwebui-data` volume and the
# :3000 port, so exactly one may be active — turning on `stock` and `gpu`
# together is refused by `docker compose config` ("container name ... is already
# in use"), loudly, before anything starts.
#
# The GPU definition keeps the service key `openwebui` deliberately: the
# recovery, backup and restore scripts address it by that key
# (emergency-recovery.ps1, restore-from-snapshot.ps1, backup/openwebui-restore.sh),
# and renaming it would have made every one of them profile-dependent. The
# fresh-clone variant is the one that carries the new key.
#
# Drive it with scripts/stack/stack.ps1, or manually FROM THE REPO ROOT:
#   docker compose -f frontend/docker-compose.yml --env-file .env up -d
# The ${WEBUI_SECRET_KEY:?} guard makes a bare `up` fail loud — REQUIRED,
# because a recreate without that key would rotate it and break webui.db.
#
# NETNS RULE (unchanged): tailscale runs network_mode: service:openwebui.
# NEVER restart openwebui alone — order is openwebui → (healthy) → tailscale;
# compose's depends_on encodes it inside this project.
# Seams (all external): ai-stack_default (reach search `gateway`, host UX),
# llm-net (llama-cpp aliases), app-net (portal caddy → openwebui; the QUARTZ
# tailnet serve route reaches caddy:8446 through it).
name: frontend

services:
  # --- FRESH CLONE (profile: stock) ------------------------------------------
  # Stock upstream image, no build, no GPU, no anchor network, no other plane.
  # Same container_name / port / data volume as the gpu definition, so a host
  # can move between the two without touching webui.db. Everything the gpu
  # service carries that needs another plane (the llm-net aliases, the
  # status-pipe code mount, the search-gateway wiring, OWUI's LiteLLM virtual
  # key) is deliberately absent here: none of it resolves on a clone with
  # nothing else running, and OWUI's own defaults are correct without it.
  openwebui-stock:
    profiles: [ stock ]
    # Pinned, and the same base the CUDA image is built FROM
    # (Dockerfile.openwebui-gpu line 1) — so `stock` and `gpu` are the same
    # Open WebUI release, differing only in the torch wheels.
    image: ${OWUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.0}
    container_name: openwebui
    ports:
      - "127.0.0.1:3000:8080" # Bind to localhost only
    networks:
      - owui-net
    volumes:
      - openwebui-data:/app/backend/data
      - ../config:/app/config:ro # Read-only config
    environment:
      - TZ=America/New_York
      # Same fail-loud guard as the gpu definition: a recreate WITHOUT this key
      # rotates it and breaks every encrypted-at-rest value in webui.db.
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?set via --env-file .env (copy .env.example) - a recreate WITHOUT this key rotates it and breaks webui.db encrypted values + all sessions}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false # OpenWebUI needs write access for temp files
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test: [ "CMD", "curl", "-f", "--max-time", "10", "http://localhost:8080/health" ]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 60s

  # --- THIS HOST (profile: gpu) ----------------------------------------------
  openwebui:
    profiles: [ gpu ]
    build:
      context: ..
      dockerfile: Dockerfile.openwebui-gpu
    # Pinned to the proven image (retagged from ai-stack-openwebui at the K.5
    # split). Rebuild DELIBERATELY only (docker compose ... build openwebui):
    # the Dockerfile reinstalls CUDA torch (heavy) and upgrades track the
    # UPDATE-MANAGEMENT runbook, never an `up` side effect.
    image: openwebui:local
    container_name: openwebui
    ports:
      - "127.0.0.1:3000:8080" # Bind to localhost only
    networks:
      - default
      - llm-net
      - app-net               # plan §7.4 — portal Caddy reaches openwebui:8080 here
      # Project-local net, added 2026-09-19 with the profiles: it is the ONE
      # network openwebui-backup can share with BOTH openwebui definitions
      # (its script probes `nc -z openwebui 8080`, and its entrypoint `apk add`s
      # pigz, so it needs name resolution plus egress - nothing an anchor
      # network provides that a project bridge does not). The three external
      # seams above are untouched.
      - owui-net
    volumes:
      - openwebui-data:/app/backend/data
      # NO /app/config MOUNT (removed 2026-09-19, stack-layers sl-colo-inference).
      # `../config:/app/config:ro` mounted the ENTIRE shared config directory -
      # the LiteLLM gateway config, its model_list fragments and the llama-swap
      # config - into the internet-facing frontend, and NO OWUI CODE PATH READS
      # IT. Four checks against the DEPLOYED image and its database, before
      # removal (2026-09-19):
      #   1. image code - `grep -rI "/app/config" /app/backend/open_webui
      #      /app/build` in the live container: no hits. The only files under
      #      /app holding the string were the MOUNTED FILES THEMSELVES.
      #   2. env - `env | grep -i config` in the live container: no hits, so no
      #      variable pointed OWUI at it.
      #   3. OWUI resolves its own config from DATA_DIR, not from here:
      #      open_webui/env.py:222 -> /app/backend/data, i.e. the openwebui-data
      #      volume mounted above.
      #   4. webui.db, where OWUI's tools / functions / pipes actually live -
      #      read-only scan of all 44 tables: ZERO rows in `function`, `tool`,
      #      `model`, `prompt` or `config`. The only hits are chat transcripts
      #      and one uploaded file: a compose example inside a saved
      #      conversation, not a loaded code path.
      # This repo DOES contain other `/app/config` references and none of them
      # is OWUI's: little-coder's own /app/config/little-coder.config.yaml in
      # the coder/ and agent-org worker containers (a different mount, from a
      # different source), the unrelated /app/config.yaml of the LiteLLM
      # gateways, archived tutorials, and this item's own docs. An earlier
      # version of this comment claimed "zero references anywhere in this repo"
      # and that was FALSE - it came from a `git grep '/app/config'` run in Git
      # Bash, where MSYS rewrites the pattern to C:/Program Files/Git/app/config
      # and the search returns nothing whatever the tree holds. Prefix
      # MSYS_NO_PATHCONV=1 to search for a path-shaped string there.
      # The mount was the same over-broad-mount class as the
      # `.:/host_project:ro` one removed in v3 A.2/G.1 below.
      # Narrow code mounts (v3 A.2/G.1) — the old `.:/host_project:ro` mount
      # shipped every on-disk secret into the internet-facing frontend. Only
      # the status-pipe subsystem, the system prompts the githelper pipe
      # reads, and the tailnet-info dump are visible now.
      - ../status-pipe:/host_project/status-pipe:ro
      - ../system-prompts:/host_project/system-prompts:ro
      - ../data/tailscale:/host_project/data/tailscale:ro
    environment:
      - TZ=America/New_York
      # Pinned session/encryption key (value in .env). 0.9.6 hard-requires this; and the
      # key was previously auto-generated into the container's EPHEMERAL layer
      # (/app/backend/.webui_secret_key, outside the data volume), so a recreate would
      # rotate it and break every encrypted-at-rest value in webui.db + all sessions.
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?set via --env-file ../.env or scripts/stack/stack.ps1 - a recreate WITHOUT this key rotates it and breaks webui.db encrypted values + all sessions}
      # OWUI's own LOW-PRIVILEGE virtual key (the same one its chat connection
      # holds in webui.db) — the status-pipe llm-traffic module uses it for the
      # gateway's read-only /observe/* queue board, which 401s unauthenticated
      # since J.1. NEVER the master key (A.2: no admin secrets in the frontend).
      - OWUI_CHAT_LLM_API_KEY=${OWUI_CHAT_LLM_API_KEY}
      - USE_CUDA=true
      - USE_CUDA_DOCKER=true
      - NVIDIA_VISIBLE_DEVICES=${GPU_AISTACK_DEVICE_ID:-1}
      - CUDA_VISIBLE_DEVICES=${GPU_AISTACK_DEVICE_ID:-1}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TRANSFORMERS_CACHE=/tmp/transformers_cache
      - HF_HOME=/tmp/hf_cache
      # OWUI HTTP-client timeouts (backend/model calls)
      - AIOHTTP_CLIENT_TIMEOUT=3600
      - AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST=60
      # AIOHTTP_CLIENT_TIMEOUT_TOOL_CALL was set here until 2026-08-20 and was a
      # PHANTOM: no reader exists in OWUI 0.9.6 or 0.11.0 (verified by grepping
      # env.py in both). It never bounded tool calls. The real knob is below --
      # it governs fetching TOOL SERVER specs (the Open Brain mcpo servers), default 10s,
      # which is tight for a cold MCP server. Raised deliberately.
      - AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER_DATA=30
      - MODELS_CACHE_TTL=10 # Cache model list for 10 seconds to reduce repeated calls
      - ENABLE_BASE_MODELS_CACHE=true # Cache base models for faster loading
      # Reduce OpenWebUI overhead for model requests
      - CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE=4 # Larger chunks for better streaming performance
      - BYPASS_MODEL_ACCESS_CONTROL=true # Skip access control checks for faster requests
      # 0.9.6 renamed CHAT_RESPONSE_MAX_TOOL_CALL_RETRIES -> _ITERATIONS and raised the
      # default 30 -> 256. Pin a sane bound so deep_research / little-coder tool loops
      # don't run away on latency/cost. (Ignored by 0.8.10, which uses the old name.)
      - CHAT_RESPONSE_MAX_TOOL_CALL_ITERATIONS=40
      # 0.11.0 adds a master switch for the Tools/Functions plugin surfaces.
      # Upstream default is True; pinned so an upstream default change can
      # never silently disable this stack's 16 deploy-by-paste plugins.
      - ENABLE_PLUGINS=true
      # open-terminal moved into the little-coder control plane (Tool chapter):
      # it left OWUI's network namespace, so OWUI's direct terminal access
      # ends here. It returns in chapter 2 via a keyed MCP edge (design §3.4, Decision
      # Log 2026-05-20). Re-enable only when chapter 2 lands.
      # - ENABLE_OPEN_TERMINAL=true
      # - TERMINAL_SERVER_CONNECTIONS=[{"id":"open-terminal","name":"Open Terminal","url":"http://localhost:8000","key":"${OPEN_TERMINAL_API_KEY}"}]
      # Web search → Private Search Gateway (Approach B: OWUI's stock searxng
      # engine pointed at the gateway, which routes via Tor). This also feeds
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-True}
      - WEB_SEARCH_ENGINE=${WEB_SEARCH_ENGINE:-searxng}
      - SEARXNG_QUERY_URL=${SEARXNG_QUERY_URL:-http://gateway:8080/search?q=<query>}
      # Built-in code interpreter disabled: the default Pyodide engine runs
      # via `await __event_call__({"type": "execute:python"})` with no timeout
      # (backend/open_webui/tools/builtin.py execute_code), so when the
      # browser tab is backgrounded or the WS round-trip stalls, the tool
      # call hangs forever and the chat model stays stuck waiting. The fix
      # is still absent on OWUI main as of 2026-05-09. Re-enable only after
      # standing up the Jupyter engine — see
      # ../documentation-plans-ai-stack/implementation-guide/Jupyter/.
      - ENABLE_CODE_INTERPRETER=${ENABLE_CODE_INTERPRETER:-False}
      - ENABLE_CODE_EXECUTION=${ENABLE_CODE_EXECUTION:-False}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_AISTACK_DEVICE_ID:-1}"]
              capabilities: [ gpu ]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false # OpenWebUI needs write access for temp files
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test: [ "CMD", "curl", "-f", "--max-time", "10", "http://localhost:8080/health" ]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 60s

  tailscale:
    profiles: [ tailscale ]
    build:
      context: ..
      dockerfile: dockerfile.tailscale
    # Pinned like openwebui (retagged from ai-stack-tailscale at K.5).
    image: tailscale:local
    container_name: tailscale
    # This names the `gpu` definition, so the tailscale profile is usable only
    # together with gpu; `--profile tailscale` alone is refused by compose
    # ("depends on undefined service openwebui"), which is the correct answer —
    # there would be no netns to join. entrypoint.sh is unchanged by the
    # profile split.
    network_mode: service:openwebui
    # NO env_file HERE, deliberately (2026-08-28) - see coder/docker-compose.yml for the
    # full account. Of everything `env_file: ../.env` used to inject, this service reads
    # exactly ONE variable; the rest of what entrypoint.sh reads either has a default in
    # the script (LITELLM_UI_*, MATTERMOST_*) or is assigned by the script itself
    # (STATE_DIR, TS_SOCK). So the wildcard bought one line and granted 110 others.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      # The one variable this container legitimately takes from the root .env. Needed to
      # authenticate the node; entrypoint.sh passes it to `tailscale up`.
      - TAILSCALE_AUTH_KEY=${TAILSCALE_AUTH_KEY}
      - TS_HOSTNAME=openwebui
      - TS_ACCEPT_DNS=false
      # MUST be the GATEWAY alias (llama-cpp / llama-cpp-embed), NOT the *-upstream
      # real servers. entrypoint.sh proxies the tailnet /llama-cpp + /llama-cpp-embed
      # serve routes here; pointing at *-upstream would expose inference on the
      # tailnet BYPASSING LiteLLM (no ledger, no routing). Gateway-only policy —
      # see scripts/checks/check-llm-gateway-routing.ps1. (Was *-upstream after the
      # 2026-06-12 rename; corrected 2026-06-13.)
      - LLAMA_CPP_HOST=${LLAMA_CPP_HOST:-llama-cpp}
      - LLAMA_CPP_PORT=${LLAMA_CPP_PORT:-8080}
      - LLAMA_CPP_ENABLED=${LLAMA_CPP_ENABLED:-true}
      - LLAMA_CPP_EMBED_HOST=${LLAMA_CPP_EMBED_HOST:-llama-cpp-embed}
      - LLAMA_CPP_EMBED_PORT=${LLAMA_CPP_EMBED_PORT:-8080}
      - LLAMA_CPP_EMBED_ENABLED=${LLAMA_CPP_EMBED_ENABLED:-true}
      - OPEN_NOTEBOOK_HOST=${OPEN_NOTEBOOK_HOST:-open_notebook}
      - OPEN_NOTEBOOK_PORT=${OPEN_NOTEBOOK_PORT:-8502}
      - OPEN_NOTEBOOK_ENABLED=${OPEN_NOTEBOOK_ENABLED:-true}
      - OPEN_NOTEBOOK_TS_PORT=${OPEN_NOTEBOOK_TS_PORT:-8443}
      - OPEN_NOTEBOOK_API_PORT=${OPEN_NOTEBOOK_API_PORT:-5055}
      - OPEN_NOTEBOOK_API_TS_PORT=${OPEN_NOTEBOOK_API_TS_PORT:-5055}
      # OB1 Quartz wiki — routed through the portal Caddy's tailnet listener
      # (caddy:8446 → the shared (wiki_app) snippet) so the tailnet gets the SAME
      # /workbench key-injected routing as the external vhost: Tailnet > Caddy >
      # app (Authelia skipped — Tailscale device-auth is the trust boundary; the
      # workbench's X-Brain-Key is injected by Caddy). caddy is on ai-stack_app-net,
      # which openwebui — whose netns this container shares — is also on, so
      # caddy:8446 resolves here. (Pre-Caddy this pointed straight at
      # openbrain-wiki-viewer:8080, which had NO /workbench routing → 404 on tailnet.)
      # ORDER: caddy must be up before this serve configures at boot; if it isn't,
      # entrypoint.sh's monitor loop does deferred setup once caddy appears.
      - QUARTZ_HOST=${QUARTZ_HOST:-caddy}
      - QUARTZ_PORT=${QUARTZ_PORT:-8446}
      - QUARTZ_ENABLED=${QUARTZ_ENABLED:-true}
      - QUARTZ_TS_PORT=${QUARTZ_TS_PORT:-8444}
    volumes:
      - ../data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    depends_on:
      openwebui:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: [ "CMD", "sh", "-c", "tailscale --socket=/tmp/tailscaled.sock status >/dev/null 2>&1 && ping -c 1 8.8.8.8 >/dev/null 2>&1 && wget -q -T 3 -O /dev/null http://127.0.0.1:8080" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  openwebui-backup:
    image: alpine:3.21
    container_name: openwebui-backup
    volumes:
      - openwebui-data:/data:ro
      - ../backups/openwebui:/backups
      - ../backup/openwebui-backup.sh:/scripts/backup.sh:ro
    networks:
      # owui-net, not the anchor's ai-stack_default: this sidecar carries no
      # profile (it backs up the data volume in EVERY deployment), so the only
      # network it may name is the one both openwebui definitions are on. The
      # backup SCRIPT's one network call is `nc -z openwebui 8080`
      # (backup/openwebui-backup.sh:78), which owui-net answers by container
      # name under either profile; the compose `command` below also does an
      # `apk add pigz`, which needs plain egress - a project-owned bridge gives
      # it that exactly as ai-stack_default did.
      - owui-net
    environment:
      - BACKUP_DIR=/backups
      - DATA_DIR=/data
      - RETAIN_COUNT=${OPENWEBUI_BACKUP_RETAIN_COUNT:-2}
      - HEALTH_TCP=openwebui:8080
      - BACKUP_INTERVAL=${OPENWEBUI_BACKUP_INTERVAL:-86400}   # daily (sleep-loop; unified 2026-08-21)
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache pigz >/dev/null 2>&1           && echo "[$(date -u +%FT%TZ)] pigz installed (parallel compression enabled)"           || echo "[$(date -u +%FT%TZ)] WARN: pigz install failed -- falling back to gzip"
        # Sleep-loop scheduler (unified 2026-08-21; was crond, which
        # misses fire-windows on Docker Desktop VM clock jumps).
        echo "[$$(date -u +%FT%TZ)] openwebui-backup started (sleep-loop; interval=$${BACKUP_INTERVAL}s, retain=$${RETAIN_COUNT})"
        while true; do
          sh /scripts/backup.sh || echo "[$$(date -u +%FT%TZ)] openwebui-backup backup.sh exited $$?"
          sleep "$${BACKUP_INTERVAL}"
        done
    # Cap memory so the nightly `tar` of the (large) /data volume cannot
    # balloon the WSL VM with reclaimable page cache. The kernel evicts this
    # cgroup's own file cache to stay under the limit, so the backup streams
    # through a small cache window instead of parking tens of GB until the
    # next `wsl --shutdown`. tar/gzip stream sequentially (no re-reads) so
    # capping costs nothing; anon RSS is a few MB, so no OOM risk.
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # One entry per openwebui definition, both `required: false`: exactly one of
    # them is ever active, and WITHOUT `required: false` compose refuses the
    # whole project ("depends on undefined service") whenever the other is off.
    # `required: false` does not weaken the wait — when the named service IS
    # active the service_healthy condition is still enforced (verified against
    # compose v5.3, 2026-09-19).
    depends_on:
      openwebui:
        condition: service_healthy
        required: false
      openwebui-stock:
        condition: service_healthy
        required: false

    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  tailscale-backup:
    profiles: [ tailscale ]
    image: alpine:3.21
    container_name: tailscale-backup
    volumes:
      - ../data/tailscale:/data:ro
      - ../backups/tailscale:/backups
      - ../backup/generic-tar-backup.sh:/scripts/backup.sh:ro
    environment:
      - DATA_DIR=/data
      - BACKUP_DIR=/backups
      - PREFIX=tailscale
      - RETAIN_COUNT=${TAILSCALE_BACKUP_RETAIN_COUNT:-2}
      # tailscale-backup needs no network: the bind mount is its only source.
      # It still GETS one — declaring no `networks:` key means compose attaches
      # it to the project default, which here is the external ai-stack_default
      # (true of development's render as well; the comment used to claim "no
      # network attachment", which the render has never agreed with).
      # HEALTH_TCP intentionally empty -- dir-nonempty is the only precheck.
      # Set HEALTH_TCP=tailscale:41641 etc if you wire it onto a shared
      # network later.
      - HEALTH_TCP=
      # 2026-08-01: crond -> sleep-loop (see openbrain-wiki-backup rationale).
      - BACKUP_INTERVAL=${TAILSCALE_BACKUP_INTERVAL:-86400}   # daily
      - TZ=UTC
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "[$$(date -u +%FT%TZ)] tailscale-backup started (sleep-loop; interval=$${BACKUP_INTERVAL}s, retain=$${RETAIN_COUNT})"
        while true; do
          sh /scripts/backup.sh || echo "[$$(date -u +%FT%TZ)] tailscale backup.sh exited $$?"
          sleep "$${BACKUP_INTERVAL}"
        done
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  # Migrated from ai-stack_openwebui-data 2026-08-21 (data copied; ~10 GB).
  # Shared by BOTH openwebui definitions on purpose: a host that moves between
  # the stock and gpu profiles keeps its webui.db.
  openwebui-data:

networks:
  # The three ai-stack_* seams are anchor-owned and attached externally so every
  # DNS name (openwebui for portal caddy; gateway/vpn from here; llama-cpp
  # aliases) keeps resolving unchanged. They are declared here but only the
  # `gpu` definition uses them, and compose does not require an UNUSED external
  # network to exist (verified against compose v5.3, 2026-09-19) — which is what
  # lets the `stock` profile come up on a host that has never run the anchor.
  default:
    external: true
    name: ai-stack_default
  llm-net:
    external: true
    name: ai-stack_llm-net
  app-net:
    external: true
    name: ai-stack_app-net
  # PROJECT-OWNED (renders as frontend_owui-net). The only network shared by
  # both openwebui definitions and the always-on backup sidecar.
  owui-net:
