# search/docker-compose.yml — the SEARCH compose project (K.3, 2026-08-21).
# Private Search Gateway: Mullvad vpn egress (engine queries + page fetches),
# redis, searxng, gateway. Moved out of the root ai-stack project (CLEANUP-PLAN
# Part K); definition-identical to the former compose/search.yml — only paths
# (../) and network ownership changed.
#
# Drive it with scripts/stack/stack.ps1, or manually FROM THE REPO ROOT:
#   docker compose -f search/docker-compose.yml up -d
# The ${MULLVAD_WG_PRIVATE_KEY:?} guard makes a bare `up` without search/.env fail.
#
# Seams: `vpn` (:8888 proxy) and `gateway` (:8080) are DNS names that OB1
# (openbrain-research/podcast, FETCH_PROXY) and OWUI resolve on the anchor’s
# ai-stack_default bridge — both attach to it EXTERNALLY here, which is also
# their internet egress. search-net is plane-internal and native.
#
# EXTENSION FIELDS (stack-layers sl-compose-anchors, 2026-09-19). The hardening
# boilerplate every service here carried verbatim is declared ONCE below as a
# YAML extension field and merged in with `<<: *hardening`, at the point in each
# service where the block it replaces used to sit. `docker compose config`
# echoes the `x-` blocks back at the top level; they are declarations, not
# services, and no rendered service definition changed.
#   x-hardening   security_opt: [ no-new-privileges:true ]
# THE RULE WHEN YOU EDIT: a merge key merges MAPS. A LIST written on a service
# REPLACES the anchored list, it does NOT append to it - so a service needing an
# extra `security_opt` entry must spell out the WHOLE list (the anchor's entry
# included) in its own key. Extra hardening under a DIFFERENT key (cap_drop,
# cap_add, read_only, tmpfs) is just that key - vpn's cap_add, and searxng's
# cap_drop plus cap_add. No service in this file overrides an anchored key.
name: search

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # tor RETIRED 2026-08-21 (operator, after dependency validation): its
  # exits are blocked by most large sites, and it carried zero real traffic
  # since the 2026-08-20 Mullvad flip. ALL search-plane egress (engine
  # queries AND page fetches) now leaves via the vpn service below.
  vpn:
    image: ${VPN_IMAGE:-qmcgaw/gluetun:latest}
    container_name: search-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - search-net
      - default
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${MULLVAD_WG_PRIVATE_KEY:?set in search/.env (copy search/.env.example), or stack.ps1}
      - WIREGUARD_ADDRESSES=${MULLVAD_WG_ADDRESSES}
      - SERVER_COUNTRIES=${MULLVAD_COUNTRIES:-Netherlands}
      # HTTP forward-proxy for SearXNG. HTTPS targets use CONNECT, so DNS is
      # resolved at gluetun THROUGH the tunnel (no local DNS leak, matching the
      # old socks5h behaviour).
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      # Allow the LAN-side (docker search-net) to reach the proxy through the
      # kill-switch firewall. 172.16/12 covers Docker's default subnet pool.
      - FIREWALL_OUTBOUND_SUBNETS=${SEARCH_NET_SUBNET:-172.16.0.0/12}
      # DNS: leave gluetun's default DNS-over-TLS ON — engine hostnames resolve
      # via DoT through the tunnel (no DNS leak). NOTE: WIREGUARD_ADDRESSES must
      # be IPv4-only unless the Docker host has IPv6 (gluetun rejects v6 addrs).
    restart: unless-stopped
    <<: *hardening
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  redis:
    image: ${SEARCH_REDIS_IMAGE:-redis:7-alpine}
    container_name: search-redis
    # search-gate (audit A2): a password. It is `requirepass` in search/secrets/redis/redis.conf
    # (gitignored; a one-line file: `requirepass <long random>`), mounted as a directory so a
    # missing file does not stop the plane: then redis runs WITHOUT a password, as before the gate,
    # and says so on stderr at every start. The deploy step creates the file (search/README.md).
    # The gateway reads the same file (REDIS_PASSWORD_FILE). searxng's SEARXNG_REDIS_URL is not
    # read by the pinned image (it uses valkey settings; audit A11), so nothing else connects.
    command:
      - sh
      - -c
      - >-
        if [ -s /run/secrets/search-redis/redis.conf ]; then
        exec redis-server /run/secrets/search-redis/redis.conf --save '' --appendonly no;
        else echo 'search-redis: no search/secrets/redis/redis.conf - running WITHOUT a password' >&2;
        exec redis-server --save '' --appendonly no; fi
    volumes:
      - ./secrets/redis:/run/secrets/search-redis:ro
    networks:
      - search-net
    restart: unless-stopped
    <<: *hardening
    healthcheck:
      # an unauthenticated `redis-cli ping` exits 0 on NOAUTH too, so the check reads the PONG;
      # tr drops a CR (a file written on Windows) and quotes, as redis's own config parser does
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^requirepass[[:space:]]*//p' /run/secrets/search-redis/redis.conf 2>/dev/null | tr -d '\r\"')\" redis-cli --no-auth-warning ping | grep -q PONG"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  searxng:
    # Security audit 2026-10-15 (A3): search queries were kept in plaintext container logs with no
    # rotation. Cap retention here; the gateway also runs without uvicorn's access log.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    # PINNED, not :latest (research-trust 2026-09-11). Two reasons, both
    # measured: (1) watchtower.enable=false exists so privacy infrastructure
    # is never silently swapped, and a floating tag does exactly that;
    # (2) the engine policy in search/searxng/settings.yml REQUIRES
    # this image - on the 2026-05-17 build that :latest resolved to until
    # today, google/brave/qwant return nothing (TLS fingerprint rejection /
    # CAPTCHA) and `duckduckgo web` does not exist. .env overrides this.
    image: ${SEARXNG_IMAGE:-searxng/searxng:2026.9.11-61d660276}
    container_name: searxng
    networks:
      - search-net
    depends_on:
      vpn:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET_KEY}
      - SEARXNG_REDIS_URL=redis://redis:6379/0
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    <<: *hardening
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # WireGuard tunnel build can be slow on first start
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: private-search-gateway:local
    container_name: search-gateway
    # No access log: uvicorn's default access log wrote every GET /search?q=... line (A3).
    command: ["uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    # Security audit 2026-10-15 (A3): search queries were kept in plaintext container logs with no
    # rotation. Cap retention here; the gateway also runs without uvicorn's access log.
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - search-net
      - default
    depends_on:
      searxng:
        condition: service_started
      redis:
        condition: service_healthy
    # NO env_file HERE, deliberately (2026-08-28). `env_file: ../.env` injected EVERY
    # variable in the root .env into this container's environment (111 distinct names on
    # 2026-08-28 - a measurement of that day, not a fixed property) - the Cloudflare tunnel
    # token, the Authelia secrets, the Mullvad key, the Tailscale auth key, the Mattermost
    # bot tokens - none of which this service uses. It was redundant from the day it was
    # written (commit 0bc099e): `${VAR}` below is interpolated by the compose CLI from the
    # project environment, never by env_file. A wildcard grant is safe until the thing it
    # wildcards grows, and .env grew into the whole stack.
    # THE RULE: a service names the variables it needs. Enforced by
    # scripts/checks/check-env-file-scope.ps1.
    environment:
      # GATEWAY_API_KEY is the one REQUIRED Settings field (config.py: Field(...)).
      # The 2026-08-28 env_file removal above named only the two upstreams, and the
      # running container predated it, so the first recreate (research-trust deploy,
      # 2026-09-11) crash-looped on 'GATEWAY_API_KEY Field required'.
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
      # The engine behind the adapter interface (search-gate artifact 7): SEARCH_ENGINE names the
      # adapter, SEARCH_ENGINE_URL its address. SearXNG is today's engine, nothing more.
      - SEARCH_ENGINE=searxng
      - SEARCH_ENGINE_URL=http://searxng:8080
      - REDIS_URL=redis://redis:6379/1
      # --- the gate (security plan step 3), shipped beside today's routes ---
      # GET /search stays keyless for OWUI and the research engine until step 5 moves them to
      # per-caller keys; then this line goes and the route refuses anonymous callers (the code
      # default).
      - SEARCH_ANONYMOUS_LEGACY=true
      # Secrets are FILES (never environment values; every `docker exec` inherits those), in
      # search/secrets/ (gitignored). A missing file is the pre-gate posture: no per-caller keys
      # (the gate's routes refuse everyone), no intake key (every screened answer is 503, never
      # unscreened), no redis password.
      - REDIS_PASSWORD_FILE=/run/secrets/search-redis/redis.conf
      - GATE_CALLER_KEYS_FILE=/run/secrets/search-gate/caller_keys
      - INTAKE_KEY_FILE=/run/secrets/search-gate/intake_key
      - INTAKE_URL=http://openbrain-intake:8000/v1/intake
      # page fetches leave through the plane's VPN proxy; names are resolved by DoH THROUGH it
      - GATE_FETCH_PROXY_URL=http://vpn:8888
    volumes:
      - ./secrets/redis:/run/secrets/search-redis:ro
      - ./secrets/gate:/run/secrets/search-gate:ro
    ports:
      - "127.0.0.1:8085:8080"   # native REST / Tavily shim for host tools
    restart: unless-stopped
    <<: *hardening
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # mcpo (search-mcpo, MCP->OpenAPI on :8001) retired 2026-08-20 (v3 J.3):
  # keyless and unreachable by design - it sat only on internal search-net,
  # which no consumer shares. The search gateway's REST face (`gateway`,
  # :8085) is the live surface; gateway/mcp_server.py stays in the source
  # tree if an MCP edge is ever wired to a real consumer.

networks:
  # Plane-internal isolation net — native: only this project’s four services.
  search-net:
    internal: true
  # The anchor’s shared bridge (internet-capable). External so the `vpn` and
  # `gateway` DNS names keep resolving for OB1/OWUI consumers.
  default:
    external: true
    name: ai-stack_default
