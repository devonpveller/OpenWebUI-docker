# Canonical lease names for THIS environment - the policy half of lease.ps1
# (which is generic mechanism and knows nothing about this stack).
#
# lease.ps1 refuses names not listed here unless -AdHoc is passed, because a typo
# ("openbrain" vs "open-brain") would create a second lock for the same plane and
# protect nothing. Porting to another environment = replacing this list; deleting
# the file disables validation entirely.
#
# One name per compose plane (the stack's real fault domains - see /stack-map),
# plus the coordination points that are not planes. Adding a plane to the stack?
# The container rule already routes you through the stack-map doc - add its lease
# name here in the same change.

# -- coordination points --------------------------------------------------------
merge          # landing a branch into development (MERGE-PROTOCOL.md step 2)

# -- compose planes -------------------------------------------------------------
inference      # llm-gateway, llm-queue, *-upstream servers
memory         # mnemory + cloud gateway
search         # vpn, searxng, redis, gateway
coder          # little-coder, open-terminal, lc-egress
frontend       # openwebui + tailscale netns pair
open-brain     # the openbrain-* fleet, wiki viewer/workbench, Open Notebook trio
agent-org      # mattermost, agent-bridge, ao-workers
portal         # caddy, authelia, cloudflared + watchers
