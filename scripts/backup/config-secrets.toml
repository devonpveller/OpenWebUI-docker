# scripts/backup/config-secrets.toml
#
# POLICY for the encrypted config + secrets backup (config_secrets_backup.py).
# Runbook + one-time key setup: documentation/runbooks/config-secrets-backup.md
#
# The inventory is DERIVED, not listed: every run finds the files below on
# disk, keeps the ones git does not track (a tracked file is already in git),
# and archives them. You edit this file only to
#   - add a file the derivation cannot find      -> [[include]] or [[required]]
#   - leave out a file it finds on purpose        -> [[exclude]], with a reason
#   - accept a bind-mounted file outside the repo -> [[outside]], with a reason
#   - widen or narrow where it looks              -> secret_dirs / prune_*
# `python scripts/backup/config_secrets_backup.py inventory` prints the result
# (paths and why each is in; never a value).
#
# What the derivation finds (config_secrets_backup.py, derive_inventory):
#   1. env files   - any untracked file named like env_names (and not like
#                    env_name_ignore) anywhere in the repo outside the pruned
#                    trees: every plane's .env, the root .env, OB1/docker/.env,
#                    the OB1 recipes' .env files, and the .env.bak-* copies.
#   2. secret dirs - every untracked file under secret_dirs.
#   3. bind mounts - every plane in stack.manifest.toml whose own .env exists
#                    on this host is rendered (`docker compose config`, once
#                    with no profile and once per declared profile - the CLI is
#                    enough, no daemon); every BIND source (and file-backed
#                    top-level config/secret) is followed:
#                      - inside the repo, an untracked FILE is archived, and an
#                        untracked file under a DIRECTORY source is archived;
#                      - a source that should be a file (its name has a suffix,
#                        or is in file_like_names) and is ABSENT, or is an EMPTY
#                        DIRECTORY (Docker makes one when the file is missing),
#                        is a MISSING error;
#                      - a FILE outside the repo is an OUTSIDE error unless an
#                        [[outside]] entry says who backs it up.
#   4. [[include]] - `glob` = fnmatch over walked repo-relative paths; `path` =
#                    one literal file (reaches into pruned trees like .claude/).
# Patterns are fnmatch-style over forward-slash repo-relative paths, and `*`
# matches across `/`.
#
# The coverage check (scripts/checks/check-backup-coverage.ps1 -> `check`)
# FAILS while any derived file is not in the newest archive, any [[required]]
# file is missing, a file is over max_file_bytes, a plane cannot be rendered,
# an outside file is unaccounted for, or no recipient is configured.

# Count-based like every sidecar (backup-conventions.md, ingredient 4). One a
# night, so 14 is two weeks. Override: CONFIG_SECRETS_BACKUP_RETAIN_COUNT.
# An archive past the count is still KEPT while it holds the last copy of a file
# the newer archives no longer have - a deleted secret is never pruned out of
# its last backup by the clock (the 2026-09-28 users_database.yml loss went
# unnoticed until a restart on 2026-10-04).
retain_count = 14

# The host holds only the PUBLIC half of the operator's age key pair. One
# recipient (age1...) per line, `#` comments allowed. Override with
# --recipients or CONFIG_SECRETS_BACKUP_RECIPIENTS. No recipient = no backup:
# the job refuses, loudly, with exit 2. A private key (AGE-SECRET-KEY-...) in
# this file is refused too.
recipients_file = "secrets/config-backup/age-recipients.txt"

# The age binary. Empty = `age` on PATH. The scheduled task passes --age with
# the absolute path (install-config-secrets-task.ps1 -AgePath). Whatever is
# found must hash to an [[age_pin]] (further down), or the job refuses: this binary sees
# every secret in plaintext on its stdin.
age_binary = ""

# A file bigger than this is not archived and fails the check until it is
# excluded (with a reason) or the cap is raised. Config and credentials are
# kilobytes; something bigger is data that belongs to a sidecar.
max_file_bytes = 5242880

# Write every archived, currently-gitignored path into .git/info/exclude on each
# run (see `pin-ignores` in the script): an OLD branch whose .gitignore predates
# a rule then still ignores the file, so a GUI client's "stash my changes" on a
# branch switch cannot remove it. That is how users_database.yml was lost.
# Only the MAIN checkout writes the block (info/exclude is shared by every
# worktree); a run in a linked worktree logs that it skipped it.
pin_ignores = true

env_names = [".env", ".env.*", "*.env", "*.env.*"]
env_name_ignore = ["*.example", "*.sample", "*.template", "*.dist"]

secret_dirs = [
  "secrets",
  "OB1/secrets",
  "agent-org/agent-bridge/secrets",
]

# Names that are files although they have no suffix (for the MISSING rule).
file_like_names = ["crontab", "Caddyfile", "known_hosts"]

# Directory NAMES never descended into, anywhere. Any directory whose name
# contains "venv" is pruned as well.
prune_names = [
  ".git", ".claude", ".vscode", "node_modules", "__pycache__", ".pytest_cache",
  ".ruff_cache", ".mypy_cache", ".next", ".quadrant",
]
# Repo-relative directories never descended into: data and archives that the
# sidecars and the NAS archive pass already carry, and our own output.
prune_paths = ["backups", "backup", "logs", "reports", "data", "incident"]

# Every age build the job will run (see age_binary above). TOML: arrays of
# tables come after every plain key, or the keys below them join the table.
[[age_pin]]
sha256 = "2821a4ed191da07372acd302e5f6feae7a7985e285e1417765ebe74025af45f0"
what = "age.exe from age-v1.3.2-windows-amd64.zip (zip sha256 f48d8f8f9ebe903ab5027ed067652f2cc1db94bc206976430133b905dcd8e8c7, the digest GitHub publishes for that release asset)"

# A [[required]] path is archived like an [[include]] AND must exist as a file
# (when `plane` is given: while that plane's .env exists on this host).

[[include]]
glob = "portal/config/*"
why = "portal config the gitignore keeps out of git (users DB, alerter OAuth files, tripwire baseline, healthcheck env)"

[[include]]
path = ".mcp.json"
why = "local MCP config; holds the Open Brain access key"

[[include]]
path = ".vscode/mcp.json"
why = "VS Code MCP config; holds the Open Brain access key"

[[include]]
path = ".claude/settings.local.json"
why = "this host's Claude Code permissions and env"

[[include]]
glob = "OB1/docker/*.config.json"
why = "mcpo tool-server configs (gitignored in OB1; carry API keys)"

[[required]]
path = "portal/config/authelia/users_database.yml"
plane = "portal"
why = "Authelia's file user backend; absent, Docker bind-mounts an empty DIRECTORY and Authelia crash-loops (2026-10-04, 205 restarts)"

[[required]]
path = ".stack/state.json"
why = "per-host plane/profile enablement; without it stack.py up starts nothing that was enabled here"

[[exclude]]
glob = "*/deno.lock"
reason = "Deno lockfile, regenerated on the next build"

[[exclude]]
glob = "OB1/recipes/brain-backup/backup/*"
reason = "brain-backup recipe's JSON export of the Open Brain DB - data, carried by the openbrain-db sidecar"

[[exclude]]
glob = "OB1/recipes/*report*.md"
reason = "import run reports (human-readable logs), not config"

[[exclude]]
glob = "*/node_modules/*"
reason = "dependencies, reinstalled by the build"

# [[outside]]
# path = "C:/somewhere/else/credentials.json"
# reason = "who backs it up instead"
