[project]
name = "llm-queue"
version = "0.1.0"
description = "Front-ended inference admission controller (B2) — holds & dispatches requests to the llama.cpp backend behind LiteLLM. See documentation/implementation-guide/LiteLLM-Proxy/DESIGN-B2-inference-queue.md."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    # Durable analytics events (P3) — llm-queue's OWN store, never LiteLLM's
    # schema-managed Postgres (design §4.4/§10). SQLite on a small volume keeps
    # the queue on llm-backend-net only (no route to llm-gateway-db).
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end test requiring a live upstream (deselected by default)",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's Depends()/Header() in argument defaults is the intended idiom.
ignore = ["B008"]
