# docker-compose.yml - ai-stack root (thin since 2026-08-20, CLEANUP-PLAN v3 D.1)
# Service definitions live in compose/<plane>.yml via include; networks and
# volumes stay here. UX unchanged: plain `docker compose ...` from this dir.
# Container rule: adding/removing/moving a service = compose file + recovery
# scripts (emergency-recovery.ps1/.bat) + stack-map doc together.

# The long include form pins project_directory to the repo root so that the
# included files' relative paths (./config, ./scripts, ./backup, .env
# interpolation) keep resolving exactly as they did in the monolithic file.
include:
  - path: compose/core.yml
    project_directory: .
  - path: compose/inference.yml
    project_directory: .
  - path: compose/memory.yml
    project_directory: .
  - path: compose/search.yml
    project_directory: .
  - path: compose/coder.yml
    project_directory: .
  - path: compose/auxiliary.yml
    project_directory: .
  - path: compose/backups.yml
    project_directory: .
  # The portal slice moved to its own compose project 2026-08-21:
  # portal/docker-compose.yml (project name `portal`), driven by
  # scripts/portal/portal-on.ps1 / portal-off.ps1. It attaches to this
  # project's app-net externally to reach openwebui / open_notebook.

volumes:
  openwebui-data:
  mnemory-data:
  smolcrawl-data:
  llm-gateway-db-data:   # LiteLLM spend-log DB (transparent gateway, guide §1A)
  llm-queue-data:        # llm-queue's OWN analytics event store (B2/P3 SQLite, NOT LiteLLM's schema)
  # little-coder — five expertise volumes (persistence boundary, design §3.6)
  # plus the project-scoped workspace shared with open-terminal.
  # `little-coder-sessions` holds pi's per-chat session files — added in
  # the §3.1 follow-up that switched from --no-session to per-trigger
  # `--session <id>` for OWUI in-chat continuity + native compaction.
  little-coder-journals:
  little-coder-skill:
  little-coder-cohorts:
  little-coder-polyglot:
  little-coder-sessions:
  little-coder-workspace:
  # (Portal volumes moved to the `portal` compose project 2026-08-21 —
  # data migrated to portal_* volumes during the split cutover.)
  # Cross-project named volume from the open-brain compose project,
  # referenced by openbrain-wiki-backup. ai-stack does not own this;
  # it must already exist (it does, when OB1 is up).
  openbrain-wiki-data:
    external: true
    name: open-brain_openbrain-wiki-data
  # X.2 — OB1's gitignored binary-asset volume (uploaded images/PDFs), so the
  # wiki-backup can snapshot it (it's not in the git vault). External: owned by
  # the open-brain project.
  wiki-assets:
    external: true
    name: open-brain_wiki-assets

networks:
  # Internal-only CALLER plane: no internet access. Every service that consumes
  # inference sits here and reaches it ONLY via the `llama-cpp` /
  # `llama-cpp-embed` aliases on llm-gateway. The real inference servers are NOT
  # here (moved to llm-backend-net, 2026-06-13), so callers physically cannot
  # route around LiteLLM.
  llm-net:
    internal: true
  # Internal-only BACKEND plane: the real inference servers
  # (llama-cpp-upstream, llama-cpp-embed-upstream) + the single ingress
  # (llm-gateway) + the lm-models-backup liveness probe. Nothing else attaches,
  # so inference is reachable only through the gateway. Enforced at change time
  # by scripts/checks/check-llm-gateway-routing.ps1; see CLAUDE.md "Inference plane".
  llm-backend-net:
    internal: true
  # Internal-only network for the search stack. SearXNG/redis/gateway have NO
  # internet route here; only `vpn` (Mullvad, also on `default`) can egress —
  # engine queries AND page fetches (tor retired 2026-08-21).
  search-net:
    internal: true
  # Internal-only network for the little-coder control plane. little-coder
  # and open-terminal talk here; none reaches the internet except
  # via lc-egress, which is allowlisted to the git host (design §3.4).
  lc-net:
    internal: true
  default:
    driver: bridge
  # app-net: the ai-stack↔portal seam — the portal project's caddy attaches
  # here EXTERNALLY (name: ai-stack_app-net) to reach openwebui +
  # open_notebook. edge/auth/notify nets moved to the portal project
  # 2026-08-21.
  app-net:
    driver: bridge
  # ----- Cross-project networks (declared external) ----------------------
  # obnet: the open-brain compose project's own bridge. openbrain-db-backup
  # (defined below) joins it to reach openbrain-db over TCP. The OB1 stack
  # must be UP for backups to succeed -- consistent with the existing
  # cross-project dependency (OB1 depends on ai-stack_llm-net).
  obnet:
    external: true
    name: open-brain_obnet
