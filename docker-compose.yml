# docker-compose.yaml

services:
  openwebui:
    build:
      context: .
      dockerfile: Dockerfile.openwebui-gpu
    container_name: openwebui
    ports:
      - "127.0.0.1:3000:8080"  # Bind to localhost only
    volumes:
      - ./data/openwebui:/app/backend/data
      - ./config:/app/config:ro  # Read-only config
    environment:
      - OLLAMA_HOST=http://localhost:11434
      - USE_CUDA=true
      - USE_CUDA_DOCKER=true
      - TRANSFORMERS_CACHE=/tmp/transformers_cache
      - HF_HOME=/tmp/hf_cache
      # Performance Optimizations for faster Ollama communication
      - AIOHTTP_CLIENT_TIMEOUT=300
      - AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST=60
      - MODELS_CACHE_TTL=10  # Cache model list for 10 seconds to reduce repeated calls
      - ENABLE_BASE_MODELS_CACHE=true  # Cache base models for faster loading
      # Reduce OpenWebUI overhead for model requests
      - CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE=4  # Larger chunks for better streaming performance
      - BYPASS_MODEL_ACCESS_CONTROL=true  # Skip access control checks for faster requests
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    pull_policy: always
    security_opt:
      - no-new-privileges:true
    read_only: false  # OpenWebUI needs write access for temp files
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    labels:
      - "com.centurylinklabs.watchtower.lifecycle.post-update=/post-update-hook.sh"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 5s
      timeout: 3s
      retries: 3

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Read-only access
      - ./scripts/post-update-hook.sh:/post-update-hook.sh:ro  # Post-update hook
      - .:/compose-dir:ro  # Access to compose files for hook
    environment:
      - WATCHTOWER_CLEANUP=true            # remove old images
      - WATCHTOWER_POLL_INTERVAL=120       # check every 2 minutes for testing
      - WATCHTOWER_INCLUDE_STOPPED=false   # Only running containers
      - WATCHTOWER_DEBUG=true              # Enable debug logging to verify container detection
      - WATCHTOWER_RUN_ONCE=false          # Keep running
      - WATCHTOWER_LIFECYCLE_HOOKS=true    # Enable lifecycle hooks
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true             # Prevent privilege escalation
    command: ["openwebui"]  # Monitor only the openwebui container by name

  tailscale:
    build:
      context: .
      dockerfile: dockerfile.tailscale
    container_name: tailscale
    network_mode: service:openwebui
    env_file:
      - .env
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TS_HOSTNAME=openwebui
      - TS_ACCEPT_DNS=false
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    depends_on:
      openwebui:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "sh", "-c", "tailscale --socket=/tmp/tailscaled.sock status >/dev/null 2>&1 && ping -c 1 8.8.8.8 >/dev/null 2>&1 && wget -q -T 3 -O /dev/null http://127.0.0.1:8080 && wget -q -T 3 -O /dev/null http://127.0.0.1:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    network_mode: service:openwebui
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Optimized Ollama settings for faster response to OpenWebUI
      - OLLAMA_KEEP_ALIVE=20m  # Keep models in memory longer
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_MAX_LOADED_MODELS=2  # Allow multiple models to stay loaded
      - OLLAMA_NUM_PARALLEL=2  # Allow parallel requests
      - OLLAMA_FLASH_ATTENTION=1  # Enable flash attention for faster inference
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    pull_policy: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      openwebui:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
