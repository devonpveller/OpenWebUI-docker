# docker-compose.yml — the ai-stack PLATFORM ANCHOR (Part K, 2026-08-21).
#
# This project owns NO services anymore — only the shared seam networks that
# every plane project attaches to externally. `docker compose up -d` here
# creates the networks and starts nothing; run it once before any plane on a
# cold host (scripts/stack/stack.ps1 does this for you).
#
# The service trees are self-contained compose projects, each driven with
# `docker compose -f <dir>/docker-compose.yml --env-file .env ...` from this
# directory (single root .env; every plane file carries a ${VAR:?} fail-loud
# guard against running without it):
#
#   frontend/   openwebui + tailscale (netns pair) + their backups   (K.5)
#   inference/  llama.cpp upstreams + llm-queue + LiteLLM gateway    (K.1)
#   memory/     mnemory + cloud gateway + backup                     (K.2)
#   search/     Mullvad vpn + redis + searxng + gateway              (K.3)
#   coder/      open-terminal + little-coder + lc-egress + backup    (K.4)
#   portal/     internet front-end (portal-on.ps1 / portal-off.ps1)
#   OB1/docker/ Open Brain — incl. the Open Notebook trio since K.5b
#   agent-org/docker/  Mattermost + the governed agent-bridge org
#
# Keeping the project name `ai-stack` is what keeps every external reference
# (ai-stack_llm-net / ai-stack_app-net / ai-stack_default) valid unchanged.
# Container rule still applies: adding/removing/moving a service = the plane
# compose file + recovery scripts + the stack-map doc together.

volumes:
  # Orphan from smolcrawl-pipelines (retired 2026-08-21) — old crawl indexes.
  # Delete when confident nothing wants them back.
  smolcrawl-data:

networks:
  # Internal-only CALLER plane: no internet access. Every inference consumer
  # (frontend, memory, coder, OB1, agent-org) attaches here externally and
  # reaches inference ONLY via the `llama-cpp` / `llama-cpp-embed` aliases on
  # the inference project's llm-gateway. The real inference servers sit on the
  # inference project's NATIVE llm-backend-net, so callers physically cannot
  # route around LiteLLM. Enforced by scripts/checks/check-llm-gateway-routing.ps1.
  llm-net:
    internal: true
  # The shared internet-capable bridge. Cross-project DNS seam: the search
  # project's `vpn` (:8888 proxy) + `gateway` and the frontend's `openwebui`
  # attach externally; OB1's research/podcast resolve them here
  # (search-gw-net in OB1's compose = this network).
  default:
    driver: bridge
  # The app seam: portal caddy → openwebui / open_notebook, and the tailnet
  # QUARTZ serve route → caddy:8446. Portal + frontend + OB1 (wiki-viewer,
  # open_notebook) attach externally.
  app-net:
    driver: bridge
