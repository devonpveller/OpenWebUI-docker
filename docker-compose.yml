# docker-compose.yaml

services:
  openwebui:
    build:
      context: .
      dockerfile: Dockerfile.openwebui-gpu
    container_name: openwebui
    ports:
      - "127.0.0.1:3000:8080" # Bind to localhost only
    volumes:
      - ./data/openwebui:/app/backend/data
      - ./config:/app/config:ro # Read-only config
      - .:/host_project:ro # Mount entire project for AI Stack pipe functions
    environment:
      - OLLAMA_HOST=http://localhost:11434
      - USE_CUDA=true
      - USE_CUDA_DOCKER=true
      - NVIDIA_VISIBLE_DEVICES=${GPU_AISTACK_DEVICE_ID:-1}
      - CUDA_VISIBLE_DEVICES=${GPU_AISTACK_DEVICE_ID:-1}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TRANSFORMERS_CACHE=/tmp/transformers_cache
      - HF_HOME=/tmp/hf_cache
      # Performance Optimizations for faster Ollama communication
      - AIOHTTP_CLIENT_TIMEOUT=3600
      - AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST=60
      - AIOHTTP_CLIENT_TIMEOUT_TOOL_CALL=3600
      - MODELS_CACHE_TTL=10 # Cache model list for 10 seconds to reduce repeated calls
      - ENABLE_BASE_MODELS_CACHE=true # Cache base models for faster loading
      # Reduce OpenWebUI overhead for model requests
      - CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE=4 # Larger chunks for better streaming performance
      - BYPASS_MODEL_ACCESS_CONTROL=true # Skip access control checks for faster requests
      - ENABLE_OPEN_TERMINAL=true
      - TERMINAL_SERVER_CONNECTIONS=[{"id":"open-terminal","name":"Open Terminal","url":"http://localhost:8000","key":"${OPEN_TERMINAL_API_KEY}"}]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_AISTACK_DEVICE_ID:-1}"]
              capabilities: [ gpu ]
    restart: unless-stopped
    pull_policy: build
    security_opt:
      - no-new-privileges:true
    read_only: false # OpenWebUI needs write access for temp files
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test: [ "CMD", "curl", "-f", "--max-time", "10", "http://localhost:8080/health" ]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 60s

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Read-only access
      - ./scripts/post-update-hook.sh:/post-update-hook.sh:ro # Post-update hook
      - .:/compose-dir:ro # Access to compose files for hook
    environment:
      - WATCHTOWER_CLEANUP=true # remove old images
      - WATCHTOWER_POLL_INTERVAL=120 # check every 2 minutes for testing
      - WATCHTOWER_INCLUDE_STOPPED=false # Only running containers
      - WATCHTOWER_DEBUG=true # Enable debug logging to verify container detection
      - WATCHTOWER_RUN_ONCE=false # Keep running
      - WATCHTOWER_LIFECYCLE_HOOKS=true # Enable lifecycle hooks
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true # Prevent privilege escalation

  tailscale:
    build:
      context: .
      dockerfile: dockerfile.tailscale
    container_name: tailscale
    network_mode: service:openwebui
    env_file:
      - .env
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TS_HOSTNAME=openwebui
      - TS_ACCEPT_DNS=false
      - LMSTUDIO_HOST=${LMSTUDIO_HOST:-host.docker.internal}
      - LMSTUDIO_PORT=${LMSTUDIO_PORT:-1234}
      - LMSTUDIO_ENABLED=${LMSTUDIO_ENABLED:-true}
      - LLAMA_CPP_HOST=${LLAMA_CPP_HOST:-llama-cpp}
      - LLAMA_CPP_PORT=${LLAMA_CPP_PORT:-8080}
      - LLAMA_CPP_ENABLED=${LLAMA_CPP_ENABLED:-true}
      - LLAMA_CPP_EMBED_HOST=${LLAMA_CPP_EMBED_HOST:-llama-cpp-embed}
      - LLAMA_CPP_EMBED_PORT=${LLAMA_CPP_EMBED_PORT:-8080}
      - LLAMA_CPP_EMBED_ENABLED=${LLAMA_CPP_EMBED_ENABLED:-true}
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    depends_on:
      openwebui:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: [ "CMD", "sh", "-c", "tailscale --socket=/tmp/tailscaled.sock status >/dev/null 2>&1 && ping -c 1 8.8.8.8 >/dev/null 2>&1 && wget -q -T 3 -O /dev/null http://127.0.0.1:8080 && wget -q -T 3 -O /dev/null http://127.0.0.1:11434/api/version" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: open-terminal
    network_mode: service:openwebui
    env_file:
      - .env
    environment:
      - API_KEY=${OPEN_TERMINAL_API_KEY}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      openwebui:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    network_mode: service:openwebui
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_AISTACK_DEVICE_ID:-1}
      - CUDA_VISIBLE_DEVICES=${GPU_AISTACK_DEVICE_ID:-1}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Optimized Ollama settings for faster response to OpenWebUI
      - OLLAMA_KEEP_ALIVE=1200 # Keep models in memory longer (20 minutes in seconds)
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_MAX_LOADED_MODELS=2 # Allow multiple models to stay loaded
      - OLLAMA_NUM_PARALLEL=2 # Allow parallel requests
      - OLLAMA_FLASH_ATTENTION=1 # Enable flash attention for faster inference
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_AISTACK_DEVICE_ID:-1}"]
              capabilities: [ gpu ]
    restart: unless-stopped
    pull_policy: never
    security_opt:
      - no-new-privileges:true
    depends_on:
      openwebui:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - C:\Users\yamao\.lmstudio\models:/models:ro
      - ./config/chat-template.jinja:/etc/llama/chat-template.jinja:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_LLAMA_CPP_DEVICE_ID:-0}
      - CUDA_VISIBLE_DEVICES=${GPU_LLAMA_CPP_DEVICE_ID:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LLAMA_ARG_MODEL=/models/lmstudio-community/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-Q4_K_M.gguf
      - LLAMA_ARG_CHAT_TEMPLATE_FILE=/etc/llama/chat-template.jinja
      - LLAMA_ARG_CTX_SIZE=32768
      - LLAMA_ARG_N_GPU_LAYERS=99
      - LLAMA_ARG_N_PARALLEL=1
      - LLAMA_ARG_BATCH=2048
      - LLAMA_ARG_UBATCH=1024
      - LLAMA_ARG_CACHE_TYPE_K=q8_0
      - LLAMA_ARG_CACHE_TYPE_V=q8_0
      - LLAMA_ARG_CACHE_RAM=256
      - LLAMA_ARG_FLASH_ATTN=on
      - LLAMA_ARG_REASONING_BUDGET=4096
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_LLAMA_CPP_DEVICE_ID:-0}"]
              capabilities: [gpu]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  mnemory:
    build:
      context: ../mnemory
      dockerfile: Dockerfile
    container_name: mnemory
    ports:
      - "127.0.0.1:8050:8050"
      - "127.0.0.1:8051:8051"
    environment:
      - LLM_API_KEY=ollama
      - LLM_BASE_URL=http://llama-cpp:8080/v1
      - LLM_MODEL=Qwen3.6-35B-A3B-Q4_K_M.gguf
      - EMBED_BASE_URL=http://llama-cpp-embed:8080/v1
      - EMBED_MODEL=qllama/bge-m3:latest
      - EMBED_DIMS=1024
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_API_KEYS=${MCP_API_KEYS}
      - FIND_MEMORIES_QUERIES=3
      - LLM_CONTEXT_SIZE=8192
      - MGMT_PORT=8051
    volumes:
      - mnemory-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      llama-cpp:
        condition: service_healthy
      llama-cpp-embed:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8051/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mnemory-backup:
    image: alpine:3.21
    container_name: mnemory-backup
    volumes:
      - mnemory-data:/data:ro
      - ./backups/mnemory:/backups
      - ./backup/mnemory-backup.sh:/scripts/backup.sh:ro
    environment:
      - BACKUP_DIR=/backups
      - DATA_DIR=/data
      - RETAIN_DAYS=${BACKUP_RETAIN_DAYS:-7}
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        chmod +x /scripts/backup.sh
        echo "$${BACKUP_CRON} /scripts/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "[$(date -u +%FT%TZ)] Backup scheduler started (cron: $${BACKUP_CRON}, retain: $${RETAIN_DAYS} days)"
        crond -f -l 2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      mnemory:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  llama-cpp-embed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-embed
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./data/models/embeddings:/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_LLAMA_CPP_EMBED_DEVICE_ID:-1}
      - CUDA_VISIBLE_DEVICES=${GPU_LLAMA_CPP_EMBED_DEVICE_ID:-1}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LLAMA_ARG_MODEL=/models/bge-m3-f16.gguf
      - LLAMA_ARG_CTX_SIZE=20480
      - LLAMA_ARG_N_GPU_LAYERS=99
      - LLAMA_ARG_N_PARALLEL=2
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_EMBEDDINGS=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_LLAMA_CPP_EMBED_DEVICE_ID:-1}"]
              capabilities: [gpu]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  smolcrawl-pipelines:
    build:
      context: ./smolcrawl
      dockerfile: Dockerfile
    container_name: smolcrawl-pipelines
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - smolcrawl-data:/app/pipelines
    environment:
      - PIPELINES_DIR=/app/pipelines
      - PIPELINES_API_KEY=${SMOLCRAWL_API_KEY:-0p3n-w3bu!}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      openwebui:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:9099/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mnemory-data:
  smolcrawl-data:
