# docker-compose.yaml

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    ports:
      - "127.0.0.1:3000:8080"  # Bind to localhost only
    volumes:
      - ./data/openwebui:/app/backend/data
      - ./config:/app/config:ro  # Read-only config
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
    restart: unless-stopped
    pull_policy: always
    security_opt:
      - no-new-privileges:true
    read_only: false  # OpenWebUI needs write access for temp files
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 5s
      timeout: 3s
      retries: 3

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Read-only access
    environment:
      - WATCHTOWER_CLEANUP=true            # remove old images
      - WATCHTOWER_POLL_INTERVAL=3600      # check every hour
      - WATCHTOWER_SCOPE=ai-stack          # Limit scope to this project
      - WATCHTOWER_INCLUDE_STOPPED=false   # Only running containers
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true             # Prevent privilege escalation

  tailscale:
    build:
      context: .
      dockerfile: dockerfile.tailscale
    container_name: tailscale
    network_mode: service:openwebui
    env_file:
      - .env
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TS_HOSTNAME=openwebui
      - TS_ACCEPT_DNS=false
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    depends_on:
      openwebui:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "sh", "-c", "tailscale --socket=/tmp/tailscaled.sock status >/dev/null 2>&1 && ping -c 1 8.8.8.8 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
