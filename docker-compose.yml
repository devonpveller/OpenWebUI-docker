# docker-compose.yaml

services:
  openwebui:
    build:
      context: .
      dockerfile: Dockerfile.openwebui-gpu
    container_name: openwebui
    ports:
      - "127.0.0.1:3000:8080" # Bind to localhost only
    networks:
      - default
      - llm-net
      - app-net               # plan §7.4 — portal Caddy reaches openwebui:8080 here
    volumes:
      - openwebui-data:/app/backend/data
      - ./config:/app/config:ro # Read-only config
      - .:/host_project:ro # Mount entire project for AI Stack pipe functions
    environment:
      - TZ=America/New_York
      # Pinned session/encryption key (value in .env). 0.9.6 hard-requires this; and the
      # key was previously auto-generated into the container's EPHEMERAL layer
      # (/app/backend/.webui_secret_key, outside the data volume), so a recreate would
      # rotate it and break every encrypted-at-rest value in webui.db + all sessions.
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - OLLAMA_HOST=http://localhost:11434
      - USE_CUDA=true
      - USE_CUDA_DOCKER=true
      - NVIDIA_VISIBLE_DEVICES=${GPU_AISTACK_DEVICE_ID:-1}
      - CUDA_VISIBLE_DEVICES=${GPU_AISTACK_DEVICE_ID:-1}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TRANSFORMERS_CACHE=/tmp/transformers_cache
      - HF_HOME=/tmp/hf_cache
      # Performance Optimizations for faster Ollama communication
      - AIOHTTP_CLIENT_TIMEOUT=3600
      - AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST=60
      - AIOHTTP_CLIENT_TIMEOUT_TOOL_CALL=3600
      - MODELS_CACHE_TTL=10 # Cache model list for 10 seconds to reduce repeated calls
      - ENABLE_BASE_MODELS_CACHE=true # Cache base models for faster loading
      # Reduce OpenWebUI overhead for model requests
      - CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE=4 # Larger chunks for better streaming performance
      - BYPASS_MODEL_ACCESS_CONTROL=true # Skip access control checks for faster requests
      # 0.9.6 renamed CHAT_RESPONSE_MAX_TOOL_CALL_RETRIES -> _ITERATIONS and raised the
      # default 30 -> 256. Pin a sane bound so deep_research / little-coder tool loops
      # don't run away on latency/cost. (Ignored by 0.8.10, which uses the old name.)
      - CHAT_RESPONSE_MAX_TOOL_CALL_ITERATIONS=40
      # open-terminal moved into the little-coder control plane (Tool chapter):
      # it left OWUI's network namespace, so OWUI's direct terminal access
      # ends here. It returns in chapter 2 via lc-mcpo (design §3.4, Decision
      # Log 2026-05-20). Re-enable only when chapter 2 lands.
      # - ENABLE_OPEN_TERMINAL=true
      # - TERMINAL_SERVER_CONNECTIONS=[{"id":"open-terminal","name":"Open Terminal","url":"http://localhost:8000","key":"${OPEN_TERMINAL_API_KEY}"}]
      # Web search → Private Search Gateway (Approach B: OWUI's stock searxng
      # engine pointed at the gateway, which routes via Tor). This also feeds
      # smolcrawl deep_research, which calls OWUI's search_web().
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-True}
      - WEB_SEARCH_ENGINE=${WEB_SEARCH_ENGINE:-searxng}
      - SEARXNG_QUERY_URL=${SEARXNG_QUERY_URL:-http://gateway:8080/search?q=<query>}
      # Built-in code interpreter disabled: the default Pyodide engine runs
      # via `await __event_call__({"type": "execute:python"})` with no timeout
      # (backend/open_webui/tools/builtin.py execute_code), so when the
      # browser tab is backgrounded or the WS round-trip stalls, the tool
      # call hangs forever and the chat model stays stuck waiting. The fix
      # is still absent on OWUI main as of 2026-05-09. Re-enable only after
      # standing up the Jupyter engine — see
      # documentation/implementation-guide/Jupyter/.
      - ENABLE_CODE_INTERPRETER=${ENABLE_CODE_INTERPRETER:-False}
      - ENABLE_CODE_EXECUTION=${ENABLE_CODE_EXECUTION:-False}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_AISTACK_DEVICE_ID:-1}"]
              capabilities: [ gpu ]
    restart: unless-stopped
    pull_policy: build
    security_opt:
      - no-new-privileges:true
    read_only: false # OpenWebUI needs write access for temp files
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    healthcheck:
      test: [ "CMD", "curl", "-f", "--max-time", "10", "http://localhost:8080/health" ]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 60s

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Read-only access
      - ./scripts/post-update-hook.sh:/post-update-hook.sh:ro # Post-update hook
      - .:/compose-dir:ro # Access to compose files for hook
    environment:
      - DOCKER_API_VERSION=1.44 # image bakes in 1.25; engine 29+ (Docker Desktop 4.80) requires >=1.40
      - WATCHTOWER_CLEANUP=true # remove old images
      - WATCHTOWER_POLL_INTERVAL=120 # check every 2 minutes for testing
      - WATCHTOWER_INCLUDE_STOPPED=false # Only running containers
      - WATCHTOWER_DEBUG=true # Enable debug logging to verify container detection
      - WATCHTOWER_RUN_ONCE=false # Keep running
      - WATCHTOWER_LIFECYCLE_HOOKS=true # Enable lifecycle hooks
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true # Prevent privilege escalation

  tailscale:
    build:
      context: .
      dockerfile: dockerfile.tailscale
    container_name: tailscale
    network_mode: service:openwebui
    env_file:
      - .env
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TS_HOSTNAME=openwebui
      - TS_ACCEPT_DNS=false
      - LMSTUDIO_HOST=${LMSTUDIO_HOST:-host.docker.internal}
      - LMSTUDIO_PORT=${LMSTUDIO_PORT:-1234}
      - LMSTUDIO_ENABLED=${LMSTUDIO_ENABLED:-true}
      # MUST be the GATEWAY alias (llama-cpp / llama-cpp-embed), NOT the *-upstream
      # real servers. entrypoint.sh proxies the tailnet /llama-cpp + /llama-cpp-embed
      # serve routes here; pointing at *-upstream would expose inference on the
      # tailnet BYPASSING LiteLLM (no ledger, no routing). Gateway-only policy —
      # see scripts/check-llm-gateway-routing.ps1. (Was *-upstream after the
      # 2026-06-12 rename; corrected 2026-06-13.)
      - LLAMA_CPP_HOST=${LLAMA_CPP_HOST:-llama-cpp}
      - LLAMA_CPP_PORT=${LLAMA_CPP_PORT:-8080}
      - LLAMA_CPP_ENABLED=${LLAMA_CPP_ENABLED:-true}
      - LLAMA_CPP_EMBED_HOST=${LLAMA_CPP_EMBED_HOST:-llama-cpp-embed}
      - LLAMA_CPP_EMBED_PORT=${LLAMA_CPP_EMBED_PORT:-8080}
      - LLAMA_CPP_EMBED_ENABLED=${LLAMA_CPP_EMBED_ENABLED:-true}
      - OPEN_NOTEBOOK_HOST=${OPEN_NOTEBOOK_HOST:-open_notebook}
      - OPEN_NOTEBOOK_PORT=${OPEN_NOTEBOOK_PORT:-8502}
      - OPEN_NOTEBOOK_ENABLED=${OPEN_NOTEBOOK_ENABLED:-true}
      - OPEN_NOTEBOOK_TS_PORT=${OPEN_NOTEBOOK_TS_PORT:-8443}
      - OPEN_NOTEBOOK_API_PORT=${OPEN_NOTEBOOK_API_PORT:-5055}
      - OPEN_NOTEBOOK_API_TS_PORT=${OPEN_NOTEBOOK_API_TS_PORT:-5055}
      # OB1 Quartz wiki — routed through the portal Caddy's tailnet listener
      # (caddy:8446 → the shared (wiki_app) snippet) so the tailnet gets the SAME
      # /workbench key-injected routing as the external vhost: Tailnet > Caddy >
      # app (Authelia skipped — Tailscale device-auth is the trust boundary; the
      # workbench's X-Brain-Key is injected by Caddy). caddy is on ai-stack_app-net,
      # which openwebui — whose netns this container shares — is also on, so
      # caddy:8446 resolves here. (Pre-Caddy this pointed straight at
      # openbrain-wiki-viewer:8080, which had NO /workbench routing → 404 on tailnet.)
      # ORDER: caddy must be up before this serve configures at boot; if it isn't,
      # entrypoint.sh's monitor loop does deferred setup once caddy appears.
      - QUARTZ_HOST=${QUARTZ_HOST:-caddy}
      - QUARTZ_PORT=${QUARTZ_PORT:-8446}
      - QUARTZ_ENABLED=${QUARTZ_ENABLED:-true}
      - QUARTZ_TS_PORT=${QUARTZ_TS_PORT:-8444}
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    depends_on:
      openwebui:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: [ "CMD", "sh", "-c", "tailscale --socket=/tmp/tailscaled.sock status >/dev/null 2>&1 && ping -c 1 8.8.8.8 >/dev/null 2>&1 && wget -q -T 3 -O /dev/null http://127.0.0.1:8080" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # open-terminal — the little-coder workspace plane (design §3.4).
  # Tool reconfigures it: own networks (no host netns), git-proxy spliced in,
  # egress allowlisted via lc-egress. The repo lives on the shared workspace
  # volume; the agent edits files there, commands execute here.
  open-terminal:
    build:
      context: ./little-coder
      dockerfile: docker/Dockerfile.open-terminal
    image: little-coder-open-terminal:local
    container_name: open-terminal
    networks:
      - lc-net      # reachable by the control plane
      - llm-net     # llama-cpp inference
    env_file:
      - .env
    environment:
      - API_KEY=${OPEN_TERMINAL_API_KEY}
      # All internet traffic goes through lc-egress, which permits only the
      # operator-configured git host (design §3.4). Internal peers bypass it.
      - HTTP_PROXY=http://lc-egress:8888
      - HTTPS_PROXY=http://lc-egress:8888
      - http_proxy=http://lc-egress:8888
      - https_proxy=http://lc-egress:8888
      - NO_PROXY=llama-cpp,little-coder,lc-mcpo,lc-egress,localhost,127.0.0.1
      - no_proxy=llama-cpp,little-coder,lc-mcpo,lc-egress,localhost,127.0.0.1
    volumes:
      - little-coder-workspace:/workspace
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # ollama: # DISABLED - no longer used; llama-cpp (llama-swap) handles all LLM inference
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   network_mode: service:openwebui
  #   volumes:
  #     - ./data/ollama:/root/.ollama
  #   environment:
  #     - NVIDIA_VISIBLE_DEVICES=${GPU_AISTACK_DEVICE_ID:-1}
  #     - CUDA_VISIBLE_DEVICES=${GPU_AISTACK_DEVICE_ID:-1}
  #     - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  #     # Optimized Ollama settings for faster response to OpenWebUI
  #     - OLLAMA_KEEP_ALIVE=1200 # Keep models in memory longer (20 minutes in seconds)
  #     - OLLAMA_HOST=0.0.0.0:11434
  #     - OLLAMA_ORIGINS=*
  #     - OLLAMA_MAX_LOADED_MODELS=2 # Allow multiple models to stay loaded
  #     - OLLAMA_NUM_PARALLEL=2 # Allow parallel requests
  #     - OLLAMA_FLASH_ATTENTION=1 # Enable flash attention for faster inference
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             device_ids: ["${GPU_AISTACK_DEVICE_ID:-1}"]
  #             capabilities: [ gpu ]
  #   restart: unless-stopped
  #   pull_policy: never
  #   security_opt:
  #     - no-new-privileges:true
  #   depends_on:
  #     openwebui:
  #       condition: service_healthy
  #   labels:
  #     - "com.centurylinklabs.watchtower.enable=false"
  #   healthcheck:
  #     test: [ "CMD", "ollama", "list" ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s

  llama-cpp-upstream:
    image: ghcr.io/mostlygeek/llama-swap:cuda
    container_name: llama-cpp-upstream
    # Isolated behind the gateway (2026-06-13): only llm-gateway (+ the
    # lm-models-backup liveness probe) can reach this real inference server.
    # Callers reach inference via the `llama-cpp` alias on llm-gateway and
    # cannot route around LiteLLM. See the llm-backend-net definition below.
    networks:
      - llm-backend-net
    command:
      - -config
      - /app/config.yaml
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - C:\Users\yamao\.lmstudio\models:/models:ro
      - ./config/llama-swap.config.yaml:/app/config.yaml:ro
      - ./config/chat-template.jinja:/etc/llama/chat-template.jinja:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_LLAMA_CPP_DEVICE_ID:-0}
      - CUDA_VISIBLE_DEVICES=${GPU_LLAMA_CPP_DEVICE_ID:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LLAMA_CPP_TIMEOUT=${LLAMA_CPP_TIMEOUT:-300}
      - LLAMA_CPP_CACHE_TYPE_K=${LLAMA_CPP_CACHE_TYPE_K:-q4_0}
      - LLAMA_CPP_CACHE_TYPE_V=${LLAMA_CPP_CACHE_TYPE_V:-q4_0}
      # Max KV context-checkpoints per slot. Inherited by every
      # llama-server llama-swap spawns. Build default is 32; at 256k ctx
      # each checkpoint is ~150 MiB, so 32 wasted ~4.8 GB of churning,
      # low-yield cache. 2 keeps recent-prefix reuse, frees ~4 GB.
      - LLAMA_ARG_CTX_CHECKPOINTS=${LLAMA_ARG_CTX_CHECKPOINTS:-2}
      - LLAMA_SWAP_QWEN36_35B_MODEL_PATH=${LLAMA_SWAP_QWEN36_35B_MODEL_PATH:-/models/lmstudio-community/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-Q4_K_M.gguf}
      - LLAMA_SWAP_QWEN36_35B_CTX_SIZE=${LLAMA_SWAP_QWEN36_35B_CTX_SIZE:-262144}
      - LLAMA_SWAP_QWEN36_35B_N_GPU_LAYERS=${LLAMA_SWAP_QWEN36_35B_N_GPU_LAYERS:-99}
      - LLAMA_SWAP_QWEN36_35B_N_PARALLEL=${LLAMA_SWAP_QWEN36_35B_N_PARALLEL:-1}
      - LLAMA_SWAP_QWEN36_35B_BATCH=${LLAMA_SWAP_QWEN36_35B_BATCH:-1024}
      - LLAMA_SWAP_QWEN36_35B_UBATCH=${LLAMA_SWAP_QWEN36_35B_UBATCH:-512}
      - LLAMA_SWAP_QWEN36_35B_CACHE_TYPE_K=${LLAMA_SWAP_QWEN36_35B_CACHE_TYPE_K:-q4_0}
      - LLAMA_SWAP_QWEN36_35B_CACHE_TYPE_V=${LLAMA_SWAP_QWEN36_35B_CACHE_TYPE_V:-q4_0}
      - LLAMA_SWAP_QWEN36_35B_REASONING_BUDGET=${LLAMA_SWAP_QWEN36_35B_REASONING_BUDGET:-4096}
      - LLAMA_SWAP_QWEN36_27B_MODEL_PATH=${LLAMA_SWAP_QWEN36_27B_MODEL_PATH:-/models/lmstudio-community/Qwen3.6-27B-GGUF/Qwen3.6-27B-Q4_K_M.gguf}
      - LLAMA_SWAP_QWEN36_27B_CTX_SIZE=${LLAMA_SWAP_QWEN36_27B_CTX_SIZE:-262144}
      - LLAMA_SWAP_QWEN36_27B_N_GPU_LAYERS=${LLAMA_SWAP_QWEN36_27B_N_GPU_LAYERS:-99}
      # parallel=2 -> two concurrent 131072-token lanes (256k / 2).
      # Interactive chat no longer blocks behind a background mnemory
      # extraction or a long research synthesis. Same model id.
      - LLAMA_SWAP_QWEN36_27B_N_PARALLEL=${LLAMA_SWAP_QWEN36_27B_N_PARALLEL:-2}
      - LLAMA_SWAP_QWEN36_27B_BATCH=${LLAMA_SWAP_QWEN36_27B_BATCH:-1024}
      - LLAMA_SWAP_QWEN36_27B_UBATCH=${LLAMA_SWAP_QWEN36_27B_UBATCH:-512}
      - LLAMA_SWAP_QWEN36_27B_CACHE_TYPE_K=${LLAMA_SWAP_QWEN36_27B_CACHE_TYPE_K:-q4_0}
      - LLAMA_SWAP_QWEN36_27B_CACHE_TYPE_V=${LLAMA_SWAP_QWEN36_27B_CACHE_TYPE_V:-q4_0}
      - LLAMA_SWAP_QWEN36_27B_REASONING_BUDGET=${LLAMA_SWAP_QWEN36_27B_REASONING_BUDGET:-4096}
      # Speculative decoding for the 27B entry. `draft-mtp` (set in .env,
      # 2026-07-09) self-drafts via the MTP head in the ThinkingCap GGUF;
      # compose default stays `none` so a bare env is conservative and old
      # llama-server builds still parse the flag.
      - LLAMA_SWAP_QWEN36_27B_SPEC_TYPE=${LLAMA_SWAP_QWEN36_27B_SPEC_TYPE:-none}
      - LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_N_MAX=${LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_N_MAX:-2}
      # Draft (MTP) KV cache type. Build default f16 blew VRAM to 98.9% at
      # 256k ctx (crash line is ~95%); .env pins q4_0 to match the main KV.
      - LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_CACHE_TYPE_K=${LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_CACHE_TYPE_K:-f16}
      - LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_CACHE_TYPE_V=${LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_CACHE_TYPE_V:-f16}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_LLAMA_CPP_DEVICE_ID:-0}"]
              capabilities: [gpu]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Phase 1: basic liveness. Phase 2: slot watchdog — if any slot stays in
      # "processing" state for > 15 min (900 s), kill llama-server so Docker
      # restarts the container. Timestamp is stored in /tmp/.sb between checks.
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:8080/health || exit 1; SLOTS=$$(curl -sf --max-time 5 http://localhost:8080/slots 2>/dev/null); if echo \"$$SLOTS\" | grep -q '\"state\":[1-9]'; then [ -f /tmp/.sb ] || date +%s > /tmp/.sb; NOW=$$(date +%s); START=$$(cat /tmp/.sb 2>/dev/null || echo $$NOW); AGE=$$((NOW - START)); if [ $$AGE -gt 900 ]; then rm -f /tmp/.sb; pkill llama-server 2>/dev/null; exit 1; fi; else rm -f /tmp/.sb 2>/dev/null; fi"]
      interval: 60s
      timeout: 15s
      retries: 2
      start_period: 120s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  mnemory:
    build:
      context: ../mnemory
      dockerfile: Dockerfile
    container_name: mnemory
    networks:
      - llm-net
    # NO host ports: mnemory is reachable only inside llm-net (internal,
    # no gateway). Trusted local clients (Open WebUI) talk to it directly.
    # Cloud services must go through mnemory-gateway, which is the only
    # host-published door and enforces the privacy policy.
    environment:
      - LLM_API_KEY=ollama
      - LLM_BASE_URL=http://llama-cpp:8080/v1
      - LLM_MODEL=qwen36-27b:nothink
      - EMBED_BASE_URL=http://llama-cpp-embed:8080/v1
      - EMBED_MODEL=qllama/bge-m3:latest
      - EMBED_DIMS=1024
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_API_KEYS=${MCP_API_KEYS}
      - FIND_MEMORIES_QUERIES=3
      - LLM_CONTEXT_SIZE=${MNEMORY_LLM_CONTEXT_SIZE:-131072}
      - LABELS_INDEXES=origin,share,project
      - MGMT_PORT=8051
    volumes:
      - mnemory-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      llm-gateway:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8051/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Privacy-enforcing MCP proxy for CLOUD services (Claude Code, etc.).
  # Only host-published mnemory door. Holds the real mnemory key; cloud
  # clients use MNEMORY_GATEWAY_KEY and never see the mnemory key.
  mnemory-gateway:
    build:
      context: ./mnemory-gateway
      dockerfile: Dockerfile
    container_name: mnemory-gateway
    networks:
      - llm-net      # reach mnemory:8050 internally
      - default      # be reachable from the host (non-internal => publishable)
    ports:
      - "127.0.0.1:8060:8060"
    environment:
      - MNEMORY_URL=http://mnemory:8050
      - MNEMORY_KEY=${MCP_API_KEY}
      - GATEWAY_KEY=${MNEMORY_GATEWAY_KEY}
      - BOUND_USER_ID=${MNEMORY_CLOUD_USER:-yamaoka01@gmail.com}
      - SHARE_LABEL_VALUE=cloud
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      mnemory:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8060/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mnemory-backup:
    image: alpine:3.21
    container_name: mnemory-backup
    volumes:
      - mnemory-data:/data:ro
      - ./backups/mnemory:/backups
      - ./backup/mnemory-backup.sh:/scripts/backup.sh:ro
    environment:
      - BACKUP_DIR=/backups
      - DATA_DIR=/data
      - RETAIN_COUNT=${BACKUP_RETAIN_COUNT:-2}
      - HEALTH_TCP=mnemory-gateway:8060 # gateway listens on 8060; 8080 made the precheck skip (=zero artifacts) silently from 2026-05-29 to 07-05
      - BACKUP_CRON=${BACKUP_CRON:-0 2 * * *}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        chmod +x /scripts/backup.sh
        echo "$${BACKUP_CRON} /scripts/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "[$(date -u +%FT%TZ)] Backup scheduler started (cron: $${BACKUP_CRON}, retain: $${RETAIN_COUNT} most recent)"
        crond -f -l 2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      mnemory:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  openwebui-backup:
    image: alpine:3.21
    container_name: openwebui-backup
    volumes:
      - openwebui-data:/data:ro
      - ./backups/openwebui:/backups
      - ./backup/openwebui-backup.sh:/scripts/backup.sh:ro
    environment:
      - BACKUP_DIR=/backups
      - DATA_DIR=/data
      - RETAIN_COUNT=${OPENWEBUI_BACKUP_RETAIN_COUNT:-2}
      - HEALTH_TCP=openwebui:8080
      - BACKUP_CRON=${OPENWEBUI_BACKUP_CRON:-0 2 * * *}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "$${BACKUP_CRON} sh /scripts/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "[$(date -u +%FT%TZ)] Backup scheduler started (cron: $${BACKUP_CRON}, retain: $${RETAIN_COUNT} most recent)"
        crond -f -l 2
    # Cap memory so the nightly `tar` of the (large) /data volume cannot
    # balloon the WSL VM with reclaimable page cache. The kernel evicts this
    # cgroup's own file cache to stay under the limit, so the backup streams
    # through a small cache window instead of parking tens of GB until the
    # next `wsl --shutdown`. tar/gzip stream sequentially (no re-reads) so
    # capping costs nothing; anon RSS is a few MB, so no OOM risk.
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      openwebui:
        condition: service_healthy

    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  llama-cpp-embed-upstream:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-cpp-embed-upstream
    # Isolated behind the gateway (2026-06-13) — see llama-cpp-upstream.
    networks:
      - llm-backend-net
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./data/models/embeddings:/models:ro
    environment:
      # NVIDIA_VISIBLE_DEVICES selects host GPU exposed to this container.
      # CUDA_VISIBLE_DEVICES intentionally unset: NVIDIA Container Toolkit
      # reindexes visible GPUs starting at 0 inside the container, so setting
      # CUDA_VISIBLE_DEVICES to the *host* index makes CUDA see no devices.
      - NVIDIA_VISIBLE_DEVICES=${GPU_LLAMA_CPP_EMBED_DEVICE_ID:-1}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LLAMA_ARG_MODEL=/models/bge-m3-f16.gguf
      - LLAMA_ARG_CTX_SIZE=20480
      - LLAMA_ARG_N_GPU_LAYERS=99
      - LLAMA_ARG_N_PARALLEL=2
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_EMBEDDINGS=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_LLAMA_CPP_EMBED_DEVICE_ID:-1}"]
              capabilities: [gpu]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # =====================================================================
  # llm-queue — B2 front-ended inference ADMISSION CONTROLLER.
  # Sits BETWEEN LiteLLM (the caller-facing front door) and the *-upstream real
  # servers, on llm-backend-net only. It holds-and-dispatches requests instead of
  # letting llama-swap drop the overflow with a flat `429 Too many requests`:
  #   callers → llama-cpp:8080 → llm-gateway (LiteLLM) → llm-queue → *-upstream
  # LiteLLM stays the front door + ledger; the queue is the admission/scheduling
  # layer it forwards through (design B2, NOT B1). It is a SECOND member of the
  # backend plane, DOWNSTREAM of the gateway, so "LiteLLM is the front door" holds.
  # The mutating control API is NEVER exposed on llm-net or a host port (design
  # §10.3.1) — read-only state reaches llm-net via a LiteLLM pass-through (P2).
  # Tuning invariant (design §10.2): LLM_QUEUE_SLOTS == llama-swap --parallel (3),
  # LLM_QUEUE_MAX_IN_FLIGHT <= SLOTS+1, and llama-swap concurrencyLimit == 0 so
  # the ordered depth lives in OUR heap, not llama.cpp's opaque FIFO.
  # Docs: documentation/implementation-guide/LiteLLM-Proxy/DESIGN-B2-inference-queue.md
  # =====================================================================
  llm-queue:
    build:
      context: ./llm-queue
      dockerfile: Dockerfile
    image: llm-queue:local
    container_name: llm-queue
    # llm-backend-net ONLY: reachable by llm-gateway, reaches *-upstream. Keeping
    # it off llm-net is what keeps the mutating control API operator-only (§3.3).
    networks:
      - llm-backend-net
    environment:
      # Forward targets — the ONLY sanctioned *-upstream references outside the
      # gateway config. check-llm-gateway-routing.ps1 sanctions the
      # LLM_QUEUE_UPSTREAM token specifically (§3.2).
      - LLM_QUEUE_UPSTREAM_BASE_URL=http://llama-cpp-upstream:8080
      - LLM_QUEUE_EMBED_UPSTREAM_BASE_URL=http://llama-cpp-embed-upstream:8080
      # Admission sizing — MUST track LLAMA_SWAP_QWEN36_27B_N_PARALLEL (.env;
      # 2 since 2026-07-09). Values live in .env next to that var.
      - LLM_QUEUE_SLOTS=${LLM_QUEUE_SLOTS:-3}
      - LLM_QUEUE_MAX_IN_FLIGHT=${LLM_QUEUE_MAX_IN_FLIGHT:-4}
      - LLM_QUEUE_BACKSTOP_DEPTH=${LLM_QUEUE_BACKSTOP_DEPTH:-24}
      - LLM_QUEUE_MAX_TOTAL_CONNECTIONS=${LLM_QUEUE_MAX_TOTAL_CONNECTIONS:-128}
      # Rolling completion-T metric.
      - LLM_QUEUE_T_WINDOW=${LLM_QUEUE_T_WINDOW:-5}
      - LLM_QUEUE_T_INITIAL_S=${LLM_QUEUE_T_INITIAL_S:-30}
      # P2 (2026-06-14): budget enforcement ON. Admission gated by per-service
      # projected-wait budgets (§8b) on top of the depth backstop; priority
      # classes (§8c) order dispatch; per-key max-concurrency (§8d) caps batch
      # callers. Budgets are generous (owui-chat 30s … batch 600s) so normal load
      # passes; only genuine saturation rejects-with-estimate. Set to false to
      # revert to P1 depth-only admission.
      - LLM_QUEUE_ENFORCE_BUDGET=${LLM_QUEUE_ENFORCE_BUDGET:-true}
      - LLM_QUEUE_UPSTREAM_TIMEOUT_S=${LLM_QUEUE_UPSTREAM_TIMEOUT_S:-600}
      - LLM_QUEUE_LOG_LEVEL=${LLM_QUEUE_LOG_LEVEL:-INFO}
      # P3 analytics: admit/finish/reject events with estimate-vs-actual →
      # llm-queue's OWN SQLite store (NOT LiteLLM's schema-managed Postgres, §4.4).
      # The db is on llm-net (unreachable from llm-backend-net), so the queue keeps
      # its own store and the §5 join happens at query time.
      - LLM_QUEUE_EVENTS_DB_PATH=${LLM_QUEUE_EVENTS_DB_PATH:-/data/events.db}
    volumes:
      - llm-queue-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      llama-cpp-upstream:
        condition: service_healthy
    healthcheck:
      # Liveness only — NEVER probes the upstream (a probe would force a
      # llama-swap model load → swap thrash, design §4.2).
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # =====================================================================
  # LiteLLM gateway — transparent interposition (guide §1A). STANDUP FORM:
  # stands up ALONGSIDE the running llama-cpp / llama-cpp-embed with NO aliases
  # yet — nothing routes through it until the cut-in (flip) renames the real
  # servers to *-upstream and gives the gateway the llama-cpp / llama-cpp-embed
  # aliases. See documentation/implementation-guide/LiteLLM-Proxy/CUT-IN-READY.md.
  # PERMISSIVE (no master_key) — attribution by the key string each caller sends
  # (proven by the T0 spike, 2026-06-12). Forwards by model name to llama-cpp.
  # =====================================================================
  llm-gateway:
    # Digest-pinned — supply-chain hardening (guide §19/D9; CVE-2025-55182).
    # Bump deliberately: docker pull ghcr.io/berriai/litellm:main-stable;
    #   docker inspect ... --format '{{index .RepoDigests 0}}'; confirm the
    #   release is outside any known compromise window; paste sha256; recreate;
    #   re-run the model-list + spend-log verification.
    image: ghcr.io/berriai/litellm@sha256:c98c9395c56a35b7abacff8269d43ff99aabacb62bbf42a04cc1514fcb9bde4a
    container_name: llm-gateway
    networks:
      llm-net:
        aliases:
          - llama-cpp           # transparent flip: callers' http://llama-cpp:8080 land here
          - llama-cpp-embed     # transparent flip: callers' http://llama-cpp-embed:8080 land here
      # The gateway is the ONLY member of both planes: it faces callers on
      # llm-net (aliases above) and reaches the isolated real servers on
      # llm-backend-net (below). This is what makes it the sole ingress to
      # *-upstream — callers on llm-net cannot reach the upstreams directly.
      llm-backend-net: {}
    # NO host port: the gateway sits ONLY on the internal-only `llm-net`, so
    # Docker silently suppresses any host publish (a `ports:` mapping here would
    # show in `docker inspect .HostConfig.PortBindings` but NEVER bind — verified:
    # NetworkSettings.Ports is empty and 127.0.0.1:4000 is unreachable). Keeping
    # the gateway off any internet-capable bridge is the supply-chain posture
    # (guide §19 — no outbound). Admin / spend-ledger access is IN-NETWORK only:
    #   docker exec llm-gateway python -c "...urllib... http://localhost:8080/..."
    #   docker exec llm-gateway-db psql -U litellm -d litellm -c '...'
    # The llm-traffic OWUI module reaches it the same way (OWUI is on llm-net).
    volumes:
      - ./config/litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "8080"]
    environment:
      # DATABASE_URL expands ${LITELLM_DB_PASSWORD} from .env at compose-parse time.
      - DATABASE_URL=postgres://litellm:${LITELLM_DB_PASSWORD}@llm-gateway-db:5432/litellm
      - LITELLM_LOCAL_MODEL_COST_MAP=True   # bundled cost map; no GitHub fetch at boot (guide §19/D10)
    depends_on:
      llama-cpp-upstream:
        condition: service_healthy
      llama-cpp-embed-upstream:
        condition: service_healthy
      # B2: LiteLLM forwards chat through llm-queue (api_base), so the queue must
      # be up first. The embed plane still goes direct to *-upstream until P4.
      llm-queue:
        condition: service_healthy
      llm-gateway-db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The litellm image is wolfi-based and has NO curl (T0 finding) — use python.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health/liveliness').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # first boot runs prisma migrations (~60-90s, T0 finding)
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  llm-gateway-db:
    image: postgres:16-alpine
    container_name: llm-gateway-db
    networks:
      - llm-net
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD}
    volumes:
      - llm-gateway-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  llm-gateway-backup:
    image: postgres:16-alpine
    container_name: llm-gateway-backup
    depends_on:
      llm-gateway-db:
        condition: service_healthy
    networks:
      - llm-net
    environment:
      - BACKUP_DIR=/backups
      - PGHOST=llm-gateway-db
      - PGUSER=litellm
      - PGDATABASE=litellm
      - PGPASSWORD=${LITELLM_DB_PASSWORD}
      - RETAIN_DAYS=${LITELLM_BACKUP_RETAIN_DAYS:-7}
    volumes:
      - ./backups/llm-gateway:/backups
      - ./backup/llm-gateway-backup.sh:/scripts/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /scripts/backup.sh || true; sleep 86400; done"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # =====================================================================
  # llm-gateway-ui — LiteLLM ADMIN-UI sidecar (analytics dashboard). Added
  # 2026-06-14. A SECOND LiteLLM instance whose ONLY job is to serve the Admin
  # UI at /ui. LiteLLM 1.88.1 REQUIRES a master_key for the UI to log in; setting
  # one on the permissive main gateway would 401 every junk-key caller. So the
  # master_key is ISOLATED here. This instance:
  #   - serves NO inference — it deliberately carries NO llama-cpp /
  #     llama-cpp-embed network alias (those stay on llm-gateway), and no caller
  #     points at it. The gateway-only routing policy is unaffected.
  #   - shares llm-gateway-db (same DATABASE_URL) so the dashboard reads the SAME
  #     spend ledger the main gateway writes.
  #   - is reached ONLY via the tailnet :8445 serve route (entrypoint.sh) — no
  #     host port, internal-only net, same supply-chain posture as llm-gateway.
  # Remove = delete this service + config/litellm.ui.config.yaml + the :8445
  # serve block in entrypoint.sh + the .env LITELLM_UI_* vars.
  # =====================================================================
  llm-gateway-ui:
    # Same digest-pinned image as llm-gateway (keep them in lockstep on bumps so
    # the shared Postgres schema/prisma migrations never diverge).
    image: ghcr.io/berriai/litellm@sha256:c98c9395c56a35b7abacff8269d43ff99aabacb62bbf42a04cc1514fcb9bde4a
    container_name: llm-gateway-ui
    # llm-net ONLY (reaches llm-gateway-db). NO aliases — must never be an
    # inference path. NOT on llm-backend-net (can't reach the upstreams).
    networks:
      - llm-net
    volumes:
      - ./config/litellm.ui.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "8080"]
    environment:
      - DATABASE_URL=postgres://litellm:${LITELLM_DB_PASSWORD}@llm-gateway-db:5432/litellm
      - LITELLM_LOCAL_MODEL_COST_MAP=True   # bundled cost map; no GitHub fetch (guide §19/D10)
      # master_key UNLOCKS the Admin UI (and is enforced on THIS instance's API
      # only — which has no callers). UI_USERNAME/PASSWORD set the dashboard login.
      - LITELLM_MASTER_KEY=${LITELLM_UI_MASTER_KEY}
      - UI_USERNAME=${LITELLM_UI_USERNAME}
      - UI_PASSWORD=${LITELLM_UI_PASSWORD}
    depends_on:
      llm-gateway-db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # wolfi-based image has no curl (T0 finding) — use python.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health/liveliness').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  smolcrawl-pipelines:
    build:
      context: ./smolcrawl
      dockerfile: Dockerfile
    container_name: smolcrawl-pipelines
    ports:
      - "127.0.0.1:9099:9099"
    volumes:
      - smolcrawl-data:/app/pipelines
    environment:
      - PIPELINES_DIR=/app/pipelines
      - PIPELINES_API_KEY=${SMOLCRAWL_API_KEY:-0p3n-w3bu!}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      openwebui:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:9099/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  surrealdb:
    image: surrealdb/surrealdb:v2
    container_name: surrealdb
    # Credentials live in .env (pre-flight §6.3). Keeping root/root by user
    # decision; localhost-only bind below + auth-net Docker isolation are the
    # real defenses against external access.
    command: start --log info --user ${SURREAL_USER} --pass ${SURREAL_PASSWORD} rocksdb:/mydata/mydatabase.db
    user: root  # Required for bind mounts on Linux
    ports:
      - "127.0.0.1:8003:8000"   # pre-flight §6.2 — was "8003:8000" (LAN-exposed)
    volumes:
      - D:\Open WebUI\open-notebook\surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: always
    pull_policy: always

  open_notebook:
    # IKS fork (open-notebook repo, Dockerfile.single) — OB1 Postgres is the
    # canonical source-of-truth. Locally built + tagged; never pulled.
    # Build/tag at promotion: docker build -t open_notebook:iks ...; see
    # documentation/implementation-guide/open -notebook-integration-openbrain/.
    image: open_notebook:iks
    container_name: open_notebook
    networks:
      - default
      - llm-net
      - app-net               # pre-flight §7.4 — added so portal Caddy can reach :8502 / :5055
      - obnet                  # IKS — reach openbrain-db (canonical OB1 store)
    ports:
      - "127.0.0.1:8503:8502" # pre-flight §6.1 — was "8503:8502" (LAN-exposed)
      - "127.0.0.1:5055:5055" # pre-flight §6.1 — was "5055:5055" (LAN-exposed)
    environment:
      # Encryption key moved to .env (pre-flight §6.4). Same value preserved
      # so existing encrypted-at-rest API keys remain decryptable.
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY}

      # Database connection
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER}
      - SURREAL_PASSWORD=${SURREAL_PASSWORD}
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook

      # DO NOT set API_URL here. The Next.js runtime-config auto-detect
      # logic (frontend/src/app/config/route.ts) constructs
      # {proto}://{hostname}:5055 from incoming Host/X-Forwarded-Proto
      # headers -- this is exactly what the tailscale-serve dual-port
      # pattern in entrypoint.sh expects (UI on :8443, API on :5055).
      # Setting API_URL forces ONE static URL for everyone and breaks
      # tailnet access.
      #
      # For the public path (https://notebook.devinveller.ai), Caddy
      # intercepts /config and returns the correct apiUrl directly --
      # see Caddyfile. The browser uses same-origin /api/* and Caddy
      # routes those to FastAPI.
      - INTERNAL_API_URL=http://127.0.0.1:5055

      # ----- IKS: OpenBrain (OB1) is the canonical source-of-truth ---------
      # SurrealDB above stays as the local UI/queue/chat/cache store (D1, a
      # thin regenerable mirror). Sources/threads live in openbrain-db.
      # The OB1 password is NOT set here: it is injected as POSTGRES_PASSWORD
      # via the `env_file: OB1/docker/.env` directive below (read automatically
      # by `docker compose up` — no --env-file flag, no secret duplicated into
      # ai-stack/.env). ob1_repository._cfg() falls back OB1_DB_PASSWORD →
      # POSTGRES_PASSWORD, so the env_file value is what's used.
      - OB1_DB_HOST=openbrain-db
      - OB1_DB_PORT=5432
      - OB1_DB_NAME=openbrain
      - OB1_DB_USER=postgres
      # bge-m3 (1024-dim) so OB1 source embeddings match every other writer.
      - EMBEDDING_API_BASE=http://llama-cpp-embed:8080/v1
      - EMBEDDING_API_KEY=not-needed
      - EMBEDDING_MODEL=bge-m3
      # Wiki notebooks/ folder = the notebook registry (B1 folder sync), RO.
      - WIKI_NOTEBOOKS_DIR=/wiki/content/notebooks
      - NOTEBOOK_SYNC_INTERVAL_S=900
    # Supplies POSTGRES_PASSWORD (the OB1 store secret) into the container
    # without writing it into ai-stack/.env. Other keys in this file are
    # harmless to ON (ignored). Same secret the OB1 stack already uses.
    env_file:
      - OB1/docker/.env
    volumes:
      - D:\Open WebUI\open-notebook\notebook_data:/app/data
      # Read-only view of the live wiki tree so ON reconciles the notebooks
      # folder → ON notebooks (folder is authority). External open-brain volume.
      - openbrain-wiki-data:/wiki:ro
    depends_on:
      - surrealdb
    restart: always
    pull_policy: never

  # ---------------------------------------------------------------------
  # Private Search Gateway (privacy-first web search over Tor).
  # See documentation/web-search/integration-plan-private-search-gateway.md
  #
  # Privacy invariant enforced at the network layer: redis/searxng/gateway/
  # mcpo sit on `search-net` (internal: true — no internet). `tor` is the
  # ONLY service bridging to `default`, so SearXNG physically cannot egress
  # except through Tor. `gateway` also joins `default` purely so openwebui
  # (on `default`) can resolve http://gateway:8080.
  # ---------------------------------------------------------------------
  tor:
    image: ${TOR_IMAGE:-osminogin/tor-simple:latest}
    container_name: search-tor
    networks:
      - search-net
      - default
    volumes:
      - ./search-gateway/tor/torrc:/etc/tor/torrc:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # ---------------------------------------------------------------------
  # vpn (Mullvad WireGuard via gluetun) — SearXNG's engine-query egress
  # (2026-06-14). Replaces Tor for the SEARCH leg ONLY: search engines
  # blocklist Tor exit IPs by reputation (brave/ddg/startpage/mojeek all
  # 403/429/CAPTCHA on sight), which neutralises SearXNG's multi-engine
  # aggregation. Mullvad gives a clean, non-Tor exit IP so aggregation works
  # again. Page FETCH still egresses via `tor` (openbrain-research et al.'s
  # FETCH_PROXY_URL) — arbitrary pages aren't engine-blocked, and Tor keeps
  # "what you actually read" private.
  #
  # Privacy invariant preserved: like `tor`, `vpn` is the ONLY search-net
  # member that ALSO joins `default`, so SearXNG stays internal-only and can
  # egress solely through this HTTP proxy. gluetun's firewall is a KILL-SWITCH
  # — if the WireGuard tunnel drops, all egress is blocked (no clear-IP leak).
  # Secrets (MULLVAD_WG_*) live in .env and are NEVER committed.
  # ---------------------------------------------------------------------
  vpn:
    image: ${VPN_IMAGE:-qmcgaw/gluetun:latest}
    container_name: search-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - search-net
      - default
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${MULLVAD_WG_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${MULLVAD_WG_ADDRESSES}
      - SERVER_COUNTRIES=${MULLVAD_COUNTRIES:-Netherlands}
      # HTTP forward-proxy for SearXNG. HTTPS targets use CONNECT, so DNS is
      # resolved at gluetun THROUGH the tunnel (no local DNS leak, matching the
      # old socks5h behaviour).
      - HTTPPROXY=on
      - HTTPPROXY_LISTENING_ADDRESS=:8888
      # Allow the LAN-side (docker search-net) to reach the proxy through the
      # kill-switch firewall. 172.16/12 covers Docker's default subnet pool.
      - FIREWALL_OUTBOUND_SUBNETS=${SEARCH_NET_SUBNET:-172.16.0.0/12}
      # DNS: leave gluetun's default DNS-over-TLS ON — engine hostnames resolve
      # via DoT through the tunnel (no DNS leak). NOTE: WIREGUARD_ADDRESSES must
      # be IPv4-only unless the Docker host has IPv6 (gluetun rejects v6 addrs).
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  redis:
    image: ${SEARCH_REDIS_IMAGE:-redis:7-alpine}
    container_name: search-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - search-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    container_name: searxng
    networks:
      - search-net
    depends_on:
      vpn:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET_KEY}
      - SEARXNG_REDIS_URL=redis://redis:6379/0
    volumes:
      - ./search-gateway/searxng:/etc/searxng:rw
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # WireGuard tunnel build can be slow on first start
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  gateway:
    build:
      context: ./search-gateway/gateway
      dockerfile: Dockerfile
    image: private-search-gateway:local
    container_name: search-gateway
    networks:
      - search-net
      - default
    depends_on:
      searxng:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SEARXNG_URL=http://searxng:8080
      - REDIS_URL=redis://redis:6379/1
    ports:
      - "127.0.0.1:8085:8080"   # native REST / Tavily shim for host tools
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  mcpo:
    build:
      context: ./search-gateway/gateway
      dockerfile: Dockerfile
    image: private-search-gateway:local   # same tag as gateway; built once, cached
    container_name: search-mcpo
    networks:
      - search-net
    depends_on:
      gateway:
        condition: service_started
    env_file:
      - .env
    environment:
      - SEARXNG_URL=http://searxng:8080
      - REDIS_URL=redis://redis:6379/1
    command: ["mcpo", "--port", "8001", "--", "python", "-m", "gateway.mcp_server"]
    ports:
      - "127.0.0.1:8001:8001"   # MCP-as-OpenAPI for REST/MCP clients
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8001/openapi.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # =====================================================================
  # little-coder — self-improving coding agent (Chapter 1: Tool).
  # Docs: documentation/little-coder/. Control plane (decides) +
  # the open-terminal workspace plane (executes) reconfigured above.
  # =====================================================================
  little-coder:
    build:
      context: ./little-coder
      dockerfile: docker/Dockerfile.agent
      args:
        LITTLE_CODER_VERSION: ${LITTLE_CODER_VERSION:-latest}
    image: little-coder:local
    container_name: little-coder
    networks:
      - lc-net      # control plane ↔ open-terminal ↔ lc-mcpo
      - llm-net     # llama-cpp inference
    env_file:
      - .env
    environment:
      - LC_CONFIG=/app/config/little-coder.config.yaml
      - LC_LLAMA_API_KEY=${LC_LLAMA_API_KEY:-llama}
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
      - LC_DEPLOY_TOKEN=${LC_DEPLOY_TOKEN:-}
      # Route the agent's shell into open-terminal (design §3.4). Verified
      # working; default on. Set 0 to fall back to built-in bash (runs in the
      # network-isolated little-coder container). See pi-extension/README.md.
      - LC_ROUTE_EXEC=${LC_ROUTE_EXEC:-1}
      # open-terminal exec params, exposed statically so a direct interactive
      # `little-coder` run (docker exec) has working exec routing — not only
      # the daemon-spawned agent (the daemon also sets these per task).
      - LC_OPEN_TERMINAL_URL=http://open-terminal:8000
      - LC_OPEN_TERMINAL_KEY=${OPEN_TERMINAL_API_KEY}
      - LC_WORKSPACE=/workspace
      # 1.9.x llama-cpp-provider probes the server's /props at startup to detect
      # the live context window. Our base_url is the LiteLLM gateway, which does
      # not forward llama.cpp's /props — the probe just fails (silently) on every
      # task and falls back to models.json's declared window (131072), which is
      # what we want anyway. Skip the futile probe + its log noise.
      - LITTLE_CODER_NO_CTX_PROBE=1
    volumes:
      - ./little-coder/config:/app/config:ro
      - little-coder-journals:/var/lib/little-coder/journals
      - little-coder-skill:/var/lib/little-coder/skill
      - little-coder-cohorts:/var/lib/little-coder/cohorts
      - little-coder-polyglot:/var/lib/little-coder/polyglot
      - little-coder-sessions:/var/lib/little-coder/sessions
      - little-coder-workspace:/workspace
    ports:
      - "127.0.0.1:9091:9090"   # Prometheus metrics (loopback only)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      llm-gateway:
        condition: service_healthy
      open-terminal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # MCP→OpenAPI edge. Built in Tool, DORMANT until chapter 2 registers it as
  # an OWUI tool (design §3.1). API-key'd; carries task triggers only —
  # operator commands authenticate elsewhere (design §12.6).
  lc-mcpo:
    build:
      context: ./little-coder
      dockerfile: docker/Dockerfile.agent
      args:
        LITTLE_CODER_VERSION: ${LITTLE_CODER_VERSION:-latest}
    image: little-coder:local
    container_name: lc-mcpo
    networks:
      - lc-net    # control plane (reaches the little-coder daemon)
      - llm-net   # OWUI reaches lc-mcpo here to register it as an OpenAPI tool
    env_file:
      - .env
    environment:
      - LC_DAEMON_URL=http://little-coder:8090
    command: ["mcpo", "--host", "0.0.0.0", "--port", "8002", "--api-key", "${LC_MCPO_API_KEY}", "--", "python", "-m", "littlecoder.mcp_server"]
    ports:
      - "127.0.0.1:8002:8002"   # MCP-as-OpenAPI (loopback only)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      little-coder:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8002/openapi.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # Egress allowlist for open-terminal — only the operator-configured git
  # host is reachable; everything else is denied (design §3.4).
  lc-egress:
    build:
      context: ./little-coder
      dockerfile: docker/Dockerfile.egress
    image: little-coder-egress:local
    container_name: lc-egress
    networks:
      - lc-net      # reachable by open-terminal
      - default     # the only little-coder-side service with internet
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # Nightly backup of the four little-coder expertise volumes (design §3.6).
  # The workspace volume is project-scoped and re-clonable — not backed up.
  little-coder-backup:
    image: alpine:3.21
    container_name: little-coder-backup
    volumes:
      - little-coder-journals:/data/journals:ro
      - little-coder-skill:/data/skill:ro
      - little-coder-cohorts:/data/cohorts:ro
      - little-coder-polyglot:/data/polyglot:ro
      - little-coder-sessions:/data/sessions:ro
      - ./backups/little-coder:/backups
      - ./backup/little-coder-backup.sh:/scripts/backup.sh:ro
    environment:
      - BACKUP_DIR=/backups
      - DATA_DIR=/data
      - RETAIN_COUNT=${LC_BACKUP_RETAIN_COUNT:-2}
      - BACKUP_CRON=${LC_BACKUP_CRON:-0 2 * * *}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        chmod +x /scripts/backup.sh
        echo "$${BACKUP_CRON} /scripts/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "[$(date -u +%FT%TZ)] little-coder backup scheduler started (cron: $${BACKUP_CRON}, retain: $${RETAIN_COUNT} most recent)"
        crond -f -l 2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # =====================================================================
  # Unified snapshot backups (post-2026-05-29 plan).
  # Six new containers covering the gaps from the post-implementation
  # audit: OB1 PostgreSQL + wiki, Open Notebook (SurrealDB + notebook_data),
  # smolcrawl pipelines, Tailscale state, LM Studio models. All write
  # under ./backups/<service>/ with .sha256 sentinels and configurable
  # retention. The existing weekly NAS sync (scripts/backup-to-nas.ps1)
  # picks them up automatically.
  # =====================================================================

  # openbrain-db-backup -- pg_dump nightly of the openbrain PostgreSQL DB.
  # Joins the open-brain compose project's obnet to reach openbrain-db:5432
  # over TCP. Requires the OB1 stack to be UP.
  openbrain-db-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile.postgres
    image: openbrain-db-backup:local
    container_name: openbrain-db-backup
    env_file:
      # OB1's .env carries POSTGRES_PASSWORD; user + db are hardcoded in
      # OB1's compose (postgres / openbrain) so we mirror them as static
      # environment vars below. Rotating the password in OB1's .env
      # propagates here automatically.
      - ./OB1/docker/.env
    environment:
      - PGHOST=openbrain-db
      - PGPORT=5432
      - POSTGRES_USER=postgres        # matches OB1 docker-compose.yml line 24
      - POSTGRES_DB=openbrain          # matches OB1 docker-compose.yml line 23
      - BACKUP_DIR=/backups
      - RETAIN_COUNT=${OPENBRAIN_DB_BACKUP_RETAIN_COUNT:-2}
      - BACKUP_CRON=${OPENBRAIN_DB_BACKUP_CRON:-0 2 * * *}
      - TZ=UTC
    volumes:
      - ./backups/openbrain-db:/backups
      - ./backup/openbrain-db-backup.sh:/scripts/backup.sh:ro
    networks:
      - obnet           # external -- reaches openbrain-db
    user: "10008:10008"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 50
    command:
      - sh
      - -c
      - |
        # Render supercronic crontab from $BACKUP_CRON. supercronic
        # inherits env naturally so no profile.d shim needed.
        printf '%s sh /scripts/backup.sh\n' "$$BACKUP_CRON" > /tmp/crontab.rendered
        echo "[$$(date -u +%FT%TZ)] openbrain-db-backup scheduler started (cron: $$BACKUP_CRON, retain: $${RETAIN_COUNT} most recent)"
        exec /usr/local/bin/supercronic /tmp/crontab.rendered
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # openbrain-wiki-backup -- tar of the openbrain-wiki-data volume.
  # Source files are root-owned (openbrain-wiki runs as root), so the
  # backup container runs as root too -- the pre-portal pattern. Other
  # hardening (cap_drop ALL, no-new-privileges) still applies.
  openbrain-wiki-backup:
    image: alpine:3.21
    container_name: openbrain-wiki-backup
    volumes:
      - openbrain-wiki-data:/data:ro
      - wiki-assets:/assets:ro          # X.2 — gitignored binary uploads (separate tar)
      - ./backups/openbrain-wiki:/backups
      - ./backup/openbrain-wiki-backup.sh:/scripts/backup.sh:ro
    environment:
      - BACKUP_DIR=/backups
      - DATA_DIR=/data
      - ASSETS_DIR=/assets
      - RETAIN_COUNT=${OPENBRAIN_WIKI_BACKUP_RETAIN_COUNT:-2}
      - BACKUP_CRON=${OPENBRAIN_WIKI_BACKUP_CRON:-15 2 * * *}
      - TZ=UTC
    entrypoint: /bin/sh
    command:
      - -c
      - |
        chmod +x /scripts/backup.sh
        echo "$${BACKUP_CRON} /scripts/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "[$(date -u +%FT%TZ)] openbrain-wiki-backup scheduler started (cron: $${BACKUP_CRON}, retain: $${RETAIN_COUNT} most recent)"
        crond -f -l 2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # open-notebook-backup -- two-phase:
  #   (1) SurrealDB logical export via the `surreal` CLI over the WebSocket
  #       RPC endpoint. NEVER tar /mydata directly -- RocksDB corrupts.
  #   (2) tarball of the host bind mount D:\Open WebUI\open-notebook\notebook_data
  #       (application-layer files; small).
  # Hot-safe: no surrealdb container stop needed.
  open-notebook-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile.surreal
    image: open-notebook-backup:local
    container_name: open-notebook-backup
    networks:
      - default     # surrealdb is on default; we reach it via DNS name 'surrealdb'
    environment:
      # SurrealDB v2 accepts a built-in root/root login regardless of the
      # --user/--pass passed to surreal start. We use it here so the backup
      # is independent of any operator-defined runtime credential rotation
      # in open_notebook's SURREAL_USER/SURREAL_PASSWORD. The "real" auth
      # boundary is the network isolation (surrealdb is only on the default
      # bridge with localhost-only host port).
      - SURREAL_URL=http://surrealdb:8000
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NS=open_notebook
      - SURREAL_DB=open_notebook
      - NOTEBOOK_DATA_DIR=/notebook-data
      - BACKUP_DIR=/backups
      - RETAIN_COUNT=${OPEN_NOTEBOOK_BACKUP_RETAIN_COUNT:-2}
      - BACKUP_CRON=${OPEN_NOTEBOOK_BACKUP_CRON:-20 2 * * *}
      - TZ=UTC
    volumes:
      - D:\Open WebUI\open-notebook\notebook_data:/notebook-data:ro
      - ./backups/open-notebook:/backups
      - ./backup/open-notebook-backup.sh:/scripts/backup.sh:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=256m       # large enough for the surreal export staging file
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 50
    command:
      - sh
      - -c
      - |
        printf '%s sh /scripts/backup.sh\n' "$$BACKUP_CRON" > /tmp/crontab.rendered
        echo "[$$(date -u +%FT%TZ)] open-notebook-backup scheduler started (cron: $$BACKUP_CRON, retain: $${RETAIN_COUNT} most recent)"
        exec /usr/local/bin/supercronic /tmp/crontab.rendered
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # smolcrawl-backup -- tar of smolcrawl-data named volume (deep_research
  # pipelines + crawl outputs). Hot-safe: pipelines are JSON definitions,
  # outputs are append-only files. Uses the generic-tar-backup.sh script.
  smolcrawl-backup:
    image: alpine:3.21
    container_name: smolcrawl-backup
    volumes:
      - smolcrawl-data:/data:ro
      - ./backups/smolcrawl:/backups
      - ./backup/generic-tar-backup.sh:/scripts/backup.sh:ro
    environment:
      - DATA_DIR=/data
      - BACKUP_DIR=/backups
      - PREFIX=smolcrawl
      - RETAIN_COUNT=${SMOLCRAWL_BACKUP_RETAIN_COUNT:-2}
      - HEALTH_TCP=${SMOLCRAWL_BACKUP_HEALTH_TCP:-smolcrawl-pipelines:9099}
      - BACKUP_CRON=${SMOLCRAWL_BACKUP_CRON:-25 2 * * *}
      - TZ=UTC
    entrypoint: /bin/sh
    command:
      - -c
      - |
        chmod +x /scripts/backup.sh
        echo "$${BACKUP_CRON} sh /scripts/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "[$(date -u +%FT%TZ)] smolcrawl-backup scheduler started (cron: $${BACKUP_CRON}, retain: $${RETAIN_COUNT} most recent)"
        crond -f -l 2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # tailscale-backup -- tar of the Tailscale state directory bind mount.
  # Small (~100 KB): device identity, derpmap cache, log files. Restore
  # avoids re-authenticating the device to your tailnet.
  tailscale-backup:
    image: alpine:3.21
    container_name: tailscale-backup
    volumes:
      - ./data/tailscale:/data:ro
      - ./backups/tailscale:/backups
      - ./backup/generic-tar-backup.sh:/scripts/backup.sh:ro
    environment:
      - DATA_DIR=/data
      - BACKUP_DIR=/backups
      - PREFIX=tailscale
      - RETAIN_COUNT=${TAILSCALE_BACKUP_RETAIN_COUNT:-2}
      # tailscale-backup has no network attachment (the bind mount is the
      # only source). HEALTH_TCP intentionally empty -- dir-nonempty is the
      # only precheck. Set HEALTH_TCP=tailscale:41641 etc if you wire it
      # onto a shared network later.
      - HEALTH_TCP=
      - BACKUP_CRON=${TAILSCALE_BACKUP_CRON:-25 2 * * *}
      - TZ=UTC
    entrypoint: /bin/sh
    command:
      - -c
      - |
        chmod +x /scripts/backup.sh
        echo "$${BACKUP_CRON} sh /scripts/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "[$(date -u +%FT%TZ)] tailscale-backup scheduler started (cron: $${BACKUP_CRON}, retain: $${RETAIN_COUNT} most recent)"
        crond -f -l 2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # lm-models-backup -- tar of the LM Studio models directory.
  # CAVEAT: this directory can be 50+ GB. The two-slot NAS mirror means
  # ~100+ GB on the NAS. WEEKLY (Sundays 01:00 UTC) by default to limit
  # disk churn; set LM_MODELS_BACKUP_CRON= (empty) in .env to disable
  # if NAS storage becomes tight. Models are re-downloadable from
  # HuggingFace if you choose to skip backup.
  lm-models-backup:
    image: alpine:3.21
    container_name: lm-models-backup
    # On llm-backend-net so its HEALTH_TCP liveness probe can reach the real
    # inference server (llama-cpp-upstream:8080). Probe-only member with no
    # inference client (cap_drop ALL) — it does NOT bypass the gateway. (Before
    # isolation it sat on `default` and the cross-network probe never resolved.)
    networks:
      - llm-backend-net
    volumes:
      - C:\Users\yamao\.lmstudio\models:/data:ro
      - ./backups/lm-models:/backups
      - ./backup/generic-tar-backup.sh:/scripts/backup.sh:ro
    environment:
      - DATA_DIR=/data
      - BACKUP_DIR=/backups
      - PREFIX=lm-models
      - RETAIN_COUNT=${LM_MODELS_BACKUP_RETAIN_COUNT:-2}
      # llama-cpp-upstream serves models from this directory; backup runs when
      # that REAL inference server is reachable. Probe the upstream by name, NOT
      # the bare `llama-cpp` alias (which now resolves to llm-gateway and would
      # report "reachable" even while the model server is down/paused). Empty
      # HEALTH_TCP disables the probe (e.g., if you keep the upstream paused).
      - HEALTH_TCP=${LM_MODELS_BACKUP_HEALTH_TCP:-llama-cpp-upstream:8080}
      - BACKUP_CRON=${LM_MODELS_BACKUP_CRON:-0 1 * * 0}     # Sunday 01:00 UTC
      - TZ=UTC
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -z "$${BACKUP_CRON}" ]; then
          echo "[$(date -u +%FT%TZ)] lm-models-backup DISABLED (LM_MODELS_BACKUP_CRON is empty). Container will exit."
          exit 0
        fi
        chmod +x /scripts/backup.sh
        echo "$${BACKUP_CRON} sh /scripts/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "[$(date -u +%FT%TZ)] lm-models-backup scheduler started (cron: $${BACKUP_CRON}, retain: $${RETAIN_COUNT} most recent)"
        crond -f -l 2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # =====================================================================
  # Internet-exposed front-end (PORTAL).
  # Every service below tagged `profiles: [internet]` — does NOT start
  # with a plain `docker compose up -d`. Lifecycle is driven by
  # `scripts/portal-on.ps1` / `portal-off.ps1` (plan §12.9).
  #
  # Plan: documentation/implementation-guide/open-source authentication
  # front ends for ai stack/plan-internet-exposed-front-end.md (§8 Step 1).
  # =====================================================================

  # ---------------------------------------------------------------------
  # portal-init — one-shot volume permission setter.
  # Docker creates named volumes owned by root:root by default; our
  # hardened services run as non-root UIDs and cannot write to them.
  # This init container runs as root, chowns each volume to its owning
  # UID, then exits. Other services depend on its successful completion
  # via `depends_on: portal-init: service_completed_successfully`.
  # No persistent processes; no host port; no network attachment beyond
  # what's needed to mount volumes.
  # ---------------------------------------------------------------------
  portal-init:
    image: alpine:3.21
    container_name: portal-init
    profiles: [internet, local-test]
    user: "0:0"   # root — required to chown volumes
    volumes:
      - authelia-data:/vols/authelia
      - caddy-data:/vols/caddy
      - caddy-config:/vols/caddy-config
      - tripwire-data:/vols/tripwire
    # No networks — this container doesn't need any network access
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # only capability needed
      - FOWNER
      - DAC_OVERRIDE   # let root write where it needs even with bind-mount quirks
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        echo "[portal-init] chowning portal volumes..."
        # Authelia (UID 10001) — writes /data/db.sqlite3 + /data/authelia.log + /data/notification.txt
        # mode 0755 so portal-alerter (UID 10006) can READ authelia.log for the digest function.
        chown -R 10001:10001 /vols/authelia
        chmod 0755 /vols/authelia
        touch /vols/authelia/authelia.log
        chown 10001:10001 /vols/authelia/authelia.log
        chmod 0644 /vols/authelia/authelia.log
        # Caddy (UID 10000) — writes /data (access logs + ACME state if used) + /config (runtime config).
        # mode 0755 so portal-alerter can READ caddy-access.log for the digest function.
        chown -R 10000:10000 /vols/caddy /vols/caddy-config
        chmod 0755 /vols/caddy /vols/caddy-config
        touch /vols/caddy/caddy-access.log
        chown 10000:10000 /vols/caddy/caddy-access.log
        chmod 0644 /vols/caddy/caddy-access.log
        # Integrity-tripwire (UID 10003) — writes /state/baseline.sha256
        chown -R 10003:10003 /vols/tripwire
        chmod 0700 /vols/tripwire
        echo "[portal-init] done. UIDs: authelia=10001 caddy=10000 tripwire=10003"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  portal-alerter:
    # Digest-pinned (plan §12.1, audit 2026-05-29 §F.3). Bump by:
    #   1. docker pull denoland/deno:alpine
    #   2. docker inspect denoland/deno:alpine --format '{{index .RepoDigests 0}}'
    #   3. paste the new sha256 below
    #   4. recreate portal-alerter and run alerter.ts --selftest before relying on it
    image: denoland/deno@sha256:a40c899f6aca244a3f0a116c05f6dec0a29f9898d2f004d60ec57c1514f87349
    container_name: portal-alerter
    profiles: [internet, local-test]
    networks:
      - auth-net          # internal: true — watcher + tripwire POST /alert here
      - notify-net        # outbound to oauth2.googleapis.com + gmail.googleapis.com
    working_dir: /app
    volumes:
      # NOT :ro — Docker can't create the /app/token.json mount target
      # inside a read-only parent (OB1's openbrain-digest uses the same pattern).
      - ./config/alerter:/app
      - ./secrets/google/portal-alerter/credentials.json:/app/credentials.json:ro
      - ./secrets/google/portal-alerter/token.json:/app/token.json
      - authelia-data:/logs/authelia:ro
      - caddy-data:/logs/caddy:ro
      # Daily digest markdown reports. Persists to host so the operator
      # can browse via documentation/portal-digest/ (see also
      # portal-status.ps1's "Most recent digest" probe).
      - ./reports/portal-digest:/reports
    environment:
      - DIGEST_TO=${DIGEST_TO}
      - DIGEST_FROM=${DIGEST_FROM}
      - DIGEST_WINDOW_HOURS=${DIGEST_WINDOW_HOURS:-24}
      - ALERT_RATE_LIMIT_PER_MIN=${ALERT_RATE_LIMIT_PER_MIN:-20}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
      - TZ=UTC
    user: "10006:10006"      # plan §2 hardening floor — non-root UID
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true          # plan §2 hardening floor — read-only root FS
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 192M
          pids: 100
    entrypoint: ["deno", "run", "--allow-net", "--allow-read", "--allow-write", "--allow-env", "alerter.ts"]
    command: []
    depends_on:
      portal-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  authelia:
    image: authelia/authelia:4.39
    container_name: authelia
    profiles: [internet, local-test]
    networks:
      - auth-net          # internal: true — no internet egress
    volumes:
      - ./config/authelia:/config:ro
      - authelia-data:/data
      # Writable bind mount for Authelia's healthcheck env file. Without
      # this, read_only:true fails because Authelia writes to /app/.healthcheck.env
      # during startup. Host file is empty placeholder — Authelia populates it.
      - ./config/authelia/.healthcheck.env:/app/.healthcheck.env
    environment:
      - TZ=UTC
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
      # Renamed from AUTHELIA_JWT_SECRET to its 4.39 home (the old name auto-maps
      # but emits a deprecation warning on every startup; will become an error
      # in Authelia 5.0). The .env key stays as AUTHELIA_JWT_SECRET so the
      # operator doesn't need to rotate; only the env-var name Authelia sees
      # inside the container changes.
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}
    user: "10001:10001"      # plan §2 hardening floor — non-root UID
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true          # plan §2 hardening floor — read-only root FS
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
          pids: 100
    depends_on:
      portal-init:
        condition: service_completed_successfully
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2.8.4-alpine
    container_name: caddy
    profiles: [internet, local-test]
    networks:
      - edge-net          # cloudflared → caddy
      - auth-net          # caddy → authelia (forward_auth)
      - app-net           # caddy → openwebui + open_notebook
    # NO host port bindings — Cloudflare Tunnel is the only ingress
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
      # Server-side secret Caddy injects as X-Brain-Key when proxying
      # /workbench/* to openbrain-workbench (G7). Set this in the main .env to
      # the SAME value as OB1's MCP_ACCESS_KEY. Empty = the workbench rejects
      # every /workbench call (fail closed).
      - WORKBENCH_KEY=${WORKBENCH_KEY}
    user: "10000:10000"      # plan §2 hardening floor — non-root UID
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # binds :80 inside the container; not exposed on host
    read_only: true          # plan §2 hardening floor — read-only root FS
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
          pids: 200
    depends_on:
      authelia:
        condition: service_started
      portal-init:
        condition: service_completed_successfully
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      # Caddy's admin API at 127.0.0.1:2019 returns 200 whenever Caddy is up.
      # We can't use http://127.0.0.1:80/healthz because the Host header
      # would be 127.0.0.1, which doesn't match any site block in the
      # Caddyfile and trips the catch-all `:80 { respond 421 }` line.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  authelia-watcher:
    build:
      context: ./config/watcher
      dockerfile: Dockerfile
    image: portal-watcher:local
    container_name: authelia-watcher
    profiles: [internet, local-test]
    networks:
      - auth-net          # internal: true — only talks to portal-alerter over auth-net
    volumes:
      - authelia-data:/logs/authelia:ro
      - caddy-data:/logs/caddy:ro
      - ./config/watcher/authelia-watch.sh:/scripts/watch.sh:ro
      # RW so the watcher can append a new IP after firing the first
      # new_ip alert (so subsequent logins from the same device/network
      # don't re-alert). Lives in config/watcher/ so the operator can
      # also edit it (e.g. remove a stale carrier IP).
      - ./config/watcher/known-ips.txt:/data/known-ips.txt
    environment:
      - ALERTER_URL=http://portal-alerter:8080/alert
      - ALERT_BASE_URL=${PUBLIC_DOMAIN}
    user: "10002:10002"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
          pids: 50
    depends_on:
      authelia:
        condition: service_started
      portal-alerter:
        condition: service_started
    # No runtime entrypoint override — Dockerfile's tini + watch.sh runs
    # via CMD, with deps baked into the image at build time.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # authelia-notif-bridge -- tails Authelia's filesystem notifier and
  # forwards each user-facing record (2FA OTP, password reset, account
  # change) to portal-alerter so they reach Gmail. Without this, the OTP
  # for 2FA enrollment lives only at /data/notification.txt -- unreachable
  # when you're off the LAN, which defeats the point of the public portal.
  authelia-notif-bridge:
    build:
      context: ./config/auth-notification-bridge
      dockerfile: Dockerfile
    image: portal-authnotif-bridge:local
    container_name: authelia-notif-bridge
    profiles: [internet, local-test]
    networks:
      - auth-net          # portal-alerter is on auth-net; bridge talks to it here
    volumes:
      - authelia-data:/data:ro
      - ./config/auth-notification-bridge/bridge.sh:/scripts/bridge.sh:ro
    environment:
      - NOTIF_FILE=/data/notification.txt
      - ALERTER_URL=http://portal-alerter:8080/alert
      - ALERT_SEVERITY=info
      - ALERT_EVENT=authelia.user-notification
    # Same UID as authelia (10001) so we can read /data/notification.txt
    # (mode 0600). Read-only mount + read_only fs constrain further.
    user: "10001:10001"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=4m
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 32M
          pids: 30
    depends_on:
      authelia:
        condition: service_started
      portal-alerter:
        condition: service_started
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  integrity-tripwire:
    build:
      context: ./config/tripwire
      dockerfile: Dockerfile
    image: portal-tripwire:local
    container_name: integrity-tripwire
    profiles: [internet, local-test]
    networks:
      - auth-net          # internal: true
    volumes:
      - ./config/caddy/Caddyfile:/watch/Caddyfile:ro
      - ./config/authelia/configuration.yml:/watch/configuration.yml:ro
      - ./config/authelia/users_database.yml:/watch/users_database.yml:ro
      - ./config/tripwire/integrity-tripwire.sh:/scripts/tripwire.sh:ro
      - tripwire-data:/state
    environment:
      - ALERTER_URL=http://portal-alerter:8080/alert
      - CHECK_CRON=${TRIPWIRE_CRON:-0 4 * * *}
    user: "10003:10003"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
          pids: 50
    depends_on:
      portal-alerter:
        condition: service_started
      portal-init:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        # Init once at startup; ignore non-zero (e.g., drift detected — alert sent, container should still run cron).
        /scripts/tripwire.sh init || true
        # Render the supercronic crontab from the CHECK_CRON env var, then exec.
        printf '%s /scripts/tripwire.sh check\n' "$$CHECK_CRON" > /tmp/crontab.rendered
        exec /usr/local/bin/supercronic /tmp/crontab.rendered
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  portal-cron:
    build:
      context: ./config/portal-cron
      dockerfile: Dockerfile
    image: portal-cron:local
    container_name: portal-cron
    profiles: [internet, local-test]
    networks:
      - notify-net        # only reaches portal-alerter; no internet egress used by cron itself
    volumes:
      - ./config/portal-cron/crontab:/etc/portal-crontab:ro
    environment:
      - PORTAL_DIGEST_CRON=${PORTAL_DIGEST_CRON:-0 7 * * *}
      - TZ=UTC
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
          pids: 50
    depends_on:
      portal-alerter:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  cloudflared:
    image: cloudflare/cloudflared:2024.10.0
    container_name: cloudflared
    # `internet` profile only — local-test mode runs the portal without ever
    # talking to Cloudflare, so nothing is exposed to the internet during dev.
    profiles: [internet]
    networks:
      - edge-net
    # --metrics exposes /ready and /healthcheck on port 2000 (bound to
    # the edge-net only -- no host port). tunnel-watcher probes this to
    # detect tunnel disconnects and alert via portal-alerter.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    user: "65532:65532"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
          pids: 100
    depends_on:
      caddy:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # tunnel-watcher -- HTTP-probes cloudflared:2000/ready every 30s and
  # alerts (HIGH) if the tunnel is down for >=3 consecutive checks
  # (default 90s). Fires an INFO event when the tunnel recovers.
  tunnel-watcher:
    build:
      context: ./config/tunnel-watcher
      dockerfile: Dockerfile
    image: portal-tunnel-watcher:local
    container_name: tunnel-watcher
    profiles: [internet]
    networks:
      - edge-net          # reaches cloudflared:2000
      - auth-net          # reaches portal-alerter:8080 (it sits on both nets)
    volumes:
      - ./config/tunnel-watcher/tunnel-watch.sh:/scripts/watch.sh:ro
    environment:
      - CLOUDFLARED_URL=http://cloudflared:2000/ready
      - ALERTER_URL=http://portal-alerter:8080/alert
      - POLL_SEC=${TUNNEL_WATCHER_POLL_SEC:-30}
      - FAILURES_BEFORE_ALERT=${TUNNEL_WATCHER_FAILURES_BEFORE_ALERT:-3}
    user: "10003:10003"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=4m
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 32M
          pids: 30
    depends_on:
      cloudflared:
        condition: service_started
      portal-alerter:
        condition: service_started
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  caddy-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
      args:
        # UID 10000 matches Caddy's UID so the backup process can read all
        # of Caddy's state files (instance.uuid, locks/, last_clean.json
        # are mode 0600). Audit 2026-05-29 finding F.1 — earlier UID 10004
        # silently excluded these from the tarball.
        BACKUP_UID: "10000"
        BACKUP_USER: caddybak
    image: portal-backup-caddy:local
    container_name: caddy-backup
    profiles: [internet, local-test]
    volumes:
      - caddy-data:/data:ro
      - ./backups/caddy:/backups
      - ./backup/caddy-backup.sh:/scripts/backup.sh:ro
    environment:
      - BACKUP_DIR=/backups
      - DATA_DIR=/data
      - RETAIN_COUNT=${CADDY_BACKUP_RETAIN_COUNT:-2}
      - HEALTH_TCP=${CADDY_BACKUP_HEALTH_TCP:-caddy:80}
      - BACKUP_CRON=${CADDY_BACKUP_CRON:-0 3 * * *}
    user: "10000:10000"
    # edge-net membership exists only so the precheck can TCP-probe
    # caddy:80. cap_drop ALL + read_only + no-new-privileges + non-root UID
    # constrain what a compromised backup container could do on the net.
    networks:
      - default
      - edge-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    deploy:
      resources:
        limits:
          pids: 50
    command:
      - sh
      - -c
      - |
        printf '%s sh /scripts/backup.sh\n' "$$BACKUP_CRON" > /tmp/crontab.rendered
        echo "[$$(date -u +%FT%TZ)] Caddy backup scheduler started"
        exec /usr/local/bin/supercronic /tmp/crontab.rendered
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  authelia-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
      args:
        # UID 10001 matches Authelia's UID so the backup process can read
        # Authelia state files (notification.txt is mode 0600).
        # Audit 2026-05-29 finding F.1 — earlier UID 10005 silently excluded
        # these from the tarball.
        BACKUP_UID: "10001"
        BACKUP_USER: authbak
    image: portal-backup-authelia:local
    container_name: authelia-backup
    profiles: [internet, local-test]
    volumes:
      - authelia-data:/data:ro
      - ./backups/authelia:/backups
      - ./backup/authelia-backup.sh:/scripts/backup.sh:ro
    environment:
      - BACKUP_DIR=/backups
      - DATA_DIR=/data
      - RETAIN_COUNT=${AUTHELIA_BACKUP_RETAIN_COUNT:-2}
      - HEALTH_TCP=${AUTHELIA_BACKUP_HEALTH_TCP:-authelia:9091}
      - BACKUP_CRON=${AUTHELIA_BACKUP_CRON:-0 3 * * *}
    user: "10001:10001"
    # auth-net membership exists only so the precheck can TCP-probe
    # authelia:9091. Hardening still applies (cap_drop ALL, read_only,
    # no-new-privileges, non-root UID).
    networks:
      - default
      - auth-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    deploy:
      resources:
        limits:
          pids: 50
    command:
      - sh
      - -c
      - |
        printf '%s sh /scripts/backup.sh\n' "$$BACKUP_CRON" > /tmp/crontab.rendered
        echo "[$$(date -u +%FT%TZ)] Authelia backup scheduler started"
        exec /usr/local/bin/supercronic /tmp/crontab.rendered
    restart: unless-stopped
    depends_on:
      authelia:
        condition: service_started
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  openwebui-data:
  mnemory-data:
  smolcrawl-data:
  llm-gateway-db-data:   # LiteLLM spend-log DB (transparent gateway, guide §1A)
  llm-queue-data:        # llm-queue's OWN analytics event store (B2/P3 SQLite, NOT LiteLLM's schema)
  # little-coder — five expertise volumes (persistence boundary, design §3.6)
  # plus the project-scoped workspace shared with open-terminal.
  # `little-coder-sessions` holds pi's per-chat session files — added in
  # the §3.1 follow-up that switched from --no-session to per-trigger
  # `--session <id>` for OWUI in-chat continuity + native compaction.
  little-coder-journals:
  little-coder-skill:
  little-coder-cohorts:
  little-coder-polyglot:
  little-coder-sessions:
  little-coder-workspace:
  # Portal volumes (plan §7.3) — empty until `scripts/portal-on.ps1` runs.
  caddy-data:
  caddy-config:
  authelia-data:
  tripwire-data:
  # Cross-project named volume from the open-brain compose project,
  # referenced by openbrain-wiki-backup. ai-stack does not own this;
  # it must already exist (it does, when OB1 is up).
  openbrain-wiki-data:
    external: true
    name: open-brain_openbrain-wiki-data
  # X.2 — OB1's gitignored binary-asset volume (uploaded images/PDFs), so the
  # wiki-backup can snapshot it (it's not in the git vault). External: owned by
  # the open-brain project.
  wiki-assets:
    external: true
    name: open-brain_wiki-assets

networks:
  # Internal-only CALLER plane: no internet access. Every service that consumes
  # inference sits here and reaches it ONLY via the `llama-cpp` /
  # `llama-cpp-embed` aliases on llm-gateway. The real inference servers are NOT
  # here (moved to llm-backend-net, 2026-06-13), so callers physically cannot
  # route around LiteLLM.
  llm-net:
    internal: true
  # Internal-only BACKEND plane: the real inference servers
  # (llama-cpp-upstream, llama-cpp-embed-upstream) + the single ingress
  # (llm-gateway) + the lm-models-backup liveness probe. Nothing else attaches,
  # so inference is reachable only through the gateway. Enforced at change time
  # by scripts/check-llm-gateway-routing.ps1; see CLAUDE.md "Inference plane".
  llm-backend-net:
    internal: true
  # Internal-only network for the search stack. SearXNG/redis/gateway/mcpo
  # have NO internet route here; only `tor` (also on `default`) can egress.
  search-net:
    internal: true
  # Internal-only network for the little-coder control plane. little-coder,
  # open-terminal, and lc-mcpo talk here; none reaches the internet except
  # via lc-egress, which is allowlisted to the git host (design §3.4).
  lc-net:
    internal: true
  default:
    driver: bridge
  # ----- Portal networks (plan §7.4) -------------------------------------
  # edge-net: only cloudflared ↔ caddy.
  edge-net:
    driver: bridge
  # auth-net: caddy ↔ authelia ↔ portal-alerter (receive) ↔ watchers.
  # internal: true — no internet egress for anything attached here.
  auth-net:
    driver: bridge
    internal: true
  # app-net: caddy ↔ openwebui ↔ open_notebook. Backends reachable only from caddy.
  app-net:
    driver: bridge
  # notify-net: portal-alerter (egress to Gmail) + portal-cron (curls the alerter).
  # NOT internal — this is the single chokepoint with internet egress in the portal slice.
  notify-net:
    driver: bridge
  # ----- Cross-project networks (declared external) ----------------------
  # obnet: the open-brain compose project's own bridge. openbrain-db-backup
  # (defined below) joins it to reach openbrain-db over TCP. The OB1 stack
  # must be UP for backups to succeed -- consistent with the existing
  # cross-project dependency (OB1 depends on ai-stack_llm-net).
  obnet:
    external: true
    name: open-brain_obnet
