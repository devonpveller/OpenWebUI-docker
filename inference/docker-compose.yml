# inference/docker-compose.yml - the INFERENCE compose project (K.1, 2026-08-21).
# Moved out of the root ai-stack project (CLEANUP-PLAN Part K): the LLM host is
# its own service tree.
#
# SPLIT BY SERVICE GROUP 2026-09-19 (stack-layers sl-inference-split, PLAN 2.6).
# This file is now the project's SPINE: its name, the four included service
# groups, and the networks and volumes they share. The services themselves live
# in inference/compose/, one file per group, because a group is the unit that
# gets toggled and the unit a reviewer can hold in their head:
#
#   compose/upstreams.yml   llama-cpp-upstream, llama-cpp-embed-upstream   [local]
#   compose/queue.yml       llm-queue                                      [local]
#   compose/gateway.yml     llm-gateway, llm-gateway-db, llm-gateway-ui
#   compose/backups.yml     llm-gateway-backup, lm-models-backup [local]
#
# `include:` keeps ONE compose project: the project name, the container names,
# the volumes and the rendered service definitions are unchanged - only the file
# a definition lives in moved. Three things `include:` changes that are worth
# knowing before editing a group file:
#   - RELATIVE PATHS resolve against the INCLUDED file's directory, so from
#     compose/ the plane's own tree is ../ and the repo root is ../../. Since
#     sl-colo-inference (2026-09-19) the LiteLLM/llama-swap config and the
#     llm-queue source live INSIDE inference/, so those binds and that build
#     context read ../config/... and ../llm-queue; the binds that still reach
#     repo-root trees (data/, backup/, backups/) read ../../.
#   - TOP-LEVEL `networks:` / `volumes:` stay HERE, declared once. The group
#     files only reference them; compose merges the included models before it
#     validates, so a reference with no local declaration renders clean
#     (verified 2026-09-19 - a duplicate declaration would be the thing to
#     avoid, since an include conflict on a top-level key is an error).
#   - YAML ANCHORS ARE FILE-LOCAL, so this spine CANNOT host them. Each file
#     is parsed on its own before the models are merged: an `&anchor` defined
#     here is invisible in compose/*.yml, and a `*alias` there aborts the whole
#     render with `unknown anchor '<name>' referenced` (measured against compose
#     v5.3, 2026-09-19). That is why each group file declares its OWN
#     `x-hardening` block (stack-layers sl-compose-anchors) rather than sharing
#     one from here. Unlike `networks:`/`volumes:` this is NOT an include
#     conflict risk either way: a top-level `x-` key in an included file is
#     consumed by that file's own parse and never reaches the merged model, so
#     four DIFFERING blocks render clean as well (measured). Keep them
#     identical anyway - divergence here fails silently, not loudly.
#
# THE `local` PROFILE (stack-layers D11). The four services marked [local] above
# are the ones that need this host's GPUs and model files. Off, the project is a
# LiteLLM gateway + its ledger DB + the Admin-UI sidecar + the ledger backup:
# a front door that can serve CLOUD models from a machine with no GPU. On, it is
# the full local inference plane.
#   * THE OPERATOR'S DEPLOYMENT RUNS WITH THE PROFILE ON. Put `local` into
#     COMPOSE_PROFILES in inference/.env rather than `--profile local` on the
#     command line - llm-gateway reads COMPOSE_PROFILES to decide which model
#     groups to register, so the flag alone would start the local backends
#     without listing their models.
#     COMPOSE_PROFILES is per-PLANE since sl-env-split (D17): compose loads
#     inference/.env natively from this project directory, so this plane's
#     value carries `local` and NOTHING ELSE. A duplicate key in one env file
#     is last-wins and silent, so there is exactly one assignment. On this
#     host:
#         COMPOSE_PROFILES=local
#     (the frontend's gpu + tailscale live in frontend/.env, separately.)
#   * What the gateway REGISTERS is assembled at container start from
#     inference/config/litellm.config.yaml +
#     inference/config/litellm/model_list/*.yaml: a local
#     group only under the `local` profile, a cloud provider only when its API
#     key is set. The rule is "never register a model whose backend is absent".
#
# Drive it with scripts/stack/stack.ps1, or manually FROM THE REPO ROOT:
#   docker compose -f inference/docker-compose.yml up -d
# The ${LITELLM_DB_PASSWORD:?} guard makes a bare `up` without inference/.env
# fail loud instead of starting with empty credentials.
#
# Seam: llm-net is OWNED by the root ai-stack anchor project (callers live
# there and in other projects); this project attaches externally and holds the
# llama-cpp / llama-cpp-embed aliases on llm-gateway. llm-backend-net is
# plane-internal and native here - nothing outside inference may join it.
name: inference

include:
  - compose/upstreams.yml
  - compose/queue.yml
  - compose/gateway.yml
  - compose/backups.yml

volumes:
  # LiteLLM spend-log DB (transparent gateway, guide §1A). Migrated from
  # ai-stack_llm-gateway-db-data 2026-08-21 (data copied).
  llm-gateway-db-data:
  # llm-queue's OWN analytics event store (B2/P3 SQLite, NOT LiteLLM's schema).
  # Migrated from ai-stack_llm-queue-data 2026-08-21 (data copied).
  llm-queue-data:

networks:
  # Caller-facing seam — owned by the root ai-stack anchor. The gateway (and
  # only the gateway) attaches with the llama-cpp/llama-cpp-embed aliases.
  llm-net:
    external: true
    name: ai-stack_llm-net
  # App seam — owned by the anchor; the portal Caddy reaches llm-gateway-ui
  # here (litellm.devinveller.ai, added 2026-08-22).
  app-net:
    external: true
    name: ai-stack_app-net
  # Internal-only BACKEND plane: the real inference servers + llm-queue +
  # the single ingress (llm-gateway) + the lm-models-backup liveness probe.
  # Native to this project — callers physically cannot route around LiteLLM.
  # Enforced at change time by scripts/checks/check-llm-gateway-routing.ps1.
  llm-backend-net:
    internal: true
