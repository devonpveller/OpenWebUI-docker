# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# llama-swap config for ai-stack/llama-cpp container.
#
# Adding a new model:
#   1. Add an env block in docker-compose.yml (or .env) for its path / tunables.
#   2. Copy one of the model entries below and update: id, name, aliases,
#      and the four ${env.*} references. Everything else is inherited from
#      the `common-args` macro.
#
# A single GPU is shared by all models defined here. Only one model is
# resident at a time; llama-swap unloads the previous server when a request
# arrives for a different model id. Keep clients pinned to the same id
# (see docker-compose.yml `LLM_MODEL` for mnemory) to avoid swap thrash.

listen: 0.0.0.0:8080
healthCheckTimeout: 300
includeAliasesInList: true
# Never auto-unload — models stay resident until explicitly swapped.
globalTTL: 0
logToStdout: both

macros:
  # Shared llama-server flags. Per-model cmd only specifies what differs
  # (model file + per-model tuning vars).
  common-args: >-
    --host 0.0.0.0 --port ${PORT}
    --chat-template-file /etc/llama/chat-template.jinja
    --flash-attn on
    --no-mmap

models:
  qwen36-35b-a3b:
    name: Qwen 3.6 35B-A3B
    cmd: |
      llama-server ${common-args}
      --model        ${env.LLAMA_SWAP_QWEN36_35B_MODEL_PATH}
      --ctx-size     ${env.LLAMA_SWAP_QWEN36_35B_CTX_SIZE}
      --n-gpu-layers ${env.LLAMA_SWAP_QWEN36_35B_N_GPU_LAYERS}
      --parallel     ${env.LLAMA_SWAP_QWEN36_35B_N_PARALLEL}
      --batch-size   ${env.LLAMA_SWAP_QWEN36_35B_BATCH}
      --ubatch-size  ${env.LLAMA_SWAP_QWEN36_35B_UBATCH}
      --cache-type-k ${env.LLAMA_SWAP_QWEN36_35B_CACHE_TYPE_K}
      --cache-type-v ${env.LLAMA_SWAP_QWEN36_35B_CACHE_TYPE_V}
      --reasoning-budget ${env.LLAMA_SWAP_QWEN36_35B_REASONING_BUDGET}
    filters:
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: true
        "${MODEL_ID}:nothink":
          chat_template_kwargs:
            enable_thinking: false

  # 2026-07-09 TEMPORARY benchmark entry: the pre-ThinkingCap 27B GGUF with
  # speculative decoding off, so before/after runs compare on the same
  # llama-server build. NOT registered in LiteLLM — unreachable from the
  # service plane; only direct diagnostic probes hit it. Values mirror the
  # qwen36-27b .env values at swap time. Remove once the experiment settles.
  qwen36-27b-baseline:
    name: Qwen 3.6 27B (pre-ThinkingCap baseline)
    cmd: |
      llama-server ${common-args}
      --model        /models/lmstudio-community/Qwen3.6-27B-GGUF/Qwen3.6-27B-Q4_K_M.gguf
      --ctx-size     262144
      --n-gpu-layers 99
      --parallel     3
      --batch-size   1024
      --ubatch-size  512
      --cache-type-k q4_0
      --cache-type-v q4_0
      --reasoning-budget 4096
    filters:
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: true
        "${MODEL_ID}:nothink":
          chat_template_kwargs:
            enable_thinking: false

  qwen36-27b:
    # 2026-07-09: id kept as `qwen36-27b` (many services pin it) but the GGUF
    # underneath is now the ThinkingCap fine-tune — see .env MODEL_PATH.
    name: Qwen 3.6 27B (ThinkingCap)
    # B2 LANDED (2026-06-14): concurrencyLimit 0 = UNLIMITED here. The admission
    # decision now belongs ENTIRELY to the `llm-queue` controller in front of this
    # server (LiteLLM api_base → llm-queue → here). llama-swap must NOT also cap,
    # or the ordered depth would split between our priority heap and llama.cpp's
    # opaque internal FIFO and priority past the first few would be a no-op
    # (design §3.1/§7.4 "don't double-queue"). The queue admits N≤slots+1 (4), so
    # at most one request sits in llama.cpp's FIFO to mask the dispatch gap.
    # Stopgap of record was `concurrencyLimit: 32` (2026-06-14, pre-B2).
    # Revert (B2 off): set this back to 32 AND point LiteLLM api_base back at
    # llama-cpp-upstream. See DESIGN-B2-inference-queue.md / memory
    # llm-429-llama-swap-concurrency.
    concurrencyLimit: 0
    cmd: |
      llama-server ${common-args}
      --model        ${env.LLAMA_SWAP_QWEN36_27B_MODEL_PATH}
      --ctx-size     ${env.LLAMA_SWAP_QWEN36_27B_CTX_SIZE}
      --n-gpu-layers ${env.LLAMA_SWAP_QWEN36_27B_N_GPU_LAYERS}
      --parallel     ${env.LLAMA_SWAP_QWEN36_27B_N_PARALLEL}
      --batch-size   ${env.LLAMA_SWAP_QWEN36_27B_BATCH}
      --ubatch-size  ${env.LLAMA_SWAP_QWEN36_27B_UBATCH}
      --cache-type-k ${env.LLAMA_SWAP_QWEN36_27B_CACHE_TYPE_K}
      --cache-type-v ${env.LLAMA_SWAP_QWEN36_27B_CACHE_TYPE_V}
      --reasoning-budget ${env.LLAMA_SWAP_QWEN36_27B_REASONING_BUDGET}
      --spec-type    ${env.LLAMA_SWAP_QWEN36_27B_SPEC_TYPE}
      --spec-draft-n-max ${env.LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_N_MAX}
      --spec-draft-type-k ${env.LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_CACHE_TYPE_K}
      --spec-draft-type-v ${env.LLAMA_SWAP_QWEN36_27B_SPEC_DRAFT_CACHE_TYPE_V}
    filters:
      setParamsByID:
        "${MODEL_ID}":
          chat_template_kwargs:
            enable_thinking: true
        "${MODEL_ID}:nothink":
          chat_template_kwargs:
            enable_thinking: false
