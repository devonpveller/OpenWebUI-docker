# LOCAL model group — the llama.cpp models served by this host.
#
# Moved here from litellm.config.yaml beside it (stack-layers
# sl-inference-split, 2026-09-19; the whole tree then moved from config/ into
# inference/config/ at sl-colo-inference, same day) so the gateway can run
# CLOUD-ONLY. The entries below are byte-identical to the model_list that lived
# in that file; only their home changed.
#
# `x-requires-profile: local` is read by the assemble-config.py one directory
# up (inference/config/litellm/) and stripped before LiteLLM sees the config:
# these models are registered only when `local` is in COMPOSE_PROFILES — the
# same variable that decides whether llm-queue and the *-upstream servers start
# at all. With the profile off there is no llm-queue to forward to, so listing
# them would advertise a backend that is not running.
model_list:
  # ─── Chat — Qwen 3.6 27B (both variants share one upstream slot) ───
  # B2 (2026-06-14): api_base points at the llm-queue ADMISSION CONTROLLER, NOT
  # the *-upstream server. LiteLLM stays the caller-facing front door + ledger;
  # llm-queue holds-and-dispatches behind it (semaphore + priority + wait
  # estimate), forwarding to llama-cpp-upstream. BOTH variants must point here —
  # they share one upstream slot, so a stray *-upstream api_base on `:nothink`
  # would bypass the queue (design §3.1). Revert = point both back at
  # llama-cpp-upstream + set llama-swap concurrencyLimit back to 32.
  # See ../documentation-plans-ai-stack/implementation-guide/LiteLLM-Proxy/DESIGN-B2-inference-queue.md.
  - model_name: qwen36-27b
    litellm_params:
      model: openai/qwen36-27b
      api_base: http://llm-queue:8080/v1
      api_key: dummy            # llama-swap ignores this; must be non-empty
  - model_name: qwen36-27b:nothink
    litellm_params:
      model: openai/qwen36-27b:nothink
      api_base: http://llm-queue:8080/v1
      api_key: dummy

  # ─── Qwen 3.6 35B-A3B — REMOVED 2026-06-12 (operator diagnostic) ───
  # No service is configured to use 35B. Removed from the gateway so (a) LiteLLM
  # cannot probe/trigger a 35B load (LiteLLM was treating a service's *check* as a
  # load request), and (b) any genuine 35B request now ERRORS — revealing the
  # caller. This should stop the 27B<->35B swap thrash. Re-add once the 35B
  # signal source is identified.

  # ─── Embeddings — bge-m3 (1024-dim). THREE aliases for the same upstream. ───
  # Every id any caller sends must be registered (transparent mode: callers can't
  # be fixed). llama-cpp-embed ignores the model field and serves the loaded GGUF.
  # B2/P4 (2026-06-14): embeddings now route through llm-queue too (api_base →
  # llm-queue). The embed upstream is PLAIN llama.cpp (no llama-swap cap, unbounded
  # FIFO) so it never 429'd; the queue fronts it for uniform observability + the
  # multi-model registry, with a GENEROUS embed backstop (256) and NO budget gate
  # so high-volume embedding bursts (OB1 chunk-worker backfill) behave as before
  # (held + processed 2-at-a-time), never rejected. llm-queue routes bge-m3* to the
  # embed upstream. Revert = point these three back at llama-cpp-embed-upstream.
  - model_name: bge-m3
    litellm_params:
      # hosted_vllm (NOT openai/): llama.cpp is a self-hosted OpenAI-compatible server. The openai
      # provider rejects bge-m3's `dimensions` param (UnsupportedParamsError) and drop_params does
      # NOT suppress it in this LiteLLM build; hosted_vllm passes it through (bge-m3 = native 1024-dim).
      model: hosted_vllm/bge-m3
      api_base: http://llm-queue:8080/v1
      api_key: dummy
  - model_name: bge-m3-f16.gguf            # little-coder source default
    litellm_params:
      # hosted_vllm (NOT openai/): llama.cpp is a self-hosted OpenAI-compatible server. The openai
      # provider rejects bge-m3's `dimensions` param (UnsupportedParamsError) and drop_params does
      # NOT suppress it in this LiteLLM build; hosted_vllm passes it through (bge-m3 = native 1024-dim).
      model: hosted_vllm/bge-m3
      api_base: http://llm-queue:8080/v1
      api_key: dummy
  - model_name: qllama/bge-m3:latest       # mnemory's current EMBED_MODEL value
    litellm_params:
      # hosted_vllm (NOT openai/): llama.cpp is a self-hosted OpenAI-compatible server. The openai
      # provider rejects bge-m3's `dimensions` param (UnsupportedParamsError) and drop_params does
      # NOT suppress it in this LiteLLM build; hosted_vllm passes it through (bge-m3 = native 1024-dim).
      model: hosted_vllm/bge-m3
      api_base: http://llm-queue:8080/v1
      api_key: dummy

  # ─── ROLES (model-roles, operator decisions R1-R5, 2026-09-28) ───
  # Callers name a ROLE; LiteLLM forwards `litellm_params.model` - the concrete
  # id - so llm-queue's registry and llama-swap's `setParamsByID` `:nothink`
  # thinking switch see exactly what they saw before. The five names above stay
  # registered until every consumer has moved and a soak shows no traffic on
  # them (R5, item mr-retire).
  #   local-large          the resident 27B, thinking               (R1)
  #   local-large:nothink  the same, thinking off                   (R2)
  #   local-small          the same 27B without thinking - one GPU, one resident
  #                        model, so no second model and no swap thrash (R1)
  #   local-small:nothink  identical to local-small today           (R2)
  #   local-embed          bge-m3, 1024-dim. A role does not make an embedding
  #                        swap free: a new model means re-embedding (R3)
  # The label Open WebUI shows for each role is DERIVED from the model file the
  # upstream loads (scripts/stack/model_labels.py; `stack.py labels`), never typed
  # here. Point a role at another concrete id and the label follows.
  - model_name: local-large
    litellm_params:
      model: openai/qwen36-27b
      api_base: http://llm-queue:8080/v1
      api_key: dummy
  - model_name: local-large:nothink
    litellm_params:
      model: openai/qwen36-27b:nothink
      api_base: http://llm-queue:8080/v1
      api_key: dummy
  - model_name: local-small
    litellm_params:
      model: openai/qwen36-27b:nothink
      api_base: http://llm-queue:8080/v1
      api_key: dummy
  - model_name: local-small:nothink
    litellm_params:
      model: openai/qwen36-27b:nothink
      api_base: http://llm-queue:8080/v1
      api_key: dummy
  - model_name: local-embed
    litellm_params:
      # hosted_vllm, as for the bge-m3 names above (the openai provider rejects `dimensions`).
      model: hosted_vllm/bge-m3
      api_base: http://llm-queue:8080/v1
      api_key: dummy

x-requires-profile: local
