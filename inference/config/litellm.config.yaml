# LiteLLM gateway config — transparent interposition (guide §1A).
#
# ENFORCING since the J.1 flip (2026-08-21): `master_key` under
# general_settings below is set from ${LITELLM_MASTER_KEY}, so every caller must
# present its own sk- virtual key or get a 401. Issue caller keys via
# llm-gateway-ui /key/generate. Before the flip this gateway ran PERMISSIVE and
# attributed spend by whatever key string a caller sent (T0 spike, 2026-06-12);
# that period is over, and commenting that line out is the only way back to it.
#
# AS-FLIPPED (cut-in applied 2026-06-12, guide §1A.7 / §8.3-revised): api_base
# below points at the renamed real servers (llama-cpp-upstream /
# llama-cpp-embed-upstream). The gateway itself holds the llama-cpp /
# llama-cpp-embed network aliases on :8080, so every caller's
# http://llama-cpp:8080 lands here and is forwarded by model name to the
# upstreams. Never point api_base back at the bare alias — the gateway would
# loop onto itself.
#
# DATABASE_URL is injected via compose env (expands ${LITELLM_DB_PASSWORD}); the
# spend ledger + store_model_in_db use it, and the same DB holds the virtual keys.

# MODEL LIST — NOT IN THIS FILE any more (stack-layers sl-inference-split,
# 2026-09-19). This file is now the gateway's BASE config: general_settings and
# litellm_settings, which apply whatever models are served. The model_list is
# assembled at container start by inference/config/litellm/assemble-config.py
# from the fragments in inference/config/litellm/model_list/:
#
#   local.yaml               the llama.cpp models — the exact entries that used
#                            to sit here (the `AS-FLIPPED` note above describes
#                            them); registered only when `local` is in
#                            COMPOSE_PROFILES, i.e. only when llm-queue and the
#                            *-upstream servers are actually running.
#   cloud.openrouter.yaml    OpenRouter — registered only when
#                            OPENROUTER_API_KEY is non-empty. Blank by default;
#                            read that file before setting it (the gateway has
#                            no egress today, and agent-org OD-6 says cloud
#                            belongs on its own gateway).
#
# WHY: LiteLLM YAML has no conditionals, and the gateway must be able to run
# cloud-only — on a node with no GPU the local profile is off, there is no
# llm-queue, and a registered local model would be a model with no backend.
# The rule is one line long: never register a model whose backend is absent.
# The assembler writes the merged result to /app/config.yaml, which is the path
# `command:` already passes to --config, so the compose command is unchanged.
# Effective config actually in use:  docker exec llm-gateway cat /app/config.yaml
# Why a model is missing:            docker logs llm-gateway | grep assemble-config


general_settings:
  # J.1 FLIP (2026-08-21): master_key ON - per-caller sk- virtual keys are
  # enforced (issued via llm-gateway-ui, same DB; see
  # LiteLLM-Proxy/J1-VIRTUAL-KEYS-CUTOVER.md). Rollback = comment this line
  # out + `docker compose up -d llm-gateway` (permissive mode ignores keys).
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  success_callback: ["postgres"]   # proven to populate LiteLLM_SpendLogs (T0 spike)
  failure_callback: ["postgres"]
  # LiteLLM's active model health-check sends a real completion to EVERY registered
  # model. On a single-GPU llama-swap backend that forces a model LOAD per probe
  # -> swap thrash. This is the documented LiteLLM+llama-swap pattern: turn the
  # active probe OFF here. Inference-plane uptime is monitored the side-effect-free
  # way by modules/system-health: gateway /health/liveliness + each upstream's
  # /health (llama-swap router liveness — 200 without loading a model) + GPU.
  background_health_checks: false
  # B2/P2 attribution note (2026-06-14, VERIFIED): LiteLLM's permissive
  # model-routing path rebuilds the upstream request through its OpenAI client and
  # sends `Authorization: Bearer <litellm_params.api_key>` (= `dummy`) — the
  # caller's real key (owui-chat / ollama / llama, visible in the spend ledger) is
  # NOT forwarded downstream. `forward_client_headers_to_llm_api` does NOT change
  # this for the openai-client path (tested: headers at llm-queue were all
  # x-stainless-* + `Bearer dummy`). So per-caller priority THROUGH the gateway
  # currently attributes to the default class unless the caller sets the OpenAI
  # `user` body field (which LiteLLM DOES forward — llm-queue reads it as a
  # fallback). Direct (non-gateway) callers and `user`-setting callers attribute
  # correctly today; full per-caller priority tightens when master_key + virtual
  # keys land (design §10.3.2). The priority MECHANISM is live and proven.
  # B2/P2: read-only queue state to llm-net consumers (the §9 llm-traffic OWUI
  # pipe / a dashboard) WITHOUT exposing the mutating control verbs. Only the
  # GET-only /observe/* namespace is bridged (the mutating /queue/{id}/priority,
  # /cancel, /keys/{key}/policy stay on llm-backend-net, operator-only — §10.3.1).
  pass_through_endpoints:
    - path: "/observe/queue"
      target: "http://llm-queue:8080/observe/queue"
    - path: "/observe/queue/stats"
      target: "http://llm-queue:8080/observe/queue/stats"
    - path: "/observe/queue/estimate"
      target: "http://llm-queue:8080/observe/queue/estimate"
  # NOTE: little-coder GETs /slots for a (best-effort, non-gating) GPU-occupancy
  # metric, but llama-swap returns 404 for /slots even with a model loaded — this
  # metric was already dead before the gateway (not a flip regression). To revive
  # it: enable /slots on the llama.cpp server (--slots in llama-swap.config.yaml
  # common-args) AND add a LiteLLM pass_through_endpoints entry forwarding /slots
  # -> llama-cpp-upstream. Keep LiteLLM the front door; never route around it.

litellm_settings:
  # J.1: pre-call hook (custom_callbacks.py mounted into /app) injects
  # x-ai-stack-caller from the key's metadata.lane -> llm-queue attribution.
  callbacks: custom_callbacks.proxy_handler_instance
  drop_params: true        # tolerate caller params llama.cpp doesn't recognize
  set_verbose: false
  telemetry: false         # no anonymous outbound beacon (guide §19/D10)
  request_timeout: 600     # match LLAMA_CPP_TIMEOUT headroom for long completions
  # B2 (2026-06-14): on a queue 429 (over backstop), LiteLLM RETRIES the request.
  # This is desirable here — it turns a transient over-backstop burst back into
  # hold-and-dispatch: the rejected request is retried until llm-queue admits it,
  # so a deep-research fan-out (the original 429 cause) resolves to all-200 instead
  # of dropping the overflow. VERIFIED 2026-06-14: a 48-burst through the gateway →
  # 0×429 (all served), while a 48-burst DIRECT to llm-queue (no retry layer) →
  # the structured §4.5 body. On SUSTAINED saturation (retries exhausted) LiteLLM
  # surfaces a 429 whose message EMBEDS the queue's reason ("…saturated: N waiting,
  # backstop M…") — it re-wraps the structured fields into its RateLimitError
  # envelope (the §4.5 caveat), but the actionable reason survives. Full live state
  # (projected_wait, depth, slots) stays available via the X-Queue-* response
  # headers and GET /queue (P2 read-only pass-through). A thin LiteLLM
  # exception-mapping hook could restore the full JSON later if wanted — deferred
  # to avoid coupling to LiteLLM internals (design §4.3c).
  num_retries: 3
