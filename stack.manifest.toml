# stack.manifest.toml - the ai-stack plane and product manifest.
#
# ONE checked-in file declaring, per PLANE (a compose project that starts and
# stops together): its compose file, what it needs to RUN, what makes it
# USABLE, its compose profiles, what the host must provide, and which keys must
# be non-blank before it may be enabled.
#
# Read by scripts/stack/stack.py (standard library only, Python >= 3.11).
# The driver NEVER writes this file; per-host enablement lives in the
# gitignored .stack/state.json. Schema: scripts/stack/README.md.
#
# TWO GRAPHS, deliberately not merged (stack-layers PLAN section 1):
#   requires - what a plane needs to RUN. Hard: `up` orders by it and
#              `enable` REFUSES when a required plane is off.
#   optional - a soft edge. The plane runs without it, degraded. Informational
#              only: it never orders `up` and never causes a refusal.
#   surfaces - what a PERSON needs to reach an engine. Declared per product.
#
# WHERE THE LINE IS, for the very common `HOST=${VAR:-<other plane's service>}`
# plus `..._ENABLED=${VAR:-<bool>}` shape: THE TOGGLE'S DEFAULT DECIDES.
#   default TRUE  -> an `optional` edge: a default boot reaches for the other
#                    plane and degrades (a dead route, a 502) when it is off.
#   default FALSE -> NOT an edge: a default boot never touches it. Such
#                    references are recorded in the plane's comment as
#                    "considered, not an edge" with their line numbers, so a
#                    reader can tell "seen and rejected" from "not seen".
# This rule is stated because the first cut of this manifest missed two
# default-true cases sitting four and sixteen lines below one it did cite
# (frontend -> ob1, frontend -> portal), and an unstated rule is how that
# happens twice.
#
# ORDER MATTERS. `up` is a topological sort of `requires`; ties are broken by
# the order planes are declared BELOW, and that order is what reproduces
# scripts/stack/stack.ps1's sequence:
#   anchor, inference, frontend, memory, search, coder, ob1, agent-org
# Re-ordering these tables re-orders `up`. Do it deliberately.
#
# EVERY edge below is evidenced in a compose file; the evidence is cited in the
# comment above it as <file>:<line> (verified 2026-09-19).
#
# Plane keys:
#   compose   - compose file, repo-root-relative (forward slashes).
#   env_file  - extra --env-file for the compose CLI. RETIRED by sl-env-split
#               (2026-09-19): NO plane declares one, so compose loads
#               `<project dir>/.env` natively for all eight. The key is still
#               READ (Manifest.env_file) so a future plane could declare one.
#   lease     - scripts/agent-harness/lease-names.conf name. Absent = none.
#   requires  - hard edges (above).
#   optional  - soft edges (above).
#   implicit  - the plane is started whenever anything runs and never has to be
#               enabled; no requires-refusal ever names it.
#   manual    - present when the driver must NOT start/stop this plane; the
#               value names what does. `up`/`down`/`restart` skip or refuse it.
#   host      - what the machine itself must provide, in prose.
#   keys      - variable names that must be present and non-blank in the plane's
#               OWN env file (`<project dir>/.env`). A blank one makes `enable`
#               refuse, naming the key and the file.
#   ports     - published HOST ports -> what answers on them.
#   profiles  - compose profiles. Each is a sub-table with a `description`, an
#               optional `requires`, and EXACTLY ONE of the three DEPLOYMENT
#               flags below, which say whether a default `up` starts what the
#               profile gates. Declaring none of the three is refused by
#               `stack.py inventory --check`: a profile that appears around
#               services which run TODAY and says nothing about itself is a
#               silent shrink of the running set.
#                 description - what the profile turns on
#                 default     - passed on EVERY invocation, and it survives
#                               --headless. For something a plane is not usable
#                               without; never for a SURFACE, or --headless
#                               becomes a no-op for that plane.
#                 opt_in      - something OTHER than the driver turns it on:
#                               COMPOSE_PROFILES in the plane env file, a
#                               product (`enable research`), an operator, or a
#                               dedicated script. The description must say
#                               which. NOTE that `docker compose --profile X`
#                               REPLACES COMPOSE_PROFILES instead of adding to
#                               it, so the driver unions the env's list into any
#                               flags it passes - see effective_profiles().
#                 pending     - DECLARED here, not yet in the compose file; a
#                               later stack-layers item adds it. Enabling one is
#                               a no-op until then, and the driver says so.
#                               NOT the same as a profile whose compose file is
#                               a PINNED SUBMODULE that has not caught up - see
#                               the ob1 tables, and `inventory --check`, which
#                               reports those as `[declared, not rendered]`
#                               rather than as drift.
#                 requires    - other profiles ON THE SAME PLANE that this one
#                               cannot work without. The driver closes over these
#                               transitively (stack.py `profile_closure`), so
#                               enabling one pulls its prerequisites in. COMPOSE
#                               HAS NO SUCH MECHANISM: a hand-run
#                               `--profile x` still needs `--profile y` typed
#                               beside it. Use it where a profiled service's only
#                               engine lives in another profile - otherwise the
#                               plane comes up healthy and silently does nothing.

# --------------------------------------------------------------------------
[planes.anchor]
# The root docker-compose.yml owns the shared ai-stack_* networks and ZERO
# services (Part K.5b). Every other plane attaches to those networks
# externally, which is why every plane requires the anchor. It is IMPLICIT:
# `up` starts it whenever any plane runs, and no plane's `enable` refuses on
# account of it.
compose  = "docker-compose.yml"
implicit = true
requires = []
optional = []
host     = ["Docker Engine (Docker Desktop on this host); creates the networks, starts no container"]
keys     = []

[planes.anchor.ports]

# --------------------------------------------------------------------------
[planes.inference]
# The LLM front door. llm-gateway (LiteLLM) carries the `llama-cpp` /
# `llama-cpp-embed` aliases on ai-stack_llm-net; the real servers sit on the
# project's native llm-backend-net so callers cannot route around it.
# requires anchor: inference/docker-compose.yml:94-96, 99-101 (ai-stack_llm-net
# and ai-stack_app-net, both external: true). Re-derived 2026-09-19: these read
# :448-450, 453-455 until sl-driver-parity's citation sweep - sl-inference-split
# moved the services into inference/compose/*.yml and left that file 91 lines
# long, so the old numbers pointed past its end. Moved AGAIN the same day by
# sl-compose-anchors (+11 lines of include-semantics header above the networks
# block); the construct each cites is unchanged, only its line number.
compose  = "inference/docker-compose.yml"
lease    = "inference"
requires = ["anchor"]
optional = []
host = [
  "NVIDIA GPU + NVIDIA Container Toolkit (inference/compose/upstreams.yml:122-128 and :173-179) - the `local` profile only",
  "Chat GGUFs under ${LM_MODELS_DIR} (inference/compose/upstreams.yml:24, :76); sl-inference-split replaced the literal per-user path this line used to cite",
  "Embedding GGUF bge-m3-f16.gguf in that same store (inference/compose/upstreams.yml:166)",
]
# LITELLM_MASTER_KEY is required since J.1 (per-caller virtual keys); without it
# every consumer's bearer is rejected.
keys = ["LITELLM_DB_PASSWORD", "LITELLM_MASTER_KEY"]

[planes.inference.ports]
"8081" = "llama-cpp-upstream (loopback; probes only - never route inference here)"
"8082" = "llama-cpp-embed-upstream (loopback; probes only)"

# NOT `pending`: sl-inference-split landed it. `profiles: [local]` is live in
# inference/compose/upstreams.yml:63,:151, queue.yml:64 and backups.yml:69, and
# the render proves it (4 services without the profile, 8 with). Flipped here by
# sl-frontend-solo, which is making this file's profile rows truthful as a set -
# it is inference's row, corrected in the same pass as the frontend's.
# Not `default = true`, for the same reason as the frontend's: a CLI --profile
# REPLACES COMPOSE_PROFILES rather than adding to it, so a default would
# override the host's own value.
[planes.inference.profiles.local]
# OPT-IN, not default: this host turns it on with COMPOSE_PROFILES=local in the
# ROOT .env, which compose reads for itself. The driver deliberately passes no
# --profile flag here, because a flag would REPLACE that env setting rather than
# add to it (see effective_profiles() in scripts/stack/stack.py for the measured
# proof). sl-frontend-solo reached the same conclusion for its three frontend
# profiles and left all of them without a `default` for exactly this reason.
opt_in      = true
description = "llama.cpp upstreams + llm-queue + the model-store backup, i.e. local inference (needs the GPU and the GGUFs). Off, the plane is a LiteLLM gateway + ledger + Admin UI that serves cloud models only"

# --------------------------------------------------------------------------
[planes.frontend]
# Open WebUI + the tailscale netns companion. NEVER restart openwebui alone.
# requires anchor: frontend/docker-compose.yml:502-510 (ai-stack_default,
# ai-stack_llm-net, ai-stack_app-net, all external: true). NOTE it is the `gpu`
# profile that attaches to them; under `stock` the plane uses only its own
# frontend_owui-net (:513) and needs no anchor network at all.
compose  = "frontend/docker-compose.yml"
lease    = "frontend"
requires = ["anchor"]
# The frontend is the stack's tailnet front door: `tailscale` shares openwebui's
# netns and frontend/entrypoint.sh publishes a serve route per backend, each a
# HOST=${VAR:-<service>} + ..._ENABLED pair. Five of those backends live in
# OTHER planes, and every one of the toggles defaults TRUE, so a default boot
# reaches into four planes besides this one. The route table is
# frontend/entrypoint.sh:93-105; the variables are :54-77, overridden for
# the two that differ by frontend/docker-compose.yml:344-369.
# inference: frontend/docker-compose.yml:344,347 (LLAMA_CPP_HOST /
#   LLAMA_CPP_EMBED_HOST default to the gateway aliases) behind the
#   LLAMA_CPP_ENABLED toggle at :346 - OWUI serves without it. Also
#   frontend/entrypoint.sh:70,72 (LITELLM_UI_HOST defaults to llm-gateway-ui, enabled
#   true) -> the serve route at frontend/entrypoint.sh:103.
# search: frontend/docker-compose.yml:286 (SEARXNG_QUERY_URL defaults to
#   http://gateway:8080/search) - web search is off without it, chat is not.
# ob1: frontend/docker-compose.yml:350 (OPEN_NOTEBOOK_HOST defaults to
#   open_notebook, an ob1-plane service) with :352 OPEN_NOTEBOOK_ENABLED
#   defaulting TRUE; ports at :351,:353-354. Consumed by frontend/entrypoint.sh:97 and :99
#   (the open-notebook and open-notebook-api serve routes). The image's own
#   fallback for the wiki route also points at ob1 (frontend/entrypoint.sh:66,
#   QUARTZ_HOST=${QUARTZ_HOST:-openbrain-wiki-viewer}) before the compose file
#   overrides it - see the portal edge below.
# portal: frontend/docker-compose.yml:366 (QUARTZ_HOST defaults to `caddy`, a
#   PORTAL-plane service) with :368 QUARTZ_ENABLED defaulting TRUE; the comment
#   at :356-365 explains the route (Tailnet > Caddy > wiki app on caddy:8446,
#   which resolves because caddy and openwebui share ai-stack_app-net).
#   Consumed by frontend/entrypoint.sh:101. Note this is the reverse of portal's HARD
#   requires on frontend: the portal needs openwebui to serve its main vhost,
#   and the frontend's tailnet wiki route needs the portal's caddy.
# agent-org: frontend/entrypoint.sh:74,76 (MATTERMOST_HOST defaults to `mattermost`,
#   MATTERMOST_ENABLED defaults TRUE) -> the serve route at frontend/entrypoint.sh:105,
#   whose own comment says "agent-org compose project on llm-net, starts after
#   us". Declared in the IMAGE (frontend/entrypoint.sh, baked into tailscale:local), not
#   in frontend/docker-compose.yml - the compose file passes this service
#   exactly one variable (:324-335). A reader of the compose file alone does
#   not see this edge.
optional = ["inference", "search", "ob1", "portal", "agent-org"]
host = [
  "Under the `gpu` profile only: image openwebui:local, a LOCAL CUDA build (frontend/docker-compose.yml:198-205, frontend/Dockerfile.openwebui-gpu), plus an NVIDIA container runtime for the device reservation at :297-303. The DEFAULT `stock` profile needs neither: it pulls ghcr.io/open-webui/open-webui:v0.11.0 and runs on any host with Docker",
  "Under the `tailscale` profile only: a Tailscale auth key (TAILSCALE_AUTH_KEY). That profile requires `gpu`, because the pair is hard-wired (frontend/docker-compose.yml:323, network_mode: service:openwebui names the gpu definition)",
]
keys = ["WEBUI_SECRET_KEY"]

[planes.frontend.ports]
"3000" = "openwebui (loopback)"

# Three profiles, live in the compose file since sl-frontend-solo. At least one
# openwebui-providing profile must be active or the plane renders nothing but
# openwebui-backup.
#
# NONE is `default = true`, deliberately. A `default` profile makes the driver
# pass `--profile ...` on every invocation, and a CLI --profile REPLACES
# COMPOSE_PROFILES rather than adding to it - so the host's own value (set in
# ONE authoritative section of .env.example) would be silently overridden, and
# a `stock` host would be handed `gpu`. This is parity with stack.ps1, which
# passes no frontend profile either and lets .env decide.
[planes.frontend.profiles.stock]
# All three are `opt_in`, never `default`, and the block comment above says why
# in sl-frontend-solo's own words: a CLI --profile REPLACES COMPOSE_PROFILES, so
# a default here would hand a `stock` host `gpu`. `opt_in` is the flag for
# exactly that - something other than the driver's defaults turns it on, and
# here it is the COMPOSE_PROFILES line in .env.
opt_in      = true
description = "Open WebUI alone on the pinned upstream image - no GPU, no local build, no tailscale, no anchor network (frontend/docker-compose.yml:162-193). The fresh-clone deployment; mutually exclusive with `gpu`, whose container_name it shares"

[planes.frontend.profiles.gpu]
opt_in      = true
description = "the CUDA local build + the NVIDIA device reservation (frontend/docker-compose.yml:198-205, 297-303), the llm-net/app-net seams and the status-pipe mount"

[planes.frontend.profiles.tailscale]
# `requires gpu` is the MACHINE-READABLE form of what this description already
# says twice: the companion's network_mode names the `gpu` definition of
# openwebui (frontend/docker-compose.yml:323), so `--profile tailscale` alone is
# not a deployment - compose refuses it outright with
#   service "tailscale" depends on undefined service "openwebui"
# Added by sl-driver-parity using the `requires` key sl-ob1-profiles introduced,
# because the inventory generator needs to know which profiles can be rendered
# TOGETHER and prose cannot tell it. Changes nothing operationally: no frontend
# profile is `default`, so nothing passes these flags today.
requires    = ["gpu"]
opt_in      = true
description = "the tailscale netns companion and its state backup; usable ONLY with `gpu`, whose service its network_mode names (frontend/docker-compose.yml:323)"

# --------------------------------------------------------------------------
[planes.memory]
# mnemory (the unified memory layer) + the ONLY cloud door.
# requires anchor: memory/docker-compose.yml:153-155 (ai-stack_llm-net).
# requires inference: memory/docker-compose.yml:54 (LLM_BASE_URL =
#   http://llama-cpp:8080/v1) and :56 (EMBED_BASE_URL =
#   http://llama-cpp-embed:8080/v1). Both are unconditional - mnemory cannot
#   embed or summarise without them.
compose  = "memory/docker-compose.yml"
lease    = "memory"
requires = ["anchor", "inference"]
optional = []
host     = []
keys     = ["MCP_API_KEY"]

[planes.memory.ports]
"8060" = "mnemory-cloud-gateway (loopback; the only cloud door)"

# --------------------------------------------------------------------------
[planes.search]
# Private Search Gateway: Mullvad VPN (all egress) + redis + SearXNG + gateway.
# requires anchor: search/docker-compose.yml:187-189 (ai-stack_default, which
#   is where OB1 and the frontend resolve `vpn` and `gateway` by name).
compose  = "search/docker-compose.yml"
lease    = "search"
requires = ["anchor"]
optional = []
host = [
  "/dev/net/tun and NET_ADMIN for the WireGuard kill-switch (search/docker-compose.yml:43-46)",
  "A Mullvad WireGuard account (key + addresses)",
]
keys = ["MULLVAD_WG_PRIVATE_KEY", "MULLVAD_WG_ADDRESSES"]

[planes.search.ports]
"8085" = "gateway (loopback REST / Tavily shim)"

# --------------------------------------------------------------------------
[planes.coder]
# little-coder control plane: open-terminal (executor) + little-coder (daemon)
# + lc-egress.
# requires anchor: coder/docker-compose.yml:226-228 (ai-stack_llm-net).
# requires inference: coder/docker-compose.yml:46 and :93 join llm-net FOR
#   llama-cpp, :65-66 exempt `llama-cpp` from the egress proxy, and the agent's
#   base_url is http://llama-cpp:8080/v1 (little-coder/config/little-coder.config.yaml:11,
#   little-coder/config/models.json:6). The daemon has no other model backend.
compose  = "coder/docker-compose.yml"
lease    = "coder"
requires = ["anchor", "inference"]
optional = []
host     = []
keys     = ["OPEN_TERMINAL_API_KEY"]

[planes.coder.ports]
"9091" = "little-coder Prometheus metrics (loopback)"

# --------------------------------------------------------------------------
[planes.ob1]
# Open Brain - the openbrain-* fleet, the wiki, the scheduled slice
# (docker-compose.scheduled.yml, pulled in by include: at
# OB1/docker/docker-compose.yml:15-16) and the Open Notebook trio.
# No env_file key: compose's project directory is OB1/docker, so it loads
# OB1/docker/.env natively - which is how every plane works since sl-env-split.
# requires anchor: OB1/docker/docker-compose.yml:1268-1286 (ai-stack_llm-net,
#   ai-stack_app-net, ai-stack_default - the last aliased `search-gw-net`).
# requires inference: OB1/docker/docker-compose.yml:116,120 (openbrain-mcp),
#   406,410, 444, 493,497, 568,571, 675,681, 846, 941, 977, 1173 - CHAT_API_BASE
#   and EMBEDDING_API_BASE across the fleet; OB1/docker/docker-compose.scheduled.yml:186,258.
# requires search: OB1/docker/docker-compose.yml:567 (openbrain-research
#   SEARCH_API_BASE -> http://gateway:8080), :637 (FETCH_PROXY_URL ->
#   http://vpn:8888), :982 (grounding-backfiller, same proxy) and
#   OB1/docker/docker-compose.scheduled.yml:190 (the digest chain's fetches). Defaults, not toggles: with
#   the search plane down these resolve to nothing and research/backfill fail.
# optional frontend: OB1/docker/docker-compose.yml:562 (openbrain-research
#   OWUI_BASE_URL -> http://openwebui:8080) - research pushes results into OWUI;
#   the rest of the fleet does not care.
# optional agent-org: OB1/docker/docker-compose.scheduled.yml:253
#   (openbrain-idea-refinery MATTERMOST_URL defaults to
#   http://host.docker.internal:8065) under the `idea-refinery` profile, which
#   is `default = true` below. THE ONLY EDGE IN THIS MANIFEST THAT DOES NOT
#   CROSS A DOCKER NETWORK: it goes out to the host and back in through the
#   loopback port this manifest declares at [planes.agent-org.ports] "8065",
#   via `extra_hosts: host.docker.internal:host-gateway`. Gated in practice by
#   IDEA_REFINERY_MM_TOKEN (OB1/docker/docker-compose.scheduled.yml:254, blank by default); it is set on
#   this host. The cluster transition has to treat this one specially - a host
#   hop does not follow a plane to another node.
compose  = "OB1/docker/docker-compose.yml"
lease    = "open-brain"
requires = ["anchor", "inference", "search"]
optional = ["frontend", "agent-org"]
host = [
  "Google OAuth client + tokens under OB1/secrets/google/ for the scheduled digest chain (OB1/docker/docker-compose.scheduled.yml:69-74,103-104,134-135)",
  "The OB1 submodule checked out (git submodule update --init)",
  "A speech-to-text server on the HOST at :8000 for openbrain-extract's audio/video path (OB1/docker/docker-compose.yml:894 STT_API_BASE defaults to http://host.docker.internal:8000, reached via extra_hosts at :897-898) - a host service, not a plane",
]
keys = ["MCP_ACCESS_KEY", "POSTGRES_PASSWORD", "OPS_GATEWAY_KEY", "OPENBRAIN_GATEWAY_KEY"]

[planes.ob1.ports]
"3001" = "openbrain-rest (PostgREST)"
"5055" = "open_notebook API"
"8003" = "surrealdb"
"8061" = "openbrain-gateway (cloud door)"
"8062" = "openbrain-ops-gateway (ops door)"
"8503" = "open_notebook UI"
"8810" = "openbrain-entity-worker"
"8811" = "openbrain-wiki (compiler)"
"8812" = "openbrain-wiki-viewer (Quartz)"
"8813" = "openbrain-suggestion-worker"
"8814" = "openbrain-workbench"
"8815" = "openbrain-extract (debug)"
"8816" = "openbrain-curator"
"8817" = "openbrain-chunk-worker"
"8818" = "openbrain-research"
"8819" = "openbrain-grounding-backfiller"

[planes.ob1.profiles.idea-refinery]
# requires research: openbrain-idea-refinery's ONLY engine is openbrain-research
# (OB1/docker/docker-compose.scheduled.yml RESEARCH_URL;
# OB1/integrations/openbrain-idea-refinery/index.ts:268 submits the job, :295
# polls it - the path needs its OB1/ prefix or nothing resolves it). Found by
# this item's TESTER, not by its developer, who grepped the compose files and so
# never saw it. Without this line the plane's one `default = true` profile starts
# a drain with no engine - `stack.py enable ob1` and `enable open-brain --headless`
# both did - and it comes up healthy and produces nothing. Not a fetch that
# crashes; a queue that never empties.
#
# WHY NOT THE OTHER TWO FIXES. Marking `research` itself `default = true` would
# make --headless a no-op for this plane (default profiles survive it), which is
# the entire point of the surfaces split. Dropping `default` from idea-refinery is
# the better long-term answer - its own compose comment says it should be off
# until deliberately enabled, and it is on here only because stack.ps1 has always
# passed it - but that STOPS a container that has been up for days, and this item
# deploys nothing. Left for the operator / sl-driver-parity.
#
# CONSEQUENCE, stated rather than discovered later: `enable open-brain --headless`
# now yields `idea-refinery, research` instead of `idea-refinery` alone. A headless
# knowledge core pulls the research engine in, because the profile the driver
# always passes needs it. That is the honest resolution of a contradiction that
# was already there; removing `default` is what removes the research engine.
description = "the idea-refinery drain; scripts/stack/stack.ps1 passes this on every OB1 invocation"
default     = true
requires    = ["research"]

# The three below became real in OB1 on 2026-09-19 (sl-ob1-profiles). They are
# `opt_in`, never `default`: `default` means "passed on every invocation" AND it
# survives --headless, and the whole point of the research product's surfaces
# split is that --headless can drop wiki and notebook. `opt_in` is the flag for
# "something other than the driver's defaults turns this on" - here, a PRODUCT
# (`enable research`, `enable open-brain`, `enable digest`) or the `requires`
# edge from idea-refinery.
#
# HOW sl-ob1-profiles' stack.ps1 ROW WAS RECONCILED (sl-driver-parity): that
# script is now a shim with no plane registry, so its four-profile line has no
# landing place and is not carried forward. The equivalent is the DRIVER'S
# STATE. Today's host has no .stack/state.json, so `stack.ps1 up` -> `stack.py
# up --all` passes idea-refinery plus research (the `requires` closure) and
# nothing else - which starts exactly the same 30 containers, because the PINNED
# OB1 gitlink (5005197) does not carry these three profiles at all and compose
# ignores a profile it does not know. AFTER THE GITLINK BUMPS that stops being
# true: wiki and notebook would then gate seven running containers that a bare
# `up` no longer starts. The operator runs `stack.py init --product research`
# (or `enable research`) once, at that bump, and the state file carries them
# from then on. That is the wave-4 step; it is recorded in
# documentation/notes/stack-layers-sl-driver-parity-findings.md and in
# `inventory --check`'s own `[declared, not rendered]` output.

[planes.ob1.profiles.research]
# OB1/docker/docker-compose.yml: openbrain-research + openbrain-curator, which
# exists only to place research output. NOT the grounding backfiller - this
# description used to claim it, and the backfiller is core: it drains
# `ungrounded_claims` for every inlet, not just research (its own comment at
# OB1/docker/docker-compose.yml, "general brain-health"), so it renders with no
# profile at all.
description = "the research engine: openbrain-research + openbrain-curator; the `research` and `digest` products enable it, and `idea-refinery` requires it"
opt_in      = true

[planes.ob1.profiles.wiki]
description = "the wiki compiler, the Quartz viewer, the workbench and the wiki backup (a SURFACE); the `open-brain` and `research` products enable it, and --headless drops it"
opt_in      = true

[planes.ob1.profiles.notebook]
description = "the Open Notebook trio: surrealdb + open_notebook + its backup; a SURFACE of the `research` product, and an engine PROFILE of `digest` (openbrain-podcast renders through it)"
opt_in      = true

# --------------------------------------------------------------------------
[planes.agent-org]
# Mattermost + agent-bridge (the governed org bus) + profile-gated slices.
# No env_file key - project directory agent-org/docker loads its own .env,
# the same way every plane does since sl-env-split.
# requires anchor: agent-org/docker/docker-compose.yml:748-750 (ai-stack_llm-net).
# requires inference: agent-org/docker/docker-compose.yml:127
#   (AO_LOCAL_API_BASE = http://llama-cpp:8080/v1) and :257 (agent-bridge joins
#   llm-net for the alias); :372-373,457-458 exempt llama-cpp from the workers'
#   egress proxy.
# NOT an edge: the worker slices RUN images the coder plane BUILDS
#   (little-coder:local at :345,:437; little-coder-open-terminal:local at
#   :399,:480). That is a build-time dependency on the IMAGES, not on the coder
#   plane being up - agent-org talks to no coder container.
# CONSIDERED, NOT AN EDGE - agent-org -> ob1: agent-org/docker/docker-compose.yml:198
#   (AO_OPENBRAIN_URL -> http://openbrain-mcp:8000) and :208 (AO_RESEARCH_URL ->
#   http://openbrain-research:8000) do name ob1-plane services, but both sit
#   behind toggles that default OFF - :197 AO_OPENBRAIN_MIRROR_ENABLED false,
#   :207 AO_GROUNDING_ENABLED false - so a default boot never reaches for ob1
#   and nothing degrades when ob1 is down. By the toggle rule in this file's
#   header that makes it a latent integration, not an edge. If either default
#   flips to true, it becomes an `optional` edge and belongs in the list below.
compose  = "agent-org/docker/docker-compose.yml"
lease    = "agent-org"
requires = ["anchor", "inference"]
optional = []
host = [
  "Images little-coder:local and little-coder-open-terminal:local must exist for the `workers` profile (built by the coder plane)",
  "An OpenRouter key for the `cloud` profile (OPENROUTER_API_KEY in agent-org/docker/.env)",
]
keys = ["MM_DB_PASSWORD", "AO_DB_PASSWORD"]

[planes.agent-org.ports]
"8065" = "mattermost (loopback; the org's own surface)"
"8830" = "agent-bridge control/debug (loopback)"

# Both slices are OPERATOR-DRIVEN and always have been: scripts/stack/stack.ps1's
# header said so in as many words ("NOT managed here (deliberate): ... the
# agent-org workers/cloud profiles"), and the driver keeps that promise. They run
# on this host because the operator started them, not because `up` did.
[planes.agent-org.profiles.workers]
description = "the ao-worker / ao-ot / ao-git-egress slices; started by the operator, never by `up`"
opt_in      = true

[planes.agent-org.profiles.cloud]
description = "the cloud lane (the only component with internet egress); needs OPENROUTER_API_KEY"
opt_in      = true

# --------------------------------------------------------------------------
[planes.portal]
# The internet-exposed auth front-end. MANUAL on purpose: exposing the stack
# stays a human action, exactly as scripts/stack/stack.ps1's header says.
# requires anchor: portal/docker-compose.yml:632-634 (app-net, external: true,
#   name: ai-stack_app-net). RE-DERIVED 2026-09-19 (sl-env-split): these two
#   read :603-605 and :601-602, which were ALREADY four lines short of the
#   blocks they name at base 4934529 - :603 was `notify-net:`. Corrected to the
#   real lines, then shifted by the +25 this item added to that file's header.
# requires frontend: portal/docker-compose.yml:630-631 - caddy joins
#   ai-stack_app-net "to reach openwebui:8080 and open_notebook", and
#   config/caddy/Caddyfile:197 proxies openwebui:8080. Without the frontend the
#   portal's primary vhost 502s.
# optional ob1: config/caddy/Caddyfile:143 (openbrain-wiki-viewer:8080), :136
#   (openbrain-workbench:8000), :242/:250 (open_notebook) - those vhosts 502
#   while the rest of the portal serves.
# optional inference: config/caddy/Caddyfile:295 proxies llm-gateway-ui:8080,
#   which joins ai-stack_app-net for exactly that (inference/compose/gateway.yml:173,
#   networks at :182-184).
compose  = "portal/docker-compose.yml"
lease    = "portal"
requires = ["anchor", "frontend"]
optional = ["ob1", "inference"]
manual   = "scripts/portal/portal-on.ps1 / scripts/portal/portal-off.ps1"
host = [
  "A Cloudflare tunnel (token) and a public domain; the portal publishes NO host ports - all ingress arrives through cloudflared",
]
keys = [
  "CLOUDFLARE_TUNNEL_TOKEN",
  "AUTHELIA_JWT_SECRET",
  "AUTHELIA_SESSION_SECRET",
  "AUTHELIA_STORAGE_ENCRYPTION_KEY",
  "PUBLIC_DOMAIN",
]

[planes.portal.ports]

[planes.portal.profiles.internet]
description = "cloudflared + the tunnel watcher; passed by scripts/portal/portal-on.ps1, never by the driver (this plane is `manual`)"
opt_in      = true


# ==========================================================================
# PRODUCTS - vertical slices. `enable <product>` enables every plane listed
# (plus everything those planes require), every profile under [profiles], and
# every profile under [surfaces] unless --headless is passed. A plane named
# ONLY in [surfaces] is itself dropped by --headless.
# ==========================================================================

[products.chat]
description = "Open WebUI on its own - what a fresh clone gets"
planes      = ["frontend"]

[products.inference]
description = "the LLM front door and the local llama.cpp backends"
planes      = ["inference"]
profiles    = { inference = ["local"] }

[products.memory]
description = "mnemory, the unified memory layer, and its cloud door"
planes      = ["memory"]

[products.search]
description = "the private search gateway (SearXNG behind Mullvad)"
planes      = ["search"]

[products.open-brain]
# The knowledge core IS the ob1 plane's unprofiled render (store, doors,
# coherence workers, backup) since sl-ob1-profiles - no profile needed for it.
# The wiki is its reading surface, so --headless drops it and leaves the core.
description = "the Open Brain knowledge core"
planes      = ["ob1"]
surfaces    = { ob1 = ["wiki"] }

[products.research]
description = "the research engine: OB1 + inference + search, read through OWUI, the wiki and Open Notebook"
planes      = ["inference", "search", "ob1", "frontend"]
profiles    = { ob1 = ["research"] }
surfaces    = { ob1 = ["wiki", "notebook"] }

[products.coding-agent]
description = "little-coder; its surface is Open WebUI (PLAN section 1)"
planes      = ["coder"]
surfaces    = { frontend = [] }

[products.agent-org]
description = "the governed multi-agent org; Mattermost is its INTERNAL surface, so --headless drops nothing"
planes      = ["agent-org"]
profiles    = { agent-org = ["workers"] }

[products.digest]
# `notebook` is a PROFILE here, not a surface: openbrain-podcast - the chain's
# tail, and always-on core in OB1's scheduled slice - renders its audio through
# Open Notebook (ON_BASE -> http://open_notebook:5055,
# OB1/docker/docker-compose.scheduled.yml) and gets its enrichment from
# openbrain-research (RESEARCH_URL, same file). Both are engine dependencies of
# the chain, so --headless must NOT drop them; a headless digest with no
# notebook is a chain that silently produces no episode.
description = "the scheduled digest chain inside OB1 (gmail pull -> research -> podcast -> digest)"
planes      = ["inference", "search", "ob1"]
profiles    = { ob1 = ["research", "notebook"] }

[products.portal]
description = "the internet front-end (started by hand: portal-on.ps1)"
planes      = ["portal", "frontend"]
profiles    = { portal = ["internet"] }
