# ao-git-egress tinyproxy — agent-org override of the little-coder egress image.
# Identical to little-coder's egress except the Filter points at the SHARED volume file the
# agent-bridge writes (/egress/egress-allowlist.txt), so the worker git-egress scope is remotely
# mutable via Mattermost (/project add, /egress allow) with no rebuild. Default-deny (governance §5).
Port 8888
Listen 0.0.0.0
Timeout 600

# Clients are on the internal ao-worker-net only — a broad Allow is safe; the host allowlist below
# is the real control.
Allow 0.0.0.0/0

FilterDefaultDeny Yes
Filter "/egress/egress-allowlist.txt"
FilterExtended On
FilterCaseSensitive Off

# HTTPS git remotes (CONNECT 443) + SSH git remotes (CONNECT 22).
ConnectPort 443
ConnectPort 22

DisableViaHeader Yes
LogLevel Warning
