[project]
name = "agent-bridge"
version = "0.1.0"
description = "Governance-gated orchestration bridge between Mattermost and the little-coder worker pool (teams-chat-agent-orchestration)."
requires-python = ">=3.11"
readme = "README.md"

# Runtime deps are pinned in requirements.txt (the Docker image installs from there).
# Test-only deps here so `pip install -e .[test]` gets a minimal, DB-light test env
# that can run the deterministic gate/scheduler/ledger tests without asyncpg/openai.
[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "SQLAlchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "fastapi>=0.115",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
