# Docker Compose override for autonomous Tailscale management
# This file ensures Tailscale automatically restarts when OpenWebUI is updated

services:
  # Enhanced Tailscale configuration for autonomous operation
  tailscale:
    # Restart policy that handles failures
    restart: unless-stopped
    
    # Labels for Watchtower coordination  
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "com.centurylinklabs.watchtower.scope=ignore"
      
    # Dependency to ensure proper startup order
    depends_on:
      openwebui:
        condition: service_healthy
        
    # Health check to monitor connectivity
    healthcheck:
      test: ["CMD", "sh", "-c", "ping -c 1 8.8.8.8 >/dev/null 2>&1 && tailscale --socket=/tmp/tailscaled.sock status >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # mnemory must reach llama-cpp/llama-cpp-embed on the internal-only
  # `llm-net` (no gateway, so Docker silently drops its `ports:` mapping).
  # Joining the non-internal `default` bridge as well makes the base
  # `127.0.0.1:8050/8051` publish take effect so host clients (Claude Code
  # MCP) can reach it. llama-cpp stays internal-only and unaffected.
  mnemory:
    networks:
      - llm-net
      - default
